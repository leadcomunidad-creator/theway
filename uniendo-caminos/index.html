<style>
/* ===== PIEL DE «UNIENDO CAMINOS» =====
   Identidad propia del curso (Maestro V2, F.2). Colores tomados de la portada del libro de Parrott
   (blanco, turquesa, gris y la luz dorada del camino), sin copiar su foto. Decisión de Juan, 24-nov-2026. */
:root{
  /* nombres heredados: --terra = turquesa principal, --oro = dorado, --vino = turquesa profundo */
  --vino:#0F6E6E;--vino-d:#0B4F51;--terra:#128583;--terra-s:#DDF2F1;--oro:#D9962E;--turq:#2AB3B1;
  --fondo:#F7FBFB;--papel:#FFFFFF;--tinta:#2E3338;--suave:#5F6A70;--linea:#DCE7E7;--ok:#2F7A5A;--ok-s:#E3F2EA;--alerta:#FFF6E8;--alerta-b:#E9B060;
  --radio:16px;--sombra:0 1px 2px rgba(11,79,81,.06),0 8px 24px rgba(11,79,81,.07);
  --serif:'Montserrat',system-ui,sans-serif;--sans:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif;--display:'Bebas Neue',var(--sans);
}
@media (prefers-color-scheme:dark){:root{
  --fondo:#0F1A1B;--papel:#162426;--tinta:#E6F0F0;--suave:#A9BABB;--linea:#24393B;--terra:#2AB3B1;--terra-s:#173B3B;--ok-s:#1B3529;--alerta:#33291A;--vino:#7FD3D1;--vino-d:#0A1516;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font:17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.barra{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--vino-d);color:#fff}
.marca{background:none;border:0;color:inherit;text-align:left;padding:0;display:flex;flex-direction:column;line-height:1.1}
.marca-t{font-family:var(--serif);font-size:19px;font-weight:600}
.marca-s{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.barra .btn-txt{color:#fff;opacity:.85}
.hoja{max-width:720px;margin:0 auto;padding:20px 16px 40px}
.pie{max-width:720px;margin:0 auto;padding:16px 16px 40px;color:var(--suave);font-size:13px;text-align:center}
.candado{display:inline-block;width:10px;height:12px;border:2px solid currentColor;border-radius:2px;margin-right:4px;vertical-align:-1px;position:relative}
.candado:before{content:'';position:absolute;left:0;top:-8px;width:6px;height:7px;border:2px solid currentColor;border-bottom:0;border-radius:5px 5px 0 0}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.25;color:var(--tinta)}
h1{font-size:clamp(28px,7vw,40px);margin:.2em 0 .3em}
h2{font-size:24px;margin:.2em 0 .5em}
h3{font-size:20px;margin:1.6em 0 .5em}
h4{font-size:17px;margin:1.2em 0 .4em}
p{margin:.6em 0}
.sobre{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--terra);font-weight:700;margin:0}
.lema{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--terra);margin:0 0 .6em}
.nota{font-size:14px;color:var(--suave)}
.error{color:#B3261E;font-size:14px;min-height:1.2em}
.aviso{background:var(--terra-s);border-radius:12px;padding:12px 14px;font-size:15px}
.alerta{background:var(--alerta);border-left:4px solid var(--alerta-b);border-radius:10px;padding:12px 14px;font-size:15px;margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:999px;border:0;background:var(--terra);color:#fff;font-weight:700;text-decoration:none}
.btn:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.6;cursor:default}
.btn.sec{background:transparent;color:var(--terra);box-shadow:inset 0 0 0 2px var(--terra)}
.btn.peligro{background:#9B2C2C}
.btn-txt{background:none;border:0;color:var(--terra);text-decoration:underline;padding:8px 4px}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.centro{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.centro-t{text-align:center}
.giro{width:36px;height:36px;border-radius:50%;border:3px solid var(--linea);border-top-color:var(--terra);animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.giro{animation:none}}
.portada{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px;background:linear-gradient(180deg,#FFFFFF 0%,#FFFDF8 45%,#FBF1DF 100%);color:#2E3338;border-top:10px solid var(--turq);border-bottom:10px solid var(--turq)}
.portada-in{max-width:540px;text-align:center}
.portada h1{margin:.1em 0 .1em;font-family:var(--serif);line-height:1}
.portada h1 .t1{display:block;font-weight:400;font-size:clamp(26px,7vw,38px);letter-spacing:.06em;text-transform:uppercase;color:#4A5057}
.portada h1 .t2{display:block;font-weight:500;font-size:clamp(46px,13vw,76px);letter-spacing:.02em;text-transform:uppercase;color:var(--turq)}
.portada .lema{color:var(--turq);margin-top:.4em}
.portada .sobre{color:#7A8288}
.portada .nota{color:#5F6A70}
.portada .btn{background:var(--terra)}
.portada .btn-txt.claro{color:var(--terra);padding:0}
@media (prefers-color-scheme:dark){.portada{background:linear-gradient(180deg,#0F1A1B 0%,#142224 55%,#1E2A24 100%);color:#E6F0F0}.portada h1 .t1{color:#C9D6D7}.portada .sobre,.portada .nota{color:#A9BABB}}
.caminos{display:block;width:min(380px,88vw);height:auto;margin:0 auto 10px}
.versiculo{font-family:var(--serif);font-style:italic;font-size:17px;color:#4A5057;margin:14px auto 18px;max-width:420px}
.versiculo span{display:block;font-style:normal;font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--oro);margin-top:4px}
@media (prefers-color-scheme:dark){.versiculo{color:#D7E3E3}}
.claves{list-style:none;padding:0;margin:18px auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px}
.claves li{background:#fff;border:1px solid #CFEAE9;border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 14px rgba(11,79,81,.06)}
@media (prefers-color-scheme:dark){.claves li{background:#162426;border-color:#24393B;box-shadow:none}}
.claves b{font-family:var(--display);font-size:30px;letter-spacing:.04em;color:var(--turq);line-height:1}
.claves span{font-size:12px;line-height:1.3;color:#5F6A70}
@media (prefers-color-scheme:dark){.claves span{color:#A9BABB}}
@media (max-width:460px){.claves{grid-template-columns:repeat(2,1fr)}}
.portada .intro{color:inherit;max-width:440px;margin:12px auto 22px}
.portada .privado{font-size:13px;color:#7A8288;margin-top:22px}
.tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);padding:18px 18px 20px;margin:16px 0;box-shadow:var(--sombra)}
.tarjeta.estrecha{max-width:440px;margin:24px auto}
.tarjeta h3{margin-top:0}
.tarjeta.hoy{border-left:5px solid var(--terra)}
.tarjeta.pareja.ok{background:var(--ok-s);border-color:transparent}
.codigo{font-family:var(--display);font-size:40px;letter-spacing:.12em;text-align:center;color:var(--vino);margin:8px 0}
.hero{padding:8px 0 4px}
.progreso{height:8px;background:var(--linea);border-radius:99px;overflow:hidden}
.progreso span{display:block;height:100%;background:linear-gradient(90deg,var(--terra),var(--oro))}
.semana h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.semana h3 span{font-family:var(--display);font-size:22px;letter-spacing:.06em;color:var(--terra)}
.trata{color:var(--suave);font-size:15px;margin-top:0}
.dias{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.dia{width:100%;display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--linea);background:var(--papel);color:var(--tinta)}
.dia-n{font-family:var(--display);font-size:20px;letter-spacing:.05em;color:var(--terra)}
.dia-t{font-weight:500;line-height:1.3}
.dia-e{font-size:12px;color:var(--suave);text-align:right}
.dia.hecha{background:var(--ok-s);border-color:transparent}
.dia.hecha .dia-e{color:var(--ok);font-weight:700}
.dia.cerrada{opacity:.55;cursor:default}
@media (max-width:420px){.dia{grid-template-columns:40px 1fr}.dia-e{grid-column:2;text-align:left}}
label.campo-l{display:block;font-weight:600;margin:14px 0 4px}
input[type=password],input[type=text],select,textarea{width:100%;font:inherit;color:var(--tinta);background:var(--papel);border:1.5px solid var(--linea);border-radius:12px;padding:12px 14px;margin-top:6px}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--terra);box-shadow:0 0 0 3px rgba(196,106,74,.18)}
.jornada .meta{color:var(--suave);font-size:15px}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:var(--terra-s);color:var(--vino);margin-right:6px}
.modo-pareja .chip{background:var(--vino);color:#fff}
.texto blockquote{margin:16px 0;padding:12px 16px;border-left:4px solid var(--oro);background:var(--papel);border-radius:0 12px 12px 0;font-family:var(--serif);font-style:italic;font-size:17px}
.texto blockquote p{margin:.3em 0}
.texto ul,.texto ol{padding-left:1.3em}
.texto li{margin:.25em 0}
.tabla{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--linea);padding:8px;text-align:left;vertical-align:top}
hr{border:0;border-top:1px solid var(--linea);margin:24px 0}
.ej{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:14px;margin:12px 0}
.ej-l{display:block;font-weight:600;line-height:1.4}
.ej-a{font-size:15px;color:var(--suave)}
.ej-a ul{margin:.3em 0;padding-left:1.2em}
.form-pareja{background:var(--terra-s);border-radius:var(--radio);padding:16px;margin:20px 0}
.form-pareja h3{margin-top:0}
.cierre{display:flex;flex-direction:column;align-items:center;gap:8px;margin:28px 0 8px}
.nav-j{display:flex;justify-content:space-between;gap:12px;margin-top:16px}
fieldset.esc{border:1px solid var(--linea);border-radius:12px;padding:10px 14px;margin:10px 0;background:var(--papel)}
fieldset.esc legend{padding:0 4px;font-weight:500}
.radios{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.r{position:relative}
.r input{position:absolute;opacity:0;inset:0;margin:0}
.r span{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--linea);font-weight:700}
.r.ancho span{width:auto;padding:0 18px;border-radius:99px}
.r input:checked+span{background:var(--terra);border-color:var(--terra);color:#fff}
.r input:focus-visible+span{box-shadow:0 0 0 3px rgba(196,106,74,.35)}
.antes{display:inline-block;margin-top:6px;font-size:13px;color:var(--suave)}
.privada{background:var(--papel);border:2px dashed var(--alerta-b);border-radius:var(--radio);padding:16px;margin:24px 0}
.olvido{margin-top:18px}
.olvido summary{color:var(--terra);cursor:pointer}
/* ===== LANDING DEL CURSO (lc-) · misma arquitectura que el de Metanoia, identidad propia ===== */
.lc{--lc-bg:#FBFAF6;--lc-card:#FFFFFF;--lc-tx:#2E3338;--lc-mu:#5F6A70;--lc-ln:#E3ECEC;--lc-t:#1C8F8D;--lc-td:#0B4F51;--lc-g:#D9962E;background:var(--lc-bg);color:var(--lc-tx);min-height:100vh}
@media (prefers-color-scheme:dark){.lc{--lc-bg:#0F1A1B;--lc-card:#162426;--lc-tx:#E6F0F0;--lc-mu:#A9BABB;--lc-ln:#24393B;--lc-t:#4CC7C4;--lc-td:#9FE0DE;--lc-g:#E8B25A}}
.lc a{color:inherit}
.lc-hero{position:relative;background:linear-gradient(180deg,#FFFFFF 0%,#FFFBF2 55%,#F8EDD8 100%);border-top:10px solid var(--turq);overflow:hidden}
@media (prefers-color-scheme:dark){.lc-hero{background:linear-gradient(180deg,#0F1A1B 0%,#152427 60%,#1F2B25 100%)}}
.lc-mm{position:absolute;z-index:2;top:16px;left:16px;display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--lc-ln);background:rgba(255,255,255,.85);color:var(--lc-td)!important;font:600 13px var(--sans);text-decoration:none;backdrop-filter:blur(6px)}
@media (prefers-color-scheme:dark){.lc-mm{background:rgba(15,26,27,.7)}}
.lc-hero-in{max-width:1160px;margin:0 auto;padding:68px 20px 34px;display:grid;gap:8px;justify-items:center;text-align:center}
.lc-art .caminos{width:min(460px,92vw);margin:0}
.lc-eye{margin:4px 0 0;font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--lc-mu)}
.lc-tit h1{margin:.15em 0 .1em;font-family:var(--serif);line-height:.98}
.lc-tit .t1{display:block;font-weight:400;font-size:clamp(26px,7vw,40px);letter-spacing:.08em;text-transform:uppercase;color:#4A5057}
.lc-tit .t2{display:block;font-weight:500;font-size:clamp(50px,14vw,92px);letter-spacing:.02em;text-transform:uppercase;color:var(--turq)}
@media (prefers-color-scheme:dark){.lc-tit .t1{color:#C9D6D7}}
.lc-tag{margin:.3em 0 0;font:italic 500 clamp(19px,4.6vw,24px) var(--serif);color:var(--lc-t)}
.lc-vers{margin:14px auto 0;max-width:440px;font:italic 400 16.5px/1.5 var(--serif);color:var(--lc-mu)}
.lc-vers span{display:block;margin-top:4px;font:700 11.5px var(--sans);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--lc-g)}
.lc-hcta{display:none}
.lc-cta{width:100%;min-height:54px;border-radius:16px;font-size:16px;background:var(--lc-t)!important;color:#fff;text-decoration:none;box-shadow:0 8px 22px rgba(18,133,131,.25)}
.lc-nota{margin:8px 0 0;font-size:13px;color:var(--lc-mu);text-align:center}
.lc-nota .btn-txt{color:var(--lc-t);padding:0;font-size:13px}
.lc-g{max-width:1160px;margin:0 auto;padding:22px 20px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:36px;align-items:start}
.lc-m{min-width:0}
.lc-f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lc-f div{background:var(--lc-card);border:1px solid var(--lc-ln);border-radius:16px;padding:14px 14px 12px;box-shadow:0 4px 16px rgba(11,79,81,.05)}
.lc-f b{display:block;font:400 34px/1 'Bebas Neue',var(--sans);letter-spacing:.02em;color:var(--lc-t)}
.lc-f span{display:block;margin-top:3px;font-size:12.5px;line-height:1.35;color:var(--lc-mu)}
.lc-intro{margin-top:22px;font-size:17.5px;line-height:1.65}
.lc-intro p{margin:0 0 .85em}
.lc-intro p:first-child{font:italic 400 19px/1.55 var(--serif);color:var(--lc-td)}
.lc-sec{padding-top:30px;margin-top:30px;border-top:1px solid var(--lc-ln)}
.lc-h{margin:0 0 12px;font:600 21px/1.15 var(--serif);letter-spacing:.08em;text-transform:uppercase;color:var(--lc-td)}
.lc-s{margin:-4px 0 14px;font-size:14px;line-height:1.5;color:var(--lc-mu)}
.lc-s.lc-c{margin:8px 0 0;text-align:center;font-size:12.5px}
.lc-wks{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.lc-wk{position:relative;background:var(--lc-card);border:1px solid var(--lc-ln);border-radius:18px;padding:16px 16px 14px 20px;overflow:hidden}
.lc-wk:before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.lc-wk small{display:block;font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.lc-wk b{display:block;margin-top:2px;font:600 20px/1.2 var(--serif)}
.lc-wk em{display:block;margin-top:2px;font:italic 400 15px var(--serif);color:var(--lc-mu)}
.lc-wk p{margin:8px 0 10px;font-size:15px;line-height:1.55}
.lc-ac{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--lc-tx);font:600 12.5px var(--sans)}
.lc-ac svg{width:15px;height:15px;fill:none;stroke:var(--c);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.lc-how{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.lc-how>div,.lc-card{background:var(--lc-card);border:1px solid var(--lc-ln);border-radius:18px;padding:16px}
.lc-how b,.lc-card b{display:block;margin:10px 0 4px;font:600 17px var(--serif)}
.lc-how p,.lc-card p{margin:0;font-size:15px;line-height:1.55;color:var(--lc-mu)}
.lc-i{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--lc-t) 13%,transparent)}
.lc-i svg,.lc-ti svg{width:24px;height:24px;fill:none;stroke:var(--lc-t);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lc-semana{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lc-semana li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--lc-card);border:1px solid var(--lc-ln)}
.lc-semana li.cita{border-color:var(--lc-g);background:color-mix(in srgb,var(--lc-g) 9%,var(--lc-card))}
.lc-semana li.cita .lc-ti{background:color-mix(in srgb,var(--lc-g) 20%,transparent)}
.lc-semana li.cita .lc-ti svg{stroke:var(--lc-g)}
.lc-ti{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--lc-t) 12%,transparent)}
.lc-semana small{display:block;font:700 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--lc-mu)}
.lc-semana b{display:block;font:600 16px var(--serif)}
.lc-semana p{margin:2px 0 0;font-size:14px;line-height:1.45;color:var(--lc-mu)}
.lc-dots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:20px 0 0}
.lc-dots div{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.lc-dots span{display:flex;gap:5px;align-items:center}
.lc-dots i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.lc-dots i.cita{width:14px;height:14px;background:transparent;border:3px solid var(--c)}
.lc-dots small{font-size:10.5px;line-height:1.2;text-align:center;letter-spacing:.04em;color:var(--lc-mu)}
