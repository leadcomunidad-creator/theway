<style>
/* Inscripción a THE WAY · diseño «Registro Adaptable» (Design, 12-nov-2026): la montaña a un lado y los tres pasos al otro.
   Menos de 900 px: una columna con la imagen arriba. Sirve para cualquier curso del catálogo (?curso=ID). */
:root{--night:#080C12;--text:#EAE8E0;--soft:#B9C3C9;--muted:#8FA1AC;--gold:#C8A84B;--gold-l:#DEC06A;--green:#6DC48A;--ice:#A8C4D4;--ink:#100A00;--danger:#E58E8E;--line:rgba(255,255,255,.14);--field:#0E1620}
*{box-sizing:border-box;scrollbar-width:none}*::-webkit-scrollbar{width:0;height:0}[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--text);font:16px/1.5 'DM Sans',system-ui,sans-serif;min-height:100vh}
a{color:var(--gold-l)}button,input,select{font:inherit}
:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
.marco{display:flex;flex-direction:column;min-height:100vh}
.col{display:contents}.barra{order:0}.lado{order:1;flex:none}.perks.angosto{order:2}main{order:3;width:100%}
.lado{position:relative;overflow:hidden;height:300px}
.lado>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,18,.5) 0%,rgba(8,12,18,.12) 32%,rgba(8,12,18,.55) 64%,var(--night) 100%)}
.logo{position:absolute;left:20px;top:18px;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font:28px/1 'Bebas Neue',sans-serif;letter-spacing:.05em}
.logo span span{color:var(--gold)}
.escena{position:absolute;left:20px;right:20px;bottom:14px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--green)}
.titular{margin:6px 0 0;font:400 46px/.92 'Bebas Neue',sans-serif}.titular em{font-style:normal;color:var(--gold)}
.perks{list-style:none;margin:16px 20px 0;padding:0;display:grid;gap:9px}
.perks li{display:flex;gap:10px;align-items:center;font-size:14px;color:#C9D1D6}
.perks li::before{content:'✓';flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(109,196,138,.2);color:var(--green);font-weight:700;font-size:12px}
.barra{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 20px;border-bottom:1px solid rgba(255,255,255,.06)}
.volver{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:700;font-size:13px;white-space:nowrap}
.yo{margin-left:auto;text-align:right;font-size:12.5px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.yo button{background:none;border:0;color:var(--gold-l);cursor:pointer;padding:2px 0;text-decoration:underline;font-size:12.5px}
main{max-width:480px;margin:0 auto;padding:24px 20px 48px}
h1{margin:0;font:400 48px/.92 'Bebas Neue',sans-serif;letter-spacing:.01em}h1 em{font-style:normal;color:var(--gold)}
.lema{margin:10px 0 0;font-size:15px;line-height:1.55;color:var(--soft)}
.paso{display:flex;align-items:center;gap:10px;margin:30px 0 14px;font:400 21px 'Bebas Neue',sans-serif;letter-spacing:.08em}
.paso i{font-style:normal;font-size:18px;color:var(--gold)}
.paso.luego{opacity:.45;margin:14px 0}
.ficha{margin-top:22px;border-radius:18px;border:1.5px solid var(--gold);background:linear-gradient(135deg,rgba(200,168,75,.14),rgba(200,168,75,.04));padding:16px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.ficha b{display:block;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase}.ficha small{display:block;font-size:12.5px;color:var(--soft);margin-top:3px}
.precio{margin:0;margin-left:auto;text-align:right;font-weight:700;font-size:19px;color:var(--gold-l);white-space:nowrap}.precio small{font-weight:400}
.campos{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
label{display:block;font-weight:500;font-size:13px;color:var(--soft);margin-bottom:6px}
input[type=text],input[type=tel],input[type=email],select{width:100%;min-height:50px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--text)}
input:-webkit-autofill{-webkit-text-fill-color:var(--text);box-shadow:0 0 0 100px var(--field) inset}
.nota{margin:6px 0 0;font-size:12px;color:var(--muted)}
.caja{border:1px solid rgba(168,196,212,.22);background:rgba(168,196,212,.07);border-radius:14px;padding:13px 15px;margin:16px 0 0;font-size:14px;line-height:1.5;color:var(--soft)}
.caja b{color:var(--text)}.aviso{border-color:rgba(226,179,92,.55);background:rgba(226,179,92,.09)}
.valor{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}
.valor span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.valor b{font-size:19px}
.opcion{margin-top:14px;border:1px solid var(--line);background:var(--field);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.opcion:first-child{border-color:rgba(200,168,75,.55)}
.opcion div{flex:1;min-width:0}.opcion span{display:block;font-size:13px;color:var(--soft)}.opcion b{display:block;font-size:18px;overflow-wrap:anywhere;margin-top:2px}
.rec{display:inline-block!important;font-size:10.5px!important;font-weight:700;letter-spacing:.06em;background:rgba(200,168,75,.18);color:var(--gold-l)!important;border-radius:99px;padding:2px 9px;margin-bottom:5px}
.soltar{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:1.5px dashed rgba(168,196,212,.4);border-radius:18px;padding:26px 16px;cursor:pointer;background:rgba(168,196,212,.05);margin:0;color:var(--text)}
.soltar:hover,.soltar:focus-within{border-color:var(--gold)}.soltar.lleno{border-style:solid;border-color:var(--green);background:rgba(109,196,138,.08)}
.soltar svg{width:34px;height:34px;fill:none;stroke:var(--gold-l);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.soltar strong{font-size:15px;overflow-wrap:anywhere;max-width:100%}.soltar small{font-size:12.5px;color:var(--muted)}
.soltar input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.casilla{display:flex;gap:11px;align-items:flex-start;margin:20px 0 0;color:var(--soft);font-size:13.5px;line-height:1.5}
.casilla input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:12px 20px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;text-decoration:none;font-weight:700}
.btn.oro{width:100%;margin-top:16px;background:var(--gold);border-color:var(--gold);color:var(--ink);font:400 21px 'Bebas Neue',sans-serif;letter-spacing:.08em;border-radius:14px;min-height:54px}
.btn.oro.falta{opacity:.55}.btn.chico{min-height:38px;padding:6px 14px;font-size:13px}.btn[disabled]{opacity:.5;cursor:default}
.camino{list-style:none;margin:26px 0 0;padding:0}
.camino li{position:relative;display:flex;gap:14px;padding-bottom:22px}
.camino li:not(:last-child)::after{content:'';position:absolute;left:14px;top:34px;bottom:4px;border-left:2px dashed rgba(200,168,75,.35)}
.camino i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;border:1.5px dashed rgba(255,255,255,.28);color:var(--muted)}
.camino .hecho i{background:#3D7A54;border:0;color:#fff}.camino .ahora i{border:1.5px solid var(--gold);background:rgba(200,168,75,.18);color:var(--gold-l)}
.camino b{display:block;font-size:15px}.camino span{font-size:13px;color:var(--muted)}
.rutas{display:grid;gap:14px;margin-top:22px}
.rutas a{position:relative;display:block;height:170px;border-radius:18px;overflow:hidden;border:1px solid var(--line);text-decoration:none;color:var(--text)}
.rutas a:hover{border-color:var(--gold)}.rutas img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:68% 45%}
.rutas div{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,18,.1),rgba(8,12,18,.94));display:flex;flex-direction:column;justify-content:flex-end;padding:14px 16px}
.rutas b{font:400 30px/1 'Bebas Neue',sans-serif;letter-spacing:.03em}.rutas span{color:var(--gold-l);font-weight:700;font-size:14px}
.error{color:var(--danger);font-size:14px;min-height:1em;margin:12px 0 0}
.ayuda{margin:26px 0 0;font-size:13px;color:var(--muted);text-align:center}
.cargando{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.cargando{animation:none}}
@media(min-width:600px) and (max-width:899px){.lado{height:380px}.titular{font-size:58px}main{max-width:560px}.campos{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:900px){
  .marco{display:grid;grid-template-columns:minmax(0,1fr) 520px;align-items:start}
  .lado{position:sticky;top:0;height:100vh;order:0}.logo{left:48px;top:34px;font-size:31px}
  .escena{left:48px;right:48px;bottom:48px}.titular{font-size:clamp(52px,5vw,76px)}
  .perks{position:static;margin:20px 0 0}.perks li{font-size:15px}
  .col{order:1;display:block;min-height:100vh;border-left:1px solid rgba(255,255,255,.06)}
  .barra{padding:10px 40px}main{padding:34px 40px 56px}.campos{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(min-width:1200px){.marco{grid-template-columns:minmax(0,1fr) 560px}}
.ancha{grid-column:1/-1}
</style>

<body>
<div class="marco">
  <aside class="lado" aria-label="THE WAY">
    <img src="../assets/ligero/montana-inscripcion.webp" alt="" id="foto">

    <a class="logo" href="../"><svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><polygon points="2,56 15,29 28,56" fill="#A8C4D4"/><polygon points="36,56 50,25 62,56" fill="#2B4A70"/><polygon points="12,56 32,8 52,56" fill="#C8A84B"/></svg><span>THE <span>WAY</span></span></a>
    <div class="escena"><div class="eyebrow" id="eyebrow">Empieza desde adentro</div><p class="titular" id="titular">Tu mochila <em>está lista.</em></p><ul class="perks ancho" id="perksA"></ul></div>
  </aside>
  <div class="col">
    <header class="barra"><a class="volver" href="../">‹ THE WAY</a><div class="yo" id="yo" hidden><span id="yoCorreo"></span><br><button type="button" id="salir">Usar otra cuenta</button></div></header>
    <ul class="perks angosto" id="perksM"></ul>
    <main id="main" aria-live="polite"><p style="text-align:center;margin-top:12vh"><span class="cargando" aria-hidden="true"></span></p></main>
  </div>
</div>
<style>[hidden]{display:none!important}.modos{border:0;padding:0;margin:18px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}.modos legend{font:700 11px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-bottom:8px}.modos label{display:flex;gap:10px;align-items:center;border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:14px;cursor:pointer;margin:0}.modos label:has(:checked){border-color:#C8A84B;background:rgba(200,168,75,.12)}.modos input{width:20px;height:20px;flex:none;accent-color:#C8A84B}.modos b{display:block;font-size:15px;color:#EAE8E0}.modos small{display:block;font-size:13px;color:#DEC06A}.perks.ancho{display:none}@media(min-width:900px){.perks.ancho{display:grid}.perks.angosto{display:none}}</style>
<script src="../compartido/sesion.js"></script>
<script>
(function(){'use strict';
var WA='573173708570';
/* A dónde entra cada curso cuando ya hay acceso. Un curso nuevo sin ruta lleva al inicio. */
var RUTAS={metanoia:'../metanoia/',preparados:'../uniendo-caminos/'};
var MAX=880000; /* tope del comprobante guardado (texto), con margen bajo el de las reglas */
var $=function(id){return document.getElementById(id)};
/* Lo propio de cada curso. Un curso nuevo sin entrada usa los textos generales. */
var CURSOS_TXT={
  metanoia:{sub:'Acceso a THE WAY · 4 semanas, 20 jornadas',perks:['Protocolo Metanoia · 20 jornadas','Mi Mapa con las 3 expediciones','Bitácora privada y Mapa Personal']},
  preparados:{sub:'Para los dos · 4 semanas, 20 jornadas',perks:['Uniendo Caminos · 20 jornadas','4 citas de pareja y su Pacto','Lo que escriben va cifrado: solo ustedes lo leen']},
  general:{sub:'Acceso a THE WAY',perks:['Tu ruta dentro de THE WAY','Mi Mapa con las 3 expediciones','Acompañamiento durante el camino']}};
var ESCENAS={inicio:['Empieza desde adentro','Tu mochila','está lista.'],rutas:['Un camino · tres expediciones','Elige','tu ruta.'],espera:['Bienvenido a THE WAY','Nos vemos en','el camino.'],abierto:['Tu acceso está activo','Tu camino','está abierto.']};
function escena(k){var e=ESCENAS[k],x=CURSOS_TXT[CURSO]||CURSOS_TXT.general,li=x.perks.map(function(p){return'<li>'+esc(p)+'</li>'}).join('');
  $('eyebrow').textContent=e[0];$('titular').innerHTML=esc(e[1])+' <em>'+esc(e[2])+'</em>';$('perksA').innerHTML=li;$('perksM').innerHTML=li}
function paso(n,t,luego){return'<h2 class="paso'+(luego?' luego':'')+'"><i>0'+n+'</i>'+t+'</h2>'}
function camino(L){return'<ol class="camino">'+L.map(function(x,i){return'<li class="'+x[0]+'"><i>'+(x[0]==='hecho'?'✓':i+1)+'</i><div><b>'+x[1]+'</b><span>'+x[2]+'</span></div></li>'}).join('')+'</ol>'}
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pesos=function(n){return n>0?'$'+Number(n).toLocaleString('es-CO')+' COP':'Gratis'};
var CURSO=(new URLSearchParams(location.search).get('curso')||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40);
var db=null,yo=null,catalogo=null,perfil=null,ocupado=false,MODO='';
/* Opciones de un curso: «pareja» = solo en pareja; si no, «solo yo» y, cuando tiene precioPareja, también en pareja. */
function ofertas(c){if(c.pareja)return[{k:'pareja',precio:c.precio}];var L=[{k:'solo',precio:c.precio}];if(c.precioPareja>0)L.push({k:'pareja',precio:c.precioPareja});return L}
function elegida(){var L=ofertas(catalogo);return L.filter(function(o){return o.k===MODO})[0]||L[0]}
function textoOfertas(c){var L=ofertas(c);return L.length>1?pesos(L[0].precio)+' · en pareja '+pesos(L[1].precio):pesos(c.precio)+(c.pareja&&c.precio>0?' por pareja':'')}
function ts(){return firebase.firestore.FieldValue.serverTimestamp()}
function hoy(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Bogota'})}
function pintar(h){$('main').innerHTML=h+'<p class="ayuda">¿Tienes preguntas? <a href="https://wa.me/'+WA+'?text='+encodeURIComponent('Hola, necesito ayuda con mi inscripción en THE WAY'+(catalogo?' ('+catalogo.nombre+')':''))+'" target="_blank" rel="noopener">Escríbenos por WhatsApp</a></p>';window.scrollTo(0,0)}
function leer(ref){return ref.get().then(function(s){return s.exists?s.data():null})}
function ficha(sinPrecio){var x=CURSOS_TXT[CURSO]||CURSOS_TXT.general;
  var L=ofertas(catalogo),o=elegida();
  return'<div class="ficha"><div><b>'+esc(catalogo.nombre)+'</b><small>'+esc(x.sub)+'</small></div>'+(sinPrecio?'':'<p class="precio" id="precioFicha">'+(L.length>1&&!MODO?esc(pesos(L[0].precio))+'<br><small>solo tú</small><br>'+esc(pesos(L[1].precio))+'<br><small>en pareja</small>':esc(pesos(o.precio))+(o.k==='pareja'&&o.precio>0?'<br><small>por los dos</small>':''))+'</p>')+'</div>'}
function cabecera(a,b,lema){return'<h1>'+a+' <em>'+b+'</em></h1>'+(lema?'<p class="lema">'+lema+'</p>':'')}
function fallo(t){pintar('<h1>Algo no <em>salió bien.</em></h1><p class="lema">'+esc(t||'Revisa tu conexión e inténtalo de nuevo.')+'</p><button class="btn" type="button" onclick="location.reload()">Intentar de nuevo</button>')}

function listaDeCursos(){
  escena('rutas');
  return db.collection('catalogo').get().then(function(s){var L=[],IMG={metanoia:'mentalidad',preparados:'habilidad'};s.forEach(function(d){var c=d.data();if(c.abierto)L.push({id:d.id,c:c})});
    pintar(cabecera('Inscripciones','abiertas.','Entrar a THE WAY es gratis. Cada ruta se inscribe aparte.')+(L.length?'<div class="rutas">'+L.map(function(x){return'<a href="?curso='+esc(x.id)+'"><img alt="" src="../assets/v3/exp-'+(IMG[x.id]||'capacidad')+'.webp"><div><b>'+esc(x.c.nombre)+'</b><span>'+esc(textoOfertas(x.c))+'</span></div></a>'}).join('')+'</div>':'<div class="caja">Por ahora no hay inscripciones abiertas. Escríbenos y te avisamos cuando abra la próxima ruta.</div>'))})
}
function pantallaEntrar(){
  escena('inicio');
  pintar(cabecera('Tu','registro.','Tres pasos: tus datos, la transferencia y el comprobante.')+ficha()+
    (catalogo.abierto?'':'<div class="caja aviso">Las inscripciones de este curso están cerradas. Si ya tienes acceso o te invitaron, entra con tu cuenta.</div>')+
    paso(1,'Tus datos')+'<p class="nota" style="margin:0">Entra con tu cuenta de Google: con esa misma cuenta usarás el curso.</p><button class="btn oro" type="button" id="entrar">Entrar con Google</button><p class="error" id="err" role="alert"></p>'+
    (ofertas(catalogo).some(function(o){return o.precio>0})?paso(2,'Transferencia',true)+paso(3,'Comprobante',true):''));
  $('entrar').addEventListener('click',function(){TW_SESION.entrar().then(iniciar,function(e){if(e&&e.code!=='cancelado')$('err').textContent='No pudimos completar el ingreso. Inténtalo de nuevo.'})})
}
function yaTiene(){escena('abierto');pintar(cabecera('Ya tienes','acceso.','Entra con esta misma cuenta de Google.')+ficha(true)+'<a class="btn oro" href="'+esc(RUTAS[CURSO]||'../')+'">Empezar</a>')}
function enRevision(s){escena('espera');pintar(cabecera('Recibimos tu','inscripción.','Ya diste el primer paso. Esto es lo que sigue.')+
  camino([['hecho','Recibimos tu registro y tu comprobante','Quedó guardado con tu cuenta de Google.'],['ahora','Confirmamos tu pago','Lo revisamos y lo dejamos registrado.'],['','Activamos tu acceso','Se abre en esta misma cuenta.'],['','Te escribimos por WhatsApp','Con la bienvenida y cómo entrar.']])+
  '<button class="btn oro" type="button" onclick="location.reload()">Ver si ya está aprobado</button>')}
function aprobadaSinAcceso(){escena('espera');pintar(cabecera('Casi','listo.')+ficha(true)+'<div class="caja aviso">Tu pago aparece aprobado, pero no vemos el acceso. Escríbenos por WhatsApp y lo revisamos.</div>')}
function reclamar(origen){
  if(ocupado)return;ocupado=true;$('activar').disabled=true;
  var a={};a[CURSO]={activo:true,desde:hoy(),origen:origen};
  var ref=db.collection('derechos').doc(yo.uid);
  ref.get().then(function(s){
    if(!s.exists)return ref.set({apps:a,reclamo:CURSO});
    var c={reclamo:CURSO};c['apps.'+CURSO]=a[CURSO];return ref.update(c)
  }).then(yaTiene,function(e){console.error(e);ocupado=false;$('activar').disabled=false;$('err').textContent='No pudimos activar tu acceso. Inténtalo de nuevo o escríbenos.'})
}
function pantallaReclamar(texto,origen){
  escena('inicio');pintar(cabecera('Un paso','más.')+ficha(true)+'<div class="caja">'+esc(texto)+'</div><button class="btn oro" type="button" id="activar">Activar mi acceso</button><p class="error" id="err" role="alert"></p>');
  $('activar').addEventListener('click',function(){reclamar(origen)})
}

function formulario(solicitudAnterior){
  var p=perfil||{},rechazo=solicitudAnterior&&solicitudAnterior.estado==='rechazada',L_=ofertas(catalogo),varias=L_.length>1,algunPago=L_.some(function(o){return o.precio>0});
  MODO=solicitudAnterior&&solicitudAnterior.parejaCorreo&&L_.some(function(o){return o.k==='pareja'})?'pareja':L_[0].k;
  escena('inicio');
  var h=cabecera('Tu','registro.',algunPago?'Tres pasos: tus datos, la transferencia y el comprobante. Tu acceso queda activo cuando validemos el pago.':'Déjanos tus datos y activa tu acceso.')+ficha(!algunPago)+
    (rechazo?'<div class="caja aviso"><b>No pudimos aprobar tu comprobante.</b><br>'+esc(solicitudAnterior.motivo||'Revísalo y vuelve a enviarlo.')+'</div>':'');
  var wa=String(p.whatsapp||'');if(wa.length===12&&wa.slice(0,2)==='57')wa=wa.slice(2);
  h+='<form id="f" novalidate>'+(varias?'<fieldset class="modos"><legend>¿Cómo se inscriben?</legend>'+L_.map(function(o){return'<label><input type="radio" name="modo" value="'+o.k+'"'+(o.k===MODO?' checked':'')+'><span><b>'+(o.k==='solo'?'Solo yo':'En pareja')+'</b><small>'+esc(pesos(o.precio))+(o.k==='pareja'?' por los dos':'')+'</small></span></label>'}).join('')+'</fieldset>':'')+paso(1,'Tus datos')+'<div class="campos"><div><label for="nombre">Nombre y apellido</label><input id="nombre" type="text" autocomplete="name" maxlength="80" value="'+esc(p.nombre||yo.nombre||'')+'"></div>'+
    '<div><label for="wa">WhatsApp (10 dígitos)</label><input id="wa" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" value="'+esc(wa)+'"></div>'+
    '<div><label for="ciudad">Ciudad</label><input id="ciudad" type="text" autocomplete="address-level2" maxlength="60" value="'+esc(p.ciudad||'')+'"></div>'+
    '<div><label for="como">¿Cómo te enteraste?</label><select id="como">'+['','La HS (iglesia)','Página web','Instagram','WhatsApp','Recomendación de alguien','Otro'].map(function(o){return'<option value="'+esc(o)+'"'+(o===(p.comoSeEntero||'')?' selected':'')+'>'+esc(o||'Opcional')+'</option>'}).join('')+'</select></div>'+
    (L_.some(function(o){return o.k==='pareja'})?'<div class="ancha" id="campoPareja"><label for="pareja">Correo de Google de tu pareja</label><input id="pareja" type="email" inputmode="email" autocomplete="off" maxlength="120" value="'+esc(solicitudAnterior&&solicitudAnterior.parejaCorreo||'')+'"><p class="nota">Una sola inscripción paga por los dos. A tu pareja se le abre su acceso cuando entre con ese correo.</p></div>':'')+'</div>';
  if(algunPago)h+='<div id="bloquePago">'+paso(2,'Transferencia')+'<div class="valor"><div><span>Valor a transferir</span><b id="valorPago">'+esc(pesos(elegida().precio))+'</b></div><button type="button" class="btn chico" id="copiarValor">Copiar</button></div><div id="cuentas"><p class="nota">Cargando las cuentas…</p></div>'+
    paso(3,'Comprobante')+'<label class="soltar" id="soltar" for="archivo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><strong id="nombreArchivo">Toca para subir tu comprobante</strong><small>Captura de pantalla, foto o PDF</small><input id="archivo" type="file" accept="image/*,application/pdf"></label></div>';
  h+='<label class="casilla"><input type="checkbox" id="autoriza"'+(p.autoriza?' checked':'')+'><span>Autorizo a THE WAY a guardar mis datos para mi inscripción y acompañamiento, y que quien me acompaña vea mi avance. Nunca verá lo que escribo en mi Bitácora.</span></label>'+
    '<p class="error" id="err" role="alert"></p><button class="btn oro" type="submit" id="enviar"></button></form>';
  pintar(h);
  /* el botón se enciende cuando todo está completo (si falta algo, al tocarlo dice qué) */
  function listo(){var ok=$('nombre').value.trim().length>2&&$('wa').value.replace(/\D/g,'').length>=10&&$('autoriza').checked&&(elegida().precio<=0||$('archivo').files.length>0)&&(elegida().k!=='pareja'||/@/.test($('pareja').value));$('enviar').classList.toggle('falta',!ok)}
  /* al cambiar entre «Solo yo» y «En pareja» cambian el valor, el correo de la pareja y si hay que pagar */
  function aplicarModo(){var o=elegida(),pf=$('precioFicha');if($('campoPareja'))$('campoPareja').hidden=o.k!=='pareja';if($('bloquePago'))$('bloquePago').hidden=o.precio<=0;if($('valorPago'))$('valorPago').textContent=pesos(o.precio);
    if(pf)pf.innerHTML=esc(pesos(o.precio))+(o.k==='pareja'&&o.precio>0?'<br><small>por los dos</small>':'');$('enviar').textContent=o.precio>0?'Enviar inscripción':'Guardar y continuar'}
  [].forEach.call(document.querySelectorAll('input[name=modo]'),function(r){r.addEventListener('change',function(){MODO=this.value;aplicarModo();listo()})});aplicarModo();
  $('f').addEventListener('input',listo);$('f').addEventListener('change',function(){var a=$('archivo');if(a){var f=a.files[0];$('nombreArchivo').textContent=f?f.name:'Toca para subir tu comprobante';$('soltar').classList.toggle('lleno',!!f)}listo()});listo();
  if(algunPago)$('copiarValor').addEventListener('click',function(){copiar(String(elegida().precio),this)});
  if(algunPago)leer(db.collection('ajustes').doc('pago')).then(function(a){var L=(a&&a.cuentas)||[];
    $('cuentas').innerHTML=L.length?L.map(function(c,i){return'<div class="opcion"><div>'+(i===0&&L.length>1?'<span class="rec">Recomendado</span>':'')+'<span>'+esc(c.titulo)+'</span><b>'+esc(c.numero)+'</b></div><button type="button" class="btn chico" data-copiar="'+i+'">Copiar</button></div>'}).join('')+(a.nota?'<p class="nota">'+esc(a.nota)+'</p>':''):'<div class="caja">Escríbenos por WhatsApp y te damos los datos para transferir.</div>';
    $('cuentas').addEventListener('click',function(e){var b=e.target.closest('[data-copiar]');if(b)copiar(L[+b.getAttribute('data-copiar')].numero,b)})
  },function(){$('cuentas').textContent='No pudimos cargar las cuentas. Escríbenos por WhatsApp.'});
  $('f').addEventListener('submit',function(e){e.preventDefault();enviar(solicitudAnterior)})
}
function copiar(t,b){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){b.textContent='Copiado'},function(){b.textContent='Cópialo a mano'})}
function leerArchivo(f){return new Promise(function(ok,ko){var r=new FileReader();r.onload=function(){ok(String(r.result))};r.onerror=ko;r.readAsDataURL(f)})}
/* La foto se reduce en el propio celular (máx. 1600 px, calidad bajando) hasta caber. */
function preparar(f){
  if(f.type==='application/pdf')return leerArchivo(f).then(function(u){var d=u.slice(u.indexOf(',')+1);if(d.length>MAX)throw new Error('El PDF pesa mucho. Sube mejor una captura de pantalla.');return{dato:d,tipo:'application/pdf'}});
  if(f.type.indexOf('image/')!==0)return Promise.reject(new Error('Sube una foto, una captura o un PDF.'));
  return leerArchivo(f).then(function(u){return new Promise(function(ok,ko){var im=new Image();im.onload=function(){
    var max=1600,q=.82,d;
    for(var i=0;i<8;i++){var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);d=c.toDataURL('image/jpeg',q).split(',')[1];if(d.length<=MAX)return ok({dato:d,tipo:'image/jpeg'});max=Math.round(max*.8);q=Math.max(.5,q-.06)}
    ko(new Error('No pudimos reducir la imagen. Sube una captura de pantalla.'))};im.onerror=function(){ko(new Error('No pudimos abrir esa imagen. Prueba con una captura de pantalla.'))};im.src=u})})
}
function enviar(anterior){
  if(ocupado)return;var err=$('err');err.textContent='';
  var nombre=$('nombre').value.trim().replace(/\s+/g,' '),wa=$('wa').value.replace(/\D/g,'');if(wa.length===10&&wa[0]==='3')wa='57'+wa;
  var oferta=elegida(),enPareja=oferta.k==='pareja'&&!!$('pareja');
  var ciudad=$('ciudad').value.trim(),como=$('como').value,pareja=enPareja?$('pareja').value.trim().toLowerCase():'',conPago=oferta.precio>0,f=conPago?$('archivo').files[0]:null;
  function mal(t,id){err.textContent=t;if(id)$(id).focus()}
  if(nombre.length<3)return mal('Escribe tu nombre y apellido.','nombre');
  if(!/^\d{11,15}$/.test(wa))return mal('Escribe tu WhatsApp con sus 10 dígitos.','wa');
  if(enPareja&&(!/^[^@\s|]+@[^@\s|]+\.[^@\s|]+$/.test(pareja)||pareja===yo.correo.toLowerCase()))return mal('Escribe el correo de Google de tu pareja (distinto al tuyo).','pareja');
  if(conPago&&!f)return mal('Falta la foto o el PDF de tu comprobante.','archivo');
  if(!$('autoriza').checked)return mal('Necesitamos tu autorización para inscribirte.','autoriza');
  ocupado=true;var b=$('enviar'),antes=b.textContent;b.disabled=true;b.textContent='Enviando…';
  var nuevo={nombre:nombre,correo:yo.correo,whatsapp:wa,ciudad:ciudad,comoSeEntero:como,autoriza:true,actualizado:ts()};
  (conPago?preparar(f):Promise.resolve(null)).then(function(c){
    return db.collection('perfiles').doc(yo.uid).set(nuevo).then(function(){perfil=nuevo;
      if(!conPago)return null;
      var id=yo.uid+'_'+CURSO,lote=db.batch();
      lote.set(db.collection('comprobantes').doc(id),{uid:yo.uid,dato:c.dato,tipo:c.tipo,actualizado:ts()});
      lote.set(db.collection('solicitudes').doc(id),{uid:yo.uid,curso:CURSO,precio:oferta.precio,parejaCorreo:pareja,estado:'revision',motivo:'',creada:ts(),actualizada:ts()});
      return lote.commit()})
  }).then(function(){ocupado=false;if(conPago)enRevision();else pantallaReclamar('Tus datos quedaron guardados. Este curso es gratis.','gratis')},
  function(e){console.error(e);ocupado=false;b.disabled=false;b.textContent=antes;err.textContent=e&&!e.code&&e.message?e.message:'No pudimos enviar tu inscripción. Revisa tu conexión e inténtalo de nuevo.'})
}

function iniciar(){
  return TW_SESION.listo().then(function(){yo=TW_SESION.usuario();return TW_SESION.firestore()}).then(function(d){db=d;
    $('yo').hidden=!yo;if(yo)$('yoCorreo').textContent=yo.correo;
    if(!CURSO)return listaDeCursos();
    return leer(db.collection('catalogo').doc(CURSO)).then(function(c){
      if(!c){catalogo=null;pintar('<h1>Inscripción aún <em>no disponible.</em></h1><p class="lema">Todavía no abrimos la inscripción en línea de este curso. Escríbenos por WhatsApp y te ayudamos.</p><a class="btn oro" href="https://wa.me/'+WA+'?text='+encodeURIComponent('Hola, quiero inscribirme en un curso de THE WAY')+'" target="_blank" rel="noopener">Escribir por WhatsApp</a><p><a href="./">Ver los cursos con inscripción abierta</a></p>');return}
      catalogo=c;if(!yo)return pantallaEntrar();
      yo.correo=String(yo.correo||'').toLowerCase();
      return leer(db.collection('derechos').doc(yo.uid)).then(function(der){
        if(der&&der.apps&&der.apps[CURSO]&&der.apps[CURSO].activo===true)return yaTiene();
        return Promise.all([
          leer(db.collection('invitaciones').doc(yo.correo+'|'+CURSO)).catch(function(){return null}),
          leer(db.collection('perfiles').doc(yo.uid)),
          leer(db.collection('solicitudes').doc(yo.uid+'_'+CURSO))
        ]).then(function(r){var inv=r[0],sol=r[2];perfil=r[1];
          /* Invitado por su pareja: primero deja sus datos (una sola vez) y activa. */
          if(inv){if(!perfil){catalogo=Object.assign({},catalogo,{precio:0,pareja:false,precioPareja:0});return formularioInvitado()}return pantallaReclamar('Tu pareja ya hizo la inscripción de los dos. Activa tu acceso.','pareja')}
          if(sol&&sol.estado==='revision')return enRevision(sol);
          if(sol&&sol.estado==='aprobada')return aprobadaSinAcceso();
          if(!c.abierto)return escena('inicio'),pintar(cabecera('Inscripciones','cerradas.')+ficha()+'<div class="caja aviso">Las inscripciones de este curso están cerradas.</div>');
          if(ofertas(c).every(function(o){return o.precio===0})&&perfil)return pantallaReclamar('Este curso es gratis.','gratis');
          formulario(sol)
        })
      })
    })
  }).catch(function(e){console.error(e);fallo()})
}
function formularioInvitado(){
  formulario(null);var f=$('f');
  var copia=f.cloneNode(true);f.parentNode.replaceChild(copia,f);var bi=copia.querySelector('#enviar');if(bi)bi.classList.remove('falta');
  var aviso=document.createElement('div');aviso.className='caja';aviso.textContent='Tu pareja ya hizo la inscripción de los dos. Deja tus datos y activa tu acceso.';copia.parentNode.insertBefore(aviso,copia);
  copia.addEventListener('submit',function(e){e.preventDefault();enviarInvitado()})
}
function enviarInvitado(){
  var err=$('err');err.textContent='';var nombre=$('nombre').value.trim().replace(/\s+/g,' '),wa=$('wa').value.replace(/\D/g,'');if(wa.length===10&&wa[0]==='3')wa='57'+wa;
  if(nombre.length<3){err.textContent='Escribe tu nombre y apellido.';return}
  if(!/^\d{11,15}$/.test(wa)){err.textContent='Escribe tu WhatsApp con sus 10 dígitos.';return}
  if(!$('autoriza').checked){err.textContent='Necesitamos tu autorización para inscribirte.';return}
  var nuevo={nombre:nombre,correo:yo.correo,whatsapp:wa,ciudad:$('ciudad').value.trim(),comoSeEntero:$('como').value,autoriza:true,actualizado:ts()};
  db.collection('perfiles').doc(yo.uid).set(nuevo).then(function(){perfil=nuevo;pantallaReclamar('Tus datos quedaron guardados. Activa tu acceso.','pareja')},function(e){console.error(e);err.textContent='No pudimos guardar. Inténtalo de nuevo.'})
}
$('salir').addEventListener('click',function(){TW_SESION.salir().then(function(){location.reload()})});
iniciar();
})();
