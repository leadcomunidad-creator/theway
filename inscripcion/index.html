<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080C12">
<meta name="robots" content="noindex">
<title>Inscripción · THE WAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
/* Inscripción a THE WAY (27-nov-2026). Entrar es gratis; cada curso se paga. Sirve para cualquier curso del catálogo: ?curso=ID */
:root{--night:#080C12;--deep:#0C1520;--surface:#111C28;--card:#162030;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16);
--gold:#C8A84B;--gold-l:#DEC06A;--text:#EAE8E0;--muted:rgba(234,232,224,.68);--green-xl:#6DC48A;--ink:#1A1405;--warn:#E2B35C;--danger:#E58E8E}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--text);font:16px/1.5 'DM Sans',system-ui,sans-serif;min-height:100vh}
a{color:var(--gold-l)}button,input,select{font:inherit}
:focus-visible{outline:2px solid #F2D27A;outline-offset:2px}
header{max-width:560px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;gap:12px}
.marca{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.06em;color:var(--gold);text-decoration:none}
.yo{margin-left:auto;text-align:right;font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.yo button{background:none;border:0;color:var(--gold-l);cursor:pointer;padding:0;text-decoration:underline}
main{max-width:560px;margin:0 auto;padding:8px 16px 60px}
h1{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.04em;font-size:36px;line-height:1.05;margin:14px 0 4px}
h2{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.05em;font-size:22px;color:var(--gold-l);margin:26px 0 8px}
p{margin:8px 0}.sub{color:var(--muted)}
.precio{font-size:26px;font-weight:700;color:var(--gold-l);margin:4px 0}
.caja{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin:12px 0}
label{display:block;margin:14px 0 4px;font-size:14px;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],select{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--border2);background:var(--deep);color:var(--text)}
input[type=file]{width:100%;padding:12px;border-radius:12px;border:1px dashed var(--border2);background:var(--deep);color:var(--text)}
.casilla{display:flex;gap:10px;align-items:flex-start;margin:16px 0;color:var(--text);font-size:14px}
.casilla input{width:22px;height:22px;flex:0 0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 20px;border-radius:999px;border:1px solid var(--border2);background:var(--card);color:var(--text);cursor:pointer;text-decoration:none;font-weight:500}
.btn.oro{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700;width:100%}
.btn.chico{min-height:36px;padding:6px 14px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:default}
.cuenta{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border)}
.cuenta:first-child{border-top:0}.cuenta div{min-width:0}.cuenta span{display:block;font-size:13px;color:var(--muted)}.cuenta b{overflow-wrap:anywhere}
.lista a{display:block;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin:10px 0;text-decoration:none;color:var(--text)}
.lista a b{display:block;font-size:18px}.lista a span{color:var(--gold-l)}
.error{color:var(--danger);font-size:14px;min-height:1em}
.aviso{border-color:var(--warn)}.bien{border-color:var(--green-xl)}
.ayuda{margin-top:28px;font-size:14px;color:var(--muted);text-align:center}
.cargando{display:inline-block;width:22px;height:22px;border:3px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.cargando{animation:none}}
</style>
</head>
<body>
<header><a class="marca" href="../">THE WAY</a><div class="yo" id="yo" hidden><span id="yoCorreo"></span><br><button type="button" id="salir">Usar otra cuenta</button></div></header>
<main id="main" aria-live="polite"><p style="text-align:center;margin-top:20vh"><span class="cargando" aria-hidden="true"></span></p></main>
<script src="../compartido/sesion.js"></script>
<script>
(function(){'use strict';
var WA='573173708570';
/* A dónde entra cada curso cuando ya hay acceso. Un curso nuevo sin ruta lleva al inicio. */
var RUTAS={metanoia:'../metanoia/',preparados:'../uniendo-caminos/'};
var MAX=880000; /* tope del comprobante guardado (texto), con margen bajo el de las reglas */
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pesos=function(n){return n>0?'$'+Number(n).toLocaleString('es-CO')+' COP':'Gratis'};
var CURSO=(new URLSearchParams(location.search).get('curso')||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40);
var db=null,yo=null,catalogo=null,perfil=null,ocupado=false;
function ts(){return firebase.firestore.FieldValue.serverTimestamp()}
function hoy(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Bogota'})}
function pintar(h){$('main').innerHTML=h+'<p class="ayuda">¿Necesitas ayuda? <a href="https://wa.me/'+WA+'?text='+encodeURIComponent('Hola, necesito ayuda con mi inscripción en THE WAY'+(catalogo?' ('+catalogo.nombre+')':''))+'" target="_blank" rel="noopener">Escríbenos por WhatsApp</a></p>';window.scrollTo(0,0)}
function leer(ref){return ref.get().then(function(s){return s.exists?s.data():null})}
function cabecera(){return'<h1>'+esc(catalogo.nombre)+'</h1><p class="precio">'+esc(pesos(catalogo.precio))+(catalogo.pareja&&catalogo.precio>0?' <small style="font-size:14px;color:var(--muted)">por los dos</small>':'')+'</p>'}
function fallo(t){pintar('<h1>Algo no salió bien</h1><p class="sub">'+esc(t||'Revisa tu conexión e inténtalo de nuevo.')+'</p><button class="btn" type="button" onclick="location.reload()">Intentar de nuevo</button>')}

function listaDeCursos(){
  return db.collection('catalogo').get().then(function(s){var L=[];s.forEach(function(d){var c=d.data();if(c.abierto)L.push({id:d.id,c:c})});
    pintar('<h1>Cursos de THE WAY</h1><p class="sub">Escoge el curso al que quieres inscribirte.</p>'+(L.length?'<div class="lista">'+L.map(function(x){return'<a href="?curso='+esc(x.id)+'"><b>'+esc(x.c.nombre)+'</b><span>'+esc(pesos(x.c.precio))+(x.c.pareja&&x.c.precio>0?' por pareja':'')+'</span></a>'}).join('')+'</div>':'<div class="caja">Por ahora no hay inscripciones abiertas.</div>'))})
}
function pantallaEntrar(){
  pintar(cabecera()+(catalogo.abierto?'<p class="sub">Entrar a THE WAY es gratis. Primero entra con tu cuenta de Google; con esa misma cuenta usarás el curso.</p>':'<div class="caja aviso">Las inscripciones de este curso están cerradas. Si ya tienes acceso o te invitaron, entra con tu cuenta.</div>')+
    '<button class="btn oro" type="button" id="entrar">Entrar con Google</button><p class="error" id="err" role="alert"></p>');
  $('entrar').addEventListener('click',function(){TW_SESION.entrar().then(iniciar,function(e){if(e&&e.code!=='cancelado')$('err').textContent='No pudimos completar el ingreso. Inténtalo de nuevo.'})})
}
function yaTiene(){pintar(cabecera()+'<div class="caja bien"><b>Ya tienes acceso a este curso.</b><p class="sub">Entra con esta misma cuenta de Google.</p></div><a class="btn oro" href="'+esc(RUTAS[CURSO]||'../')+'">Empezar</a>')}
function enRevision(s){pintar(cabecera()+'<div class="caja"><b>Recibimos tu inscripción.</b><p class="sub">Estamos confirmando tu pago. Cuando quede aprobado, tu acceso se abre en esta misma cuenta y te escribimos por WhatsApp.</p></div><button class="btn" type="button" onclick="location.reload()">Ver si ya está aprobado</button>')}
function aprobadaSinAcceso(){pintar(cabecera()+'<div class="caja aviso">Tu pago aparece aprobado, pero no vemos el acceso. Escríbenos por WhatsApp y lo revisamos.</div>')}
function reclamar(origen){
  if(ocupado)return;ocupado=true;$('activar').disabled=true;
  var a={};a[CURSO]={activo:true,desde:hoy(),origen:origen};
  var ref=db.collection('derechos').doc(yo.uid);
  ref.get().then(function(s){
    if(!s.exists)return ref.set({apps:a,reclamo:CURSO});
    var c={reclamo:CURSO};c['apps.'+CURSO]=a[CURSO];return ref.update(c)
  }).then(yaTiene,function(e){console.error(e);ocupado=false;$('activar').disabled=false;$('err').textContent='No pudimos activar tu acceso. Inténtalo de nuevo o escríbenos.'})
}
function pantallaReclamar(texto,origen){
  pintar(cabecera().replace(/<p class="precio">.*<\/p>/,'')+'<div class="caja bien">'+esc(texto)+'</div><button class="btn oro" type="button" id="activar">Activar mi acceso</button><p class="error" id="err" role="alert"></p>');
  $('activar').addEventListener('click',function(){reclamar(origen)})
}

function formulario(solicitudAnterior){
  var p=perfil||{},conPago=catalogo.precio>0,rechazo=solicitudAnterior&&solicitudAnterior.estado==='rechazada';
  var h=cabecera()+(rechazo?'<div class="caja aviso"><b>No pudimos aprobar tu comprobante.</b><p class="sub">'+esc(solicitudAnterior.motivo||'Revísalo y vuelve a enviarlo.')+'</p></div>':'');
  var wa=String(p.whatsapp||'');if(wa.length===12&&wa.slice(0,2)==='57')wa=wa.slice(2);
  h+='<form id="f" novalidate><h2>1 · Tus datos</h2><label for="nombre">Nombre y apellido</label><input id="nombre" type="text" autocomplete="name" maxlength="80" value="'+esc(p.nombre||yo.nombre||'')+'">'+
    '<label for="wa">WhatsApp (10 dígitos)</label><input id="wa" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" value="'+esc(wa)+'">'+
    '<label for="ciudad">Ciudad</label><input id="ciudad" type="text" autocomplete="address-level2" maxlength="60" value="'+esc(p.ciudad||'')+'">'+
    '<label for="como">¿Cómo te enteraste de THE WAY?</label><select id="como">'+['','La HS (iglesia)','Página web','Instagram','WhatsApp','Recomendación de alguien','Otro'].map(function(o){return'<option value="'+esc(o)+'"'+(o===(p.comoSeEntero||'')?' selected':'')+'>'+esc(o||'Elige una opción (opcional)')+'</option>'}).join('')+'</select>';
  if(catalogo.pareja)h+='<h2>Tu pareja</h2><label for="pareja">Correo de Google de tu pareja</label><input id="pareja" type="email" inputmode="email" autocomplete="off" maxlength="120" value="'+esc(solicitudAnterior&&solicitudAnterior.parejaCorreo||'')+'"><p class="sub" style="font-size:14px">Una sola inscripción paga por los dos. A tu pareja se le abre su acceso cuando entre con ese correo.</p>';
  if(conPago)h+='<h2>2 · Transfiere '+esc(pesos(catalogo.precio))+'</h2><div class="caja" id="cuentas">Cargando las cuentas…</div><h2>3 · Sube tu comprobante</h2><label for="archivo">Foto o captura (o PDF liviano)</label><input id="archivo" type="file" accept="image/*,application/pdf">';
  h+='<label class="casilla"><input type="checkbox" id="autoriza"'+(p.autoriza?' checked':'')+'><span>Autorizo a THE WAY a guardar mis datos para mi inscripción y acompañamiento, y que quien me acompaña vea mi avance. Nunca verá lo que escribo en mi Bitácora.</span></label>'+
    '<p class="error" id="err" role="alert"></p><button class="btn oro" type="submit" id="enviar">'+(conPago?'Enviar inscripción':'Guardar y continuar')+'</button></form>';
  pintar(h);
  if(conPago)leer(db.collection('ajustes').doc('pago')).then(function(a){var L=(a&&a.cuentas)||[];
    $('cuentas').innerHTML=L.length?L.map(function(c,i){return'<div class="cuenta"><div><span>'+esc(c.titulo)+'</span><b>'+esc(c.numero)+'</b></div><button type="button" class="btn chico" data-copiar="'+i+'">Copiar</button></div>'}).join('')+(a.nota?'<p class="sub" style="font-size:14px">'+esc(a.nota)+'</p>':''):'Escríbenos por WhatsApp y te damos los datos para transferir.';
    $('cuentas').addEventListener('click',function(e){var b=e.target.closest('[data-copiar]');if(!b)return;var n=L[+b.getAttribute('data-copiar')].numero;(navigator.clipboard?navigator.clipboard.writeText(n):Promise.reject()).then(function(){b.textContent='Copiado'},function(){b.textContent='Cópialo a mano'})})
  },function(){$('cuentas').textContent='No pudimos cargar las cuentas. Escríbenos por WhatsApp.'});
  $('f').addEventListener('submit',function(e){e.preventDefault();enviar(solicitudAnterior)})
}
function leerArchivo(f){return new Promise(function(ok,ko){var r=new FileReader();r.onload=function(){ok(String(r.result))};r.onerror=ko;r.readAsDataURL(f)})}
/* La foto se reduce en el propio celular (máx. 1600 px, calidad bajando) hasta caber. */
function preparar(f){
  if(f.type==='application/pdf')return leerArchivo(f).then(function(u){var d=u.slice(u.indexOf(',')+1);if(d.length>MAX)throw new Error('El PDF pesa mucho. Sube mejor una captura de pantalla.');return{dato:d,tipo:'application/pdf'}});
  if(f.type.indexOf('image/')!==0)return Promise.reject(new Error('Sube una foto, una captura o un PDF.'));
  return leerArchivo(f).then(function(u){return new Promise(function(ok,ko){var im=new Image();im.onload=function(){
    var max=1600,q=.82,d;
    for(var i=0;i<8;i++){var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);d=c.toDataURL('image/jpeg',q).split(',')[1];if(d.length<=MAX)return ok({dato:d,tipo:'image/jpeg'});max=Math.round(max*.8);q=Math.max(.5,q-.06)}
    ko(new Error('No pudimos reducir la imagen. Sube una captura de pantalla.'))};im.onerror=function(){ko(new Error('No pudimos abrir esa imagen. Prueba con una captura de pantalla.'))};im.src=u})})
}
function enviar(anterior){
  if(ocupado)return;var err=$('err');err.textContent='';
  var nombre=$('nombre').value.trim().replace(/\s+/g,' '),wa=$('wa').value.replace(/\D/g,'');if(wa.length===10&&wa[0]==='3')wa='57'+wa;
  var ciudad=$('ciudad').value.trim(),como=$('como').value,pareja=catalogo.pareja?$('pareja').value.trim().toLowerCase():'',conPago=catalogo.precio>0,f=conPago?$('archivo').files[0]:null;
  function mal(t,id){err.textContent=t;if(id)$(id).focus()}
  if(nombre.length<3)return mal('Escribe tu nombre y apellido.','nombre');
  if(!/^\d{11,15}$/.test(wa))return mal('Escribe tu WhatsApp con sus 10 dígitos.','wa');
  if(catalogo.pareja&&(!/^[^@\s|]+@[^@\s|]+\.[^@\s|]+$/.test(pareja)||pareja===yo.correo.toLowerCase()))return mal('Escribe el correo de Google de tu pareja (distinto al tuyo).','pareja');
  if(conPago&&!f)return mal('Falta la foto o el PDF de tu comprobante.','archivo');
  if(!$('autoriza').checked)return mal('Necesitamos tu autorización para inscribirte.','autoriza');
  ocupado=true;var b=$('enviar'),antes=b.textContent;b.disabled=true;b.textContent='Enviando…';
  var nuevo={nombre:nombre,correo:yo.correo,whatsapp:wa,ciudad:ciudad,comoSeEntero:como,autoriza:true,actualizado:ts()};
  (conPago?preparar(f):Promise.resolve(null)).then(function(c){
    return db.collection('perfiles').doc(yo.uid).set(nuevo).then(function(){perfil=nuevo;
      if(!conPago)return null;
      var id=yo.uid+'_'+CURSO,lote=db.batch();
      lote.set(db.collection('comprobantes').doc(id),{uid:yo.uid,dato:c.dato,tipo:c.tipo,actualizado:ts()});
      lote.set(db.collection('solicitudes').doc(id),{uid:yo.uid,curso:CURSO,precio:catalogo.precio,parejaCorreo:pareja,estado:'revision',motivo:'',creada:ts(),actualizada:ts()});
      return lote.commit()})
  }).then(function(){ocupado=false;if(conPago)enRevision();else pantallaReclamar('Tus datos quedaron guardados. Este curso es gratis.','gratis')},
  function(e){console.error(e);ocupado=false;b.disabled=false;b.textContent=antes;err.textContent=e&&!e.code&&e.message?e.message:'No pudimos enviar tu inscripción. Revisa tu conexión e inténtalo de nuevo.'})
}

function iniciar(){
  return TW_SESION.listo().then(function(){yo=TW_SESION.usuario();return TW_SESION.firestore()}).then(function(d){db=d;
    $('yo').hidden=!yo;if(yo)$('yoCorreo').textContent=yo.correo;
    if(!CURSO)return listaDeCursos();
    return leer(db.collection('catalogo').doc(CURSO)).then(function(c){
      if(!c){catalogo=null;pintar('<h1>Inscripción aún no disponible</h1><p class="sub">Todavía no abrimos la inscripción en línea de este curso. Escríbenos por WhatsApp y te ayudamos.</p><a class="btn oro" href="https://wa.me/'+WA+'?text='+encodeURIComponent('Hola, quiero inscribirme en un curso de THE WAY')+'" target="_blank" rel="noopener">Escribir por WhatsApp</a><p><a href="./">Ver los cursos con inscripción abierta</a></p>');return}
      catalogo=c;if(!yo)return pantallaEntrar();
      yo.correo=String(yo.correo||'').toLowerCase();
      return leer(db.collection('derechos').doc(yo.uid)).then(function(der){
        if(der&&der.apps&&der.apps[CURSO]&&der.apps[CURSO].activo===true)return yaTiene();
        return Promise.all([
          leer(db.collection('invitaciones').doc(yo.correo+'|'+CURSO)).catch(function(){return null}),
          leer(db.collection('perfiles').doc(yo.uid)),
          leer(db.collection('solicitudes').doc(yo.uid+'_'+CURSO))
        ]).then(function(r){var inv=r[0],sol=r[2];perfil=r[1];
          /* Invitado por su pareja: primero deja sus datos (una sola vez) y activa. */
          if(inv){if(!perfil){catalogo=Object.assign({},catalogo,{precio:0,pareja:false});return formularioInvitado()}return pantallaReclamar('Tu pareja ya hizo la inscripción de los dos. Activa tu acceso.','pareja')}
          if(sol&&sol.estado==='revision')return enRevision(sol);
          if(sol&&sol.estado==='aprobada')return aprobadaSinAcceso();
          if(!c.abierto)return pintar(cabecera()+'<div class="caja aviso">Las inscripciones de este curso están cerradas.</div>');
          if(c.precio===0&&perfil)return pantallaReclamar('Este curso es gratis.','gratis');
          formulario(sol)
        })
      })
    })
  }).catch(function(e){console.error(e);fallo()})
}
function formularioInvitado(){
  formulario(null);var f=$('f');
  var copia=f.cloneNode(true);f.parentNode.replaceChild(copia,f);
  var aviso=document.createElement('div');aviso.className='caja bien';aviso.textContent='Tu pareja ya hizo la inscripción de los dos. Deja tus datos y activa tu acceso.';copia.parentNode.insertBefore(aviso,copia);
  copia.addEventListener('submit',function(e){e.preventDefault();enviarInvitado()})
}
function enviarInvitado(){
  var err=$('err');err.textContent='';var nombre=$('nombre').value.trim().replace(/\s+/g,' '),wa=$('wa').value.replace(/\D/g,'');if(wa.length===10&&wa[0]==='3')wa='57'+wa;
  if(nombre.length<3){err.textContent='Escribe tu nombre y apellido.';return}
  if(!/^\d{11,15}$/.test(wa)){err.textContent='Escribe tu WhatsApp con sus 10 dígitos.';return}
  if(!$('autoriza').checked){err.textContent='Necesitamos tu autorización para inscribirte.';return}
  var nuevo={nombre:nombre,correo:yo.correo,whatsapp:wa,ciudad:$('ciudad').value.trim(),comoSeEntero:$('como').value,autoriza:true,actualizado:ts()};
  db.collection('perfiles').doc(yo.uid).set(nuevo).then(function(){perfil=nuevo;pantallaReclamar('Tus datos quedaron guardados. Activa tu acceso.','pareja')},function(e){console.error(e);err.textContent='No pudimos guardar. Inténtalo de nuevo.'})
}
$('salir').addEventListener('click',function(){TW_SESION.salir().then(function(){location.reload()})});
iniciar();
})();
</script>
</body>
</html>
