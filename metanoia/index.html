[data-theme=papel]{--dawn:#9A4E2F;--dawn-d:#7E3C22;--m1:#255E80;--m2:#1E6A43;--m3:#8A5A06;--m4:#9C4630}
/* METANOIA · Sistema visual propuesto v0.1 (PROPUESTA — no aprobada). Continuidad con MI MAPA: noche + oro. Identidad propia: «amanecer». */
:root{
  /* — CONSERVADO de MI MAPA — */
  --night:#080C12;--deep:#0C1520;--surface:#111C28;--card:#162030;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16);
  --gold:#C8A84B;--gold-l:#DEC06A;--ice:#A8C4D4;--text:#EAE8E0;--green:#3D7A54;--green-l:#52A06E;--green-xl:#6DC48A;
  /* — ADAPTADO — muted aclarado de #7A8E9A (5.05:1, ya cumplía) a #9DB0BB (7.7:1) por comodidad en lectura larga y texto pequeño */
  --muted:#9DB0BB;--faint:#5E7080;
  /* — NUEVO para Metanoia: amanecer + un color por movimiento (nunca único portador de significado) — */
  --ink-on-gold:#1A1405;--focus:#F2D27A;--danger:#E58E8E;
  --read-bg:var(--deep);--read-ink:#ECE9DF;--read-muted:#A9B9C2;--read-rule:rgba(255,255,255,.12);--field-bg:rgba(255,255,255,.045);
  --rs:1;
  --f-ui:'DM Sans',system-ui,sans-serif;--f-disp:'Bebas Neue',Impact,sans-serif;--f-read:'DM Sans',system-ui,sans-serif;
}
[data-theme=papel]{--night:#E9E3D3;--deep:#F3EEE2;--surface:#FBF8F0;--card:#FFFFFF;--border:rgba(20,30,40,.12);--border2:rgba(20,30,40,.28);
  --gold:#7A5C12;--gold-l:#5E460A;--ice:#2D5670;--text:#1B2430;--muted:#4D5A65;--faint:#6B7782;--green-xl:#22633B;--green-l:#2F7A4B;
  --ink-on-gold:#FFF8E1;--focus:#8A5A06;--danger:#A12F2F;
  --read-bg:#F3EEE2;--read-ink:#1B2430;--read-muted:#4D5A65;--read-rule:rgba(20,30,40,.14);--field-bg:rgba(20,30,40,.045)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#05080C;color:var(--text);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== barra de pruebas (NO es producto) ===== */
.protobar{position:fixed;top:0;left:0;right:0;height:46px;z-index:100;display:flex;align-items:center;gap:8px;padding:0 12px;background:#1b1306;border-bottom:1px solid #6b5416;color:#f3dfa0;font-size:12px;overflow-x:auto;white-space:nowrap}
.protobar b{letter-spacing:.08em;font-size:11px;padding:3px 8px;border-radius:4px;background:#C8A84B;color:#1A1405}
.protobar .grp{display:flex;gap:2px;padding:2px;border:1px solid #6b5416;border-radius:8px}
.protobar button,.protobar select{background:transparent;border:0;color:#f3dfa0;padding:6px 10px;border-radius:6px;font-size:12px;min-height:32px}
.protobar button[aria-pressed=true]{background:#C8A84B;color:#1A1405;font-weight:700}
.protobar select{background:#2a1f08;border:1px solid #6b5416}
.bare .protobar{display:none}.bare .stagewrap{top:0}
.stagewrap{position:fixed;top:46px;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-start;overflow:auto;background:radial-gradient(circle at 50% 0,#0d1620,#05080C 60%)}
.frame{container-type:inline-size;container-name:app;width:100%;height:100%;background:var(--deep);position:relative;overflow:hidden}
[data-dev=mobile] .frame{width:390px;height:min(100%,800px);margin:14px 0;border-radius:34px;border:8px solid #1d2733;box-shadow:0 20px 60px #000}
[data-dev=tablet] .frame{width:820px;height:min(100%,1060px);margin:14px 0;border-radius:22px;border:8px solid #1d2733;box-shadow:0 20px 60px #000}
[data-dev=desktop] .frame{width:min(100%,1280px);height:min(100%,780px);margin:14px 0;border-radius:10px;border:6px solid #1d2733;box-shadow:0 20px 60px #000}
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--deep);color:var(--text)}

/* ===== barra de aplicación ===== */
.bar{flex:none;display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 12px;background:var(--night);border-bottom:1px solid var(--border)}
.bar .back{white-space:nowrap;display:flex;align-items:center;gap:6px;background:none;border:0;padding:8px;min-height:44px;color:var(--muted);font-size:13px;border-radius:8px}
.bar .back:hover{color:var(--text)}
.brand{white-space:nowrap;display:flex;align-items:center;gap:8px;font-family:var(--f-disp);letter-spacing:.07em;font-size:21px;line-height:1}
.brand small{display:block;font-family:var(--f-ui);font-size:10px;letter-spacing:.14em;color:var(--dawn);}
.bar .sp{flex:1}
.bar .ibtn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:none;border:1px solid transparent;border-radius:10px;color:var(--muted);font-size:13px;padding:0 10px}
.bar .ibtn:hover{color:var(--text);border-color:var(--border2)}
.bar .ibtn.on{color:var(--gold-l);border-color:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--border2);font-size:12px;color:var(--muted);white-space:nowrap}
.pill.gold{border-color:var(--gold);color:var(--gold-l)}.pill.ok{border-color:var(--green-l);color:var(--green-xl)}.pill.dawn{border-color:var(--dawn);color:var(--dawn)}.pill.warn{border-color:var(--danger);color:var(--danger)}

/* ===== disposición responsiva por contenedor ===== */
.body{flex:1;min-height:0;display:flex}
.side{display:none;flex:none;width:300px;overflow:auto;border-right:1px solid var(--border);background:var(--night);padding:14px 10px}
.main{flex:1;min-width:0;overflow:auto}
.rail{display:none;flex:none;width:260px;overflow:auto;border-left:1px solid var(--border);padding:18px 14px;background:var(--night)}
.topnav{display:none;gap:2px}
.tabs{flex:none;display:flex;background:var(--night);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0)}
.tabs button{flex:1;min-height:58px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px}
.tabs button[aria-current=page]{color:var(--gold-l)}.tabs button svg{width:22px;height:22px}
/* A59: la barra inferior (Territorio · Camino · Bitácora · Mapa) también en tableta; la de arriba solo desde 1100 px */
@container app (min-width:1100px){.tabs{display:none}.topnav{display:flex}}
@container app (min-width:760px){.side{display:block;width:250px}}
@container app (min-width:1100px){.side{width:290px}.rail{display:block}}
.wrap{max-width:780px;margin:0 auto;padding:22px 18px 60px}
@container app (min-width:640px){.wrap{padding:30px 32px 70px}}
.wide{max-width:1040px}
h1,h2,h3,h4{margin:0}
.disp{font-family:var(--f-disp);letter-spacing:.05em;font-weight:400}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--dawn);font-weight:700}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:12px;border:1px solid var(--border2);background:transparent;font-weight:600;font-size:15px;text-decoration:none}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--ink-on-gold)}.btn.pri:hover{background:var(--gold-l)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-l)}
.btn.sm{min-height:40px;padding:0 14px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.pend{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;letter-spacing:.06em;padding:3px 9px;border-radius:5px;border:1px dashed var(--dawn);color:var(--dawn);background:rgba(233,169,126,.07)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}
.sim{border:1px dashed var(--dawn);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--dawn);background:rgba(233,169,126,.06)}

const PROT=[[/\bthe way\b/g,'The Way'],[/\bthe message\b/g,'The Message'],[/\bdios\b/g,'Dios'],[/\bjesús\b/g,'Jesús'],[/\bcristo\b/g,'Cristo'],[/\bseñor\b/g,'Señor'],[/\bespíritu santo\b/g,'Espíritu Santo'],[/\bcraig groeschel\b/g,'Craig Groeschel'],[/\bgana la guerra en tu mente\b/g,'Gana la guerra en tu mente'],[/\bnbla\b/g,'NBLA'],[/\bmsg\b/g,'MSG'],[/s\.t\.a\.r\.s\./g,'S.T.A.R.S.'],[/\bbookclub\b/g,'Bookclub'],[/\bmi mapa\b/g,'Mi Mapa'],[/\bprotocolo metanoia\b/g,'Protocolo Metanoia']];
function sc(t){if(typeof t!=='string'||/[a-záéíóúñ]/.test(t)||!/[A-ZÁÉÍÓÚÑ]{3}/.test(t))return t;
 let x=t.toLowerCase();PROT.forEach(([r,v])=>{x=x.replace(r,v)});
 x=x.replace(/^([a-záéíóúñ]) ([·—-]) /,(m,a,b)=>a.toUpperCase()+' '+b+' ');
 x=x.replace(/(^[¿¡«"]*|\. [¿¡«]?| [—·] [¿¡«]?|\d\. )([a-záéíóúñ])/g,(m,a,b)=>a+b.toUpperCase());
 return x}
const isCaps=t=>t.length>=4&&t.length<=96&&!/[a-záéíóúñ]/.test(t)&&/[A-ZÁÉÍÓÚÑ]{3}/.test(t);
function linesHTML(b,d){
 let L=b.l;
 if(b.tipo==='apertura'){const T=d.titulo.replace(/[«»]/g,'');let c=0;L=L.filter(([ln,t],ix)=>{if(ix<10&&(/^(PROTOCOLO METANOIA|SEMANA \d( DE 4| \/ D[ÍI]A \d+)\b.*|D[ÍI]A \d+ DE 20\b.*|JORNADA \d+ \/ 20.*|T[ÍI]TULO:.*|MOVIMIENTO DE HOY:.*)$/.test(t)||t.replace(/[«»]/g,'')===T)){c++;return false}return true})}
 const out=[],FM=FIELD[d.semana]||{},skip=new Set(),AT=PA[d.n]||{};let ul=[],used=false,i=0,lastLn=null;
 (PRAC[d.n]?PRAC[d.n].campos:[]).forEach(c=>(c.opts||[]).forEach(o=>skip.add(o.ln)));
 const fl=()=>{if(ul.length){out.push('<ul>'+ul.map(x=>`<li>${md(x)}</li>`).join('')+'</ul>');ul=[]}};
 for(let j=0;j<L.length;j++){const[ln,tx]=L[j];
  if(skip.has(ln))continue;
  if(lastLn!=null&&AT[lastLn]){fl();AT[lastLn].forEach(c=>out.push(praHTML(d.n,c)));used=true}
  lastLn=ln;
  if(!tx){fl();continue}
  if(FM[ln]&&!(FM[ln].fk==='inicial'&&d.n!==1)){fl();out.push(fieldHTML(FM[ln]));used=true;
    let k=j+1;while(k<L.length&&L[k][1])skip.add(L[k++][0]);
    let m=k;while(m<L.length&&!L[m][1])m++;if(m<L.length&&/^Escribe aquí tu respuesta/.test(L[m][1]))skip.add(L[m][0]);continue}
  if(/^(— |- )/.test(tx)){ul.push(tx.replace(/^(— |- )/,''));continue}
  fl();
  const mS=tx.match(/^([STARS]) — ([A-ZÁÉÍÓÚÑ]+)$/);
  if(mS){out.push(`<h4 class="stars"><b>${mS[1]}</b>${sc(mS[2])}</h4>`);continue}
  if(isCaps(tx)){
   if(/^EJEMPLO/.test(tx)){let k=j+1,inner=[];while(k<L.length&&!(L[k][1]&&isCaps(L[k][1])&&!/^EJEMPLO/.test(L[k][1])))inner.push(L[k++]);
     out.push(`<details><summary>${esc(sc(tx))}</summary>${inner.filter(x=>x[1]).map(x=>`<p>${md(x[1])}</p>`).join('')}</details>`);j=k-1;continue}
   out.push(`<h4>${esc(sc(tx))}</h4>`);
   if(/^(ORACIÓN SUGERIDA|ORA SI LO DESEAS)/.test(tx)){let k=j+1;while(k<L.length&&!L[k][1])k++;let t=[];while(k<L.length&&L[k][1])t.push(L[k++][1]);out.push(`<p class="pray">${md(t.join(' '))}</p>`);j=k-1}
   continue}
  if(/^«.*»$/.test(tx)){out.push(`<p class="q">${md(tx)}</p>`);continue}
  out.push(`<p>${md(tx)}</p>`)}
 fl();if(lastLn!=null&&AT[lastLn]){AT[lastLn].forEach(c=>out.push(praHTML(d.n,c)));used=true}return {html:out.join(''),used}}

/* ---------- Bitácora local: guardado REAL en el dispositivo (almacenamiento del navegador) ----------
   Guardado real: lo escrito (val, stat, notas) se guarda en el almacenamiento del navegador, se pide almacenamiento persistente
   y hay copia de seguridad/restauración por archivo. SIMULADO: PIN, instalación como app, recordatorios, y el estado de jornadas
   (en el producto viaja al servidor sin el contenido escrito, B8). Los estados de ejemplo (barra) no escriben en el almacenamiento. */
const STORE={ok:false,persist:null,err:'',t:null};
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('metanoia-bitacora',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function storeGet(key){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(key||'bitacora');q.onsuccess=()=>{res(q.result||null);db.close()};q.onerror=()=>{rej(q.error);db.close()}})}
async function storePut(o,key){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(o,key||'bitacora');t.oncomplete=()=>{res(true);db.close()};t.onerror=()=>{rej(t.error);db.close()}})}
function snapshot(){const val={},stat={};for(const k in S.user){if(k in S.val)val[k]=S.val[k];if(S.stat[k])stat[k]=S.stat[k]}return{tipo:'bitacora-protocolo-metanoia',version:1,val,stat,notas:S.notas,backupAt:S.backupAt}}
function persistSoon(){const k=BKEY();if(!STORE.ok||S.demo||!k)return;clearTimeout(STORE.t);STORE.t=setTimeout(()=>{storePut(snapshot(),k).catch(e=>{STORE.ok=false;STORE.err=String(e)})},350)}
async function storeDel(key){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(key);t.oncomplete=()=>{res(true);db.close()};t.onerror=()=>{rej(t.error);db.close()}})}
/* G-4 (aprobada por Juan el 9-nov): la Bitácora y el PIN se guardan POR CUENTA en este dispositivo ('bitacora:<uid>' y 'pin:<uid>';
   el uid sale de TW_SESION.usuario(), sin tocar sesion.js). Sin cuenta no se lee ni se escribe. Lo guardado antes con la clave única
   ('bitacora', 'pin') lo reclama UNA sola vez la primera cuenta que abre el curso tras la actualización ('reclamo' = su uid): se copia,
   se verifica leyendo de vuelta y solo entonces se retira lo antiguo. Si la verificación falla, lo antiguo se conserva (solo esa cuenta
   puede leerlo) y se avisa. Las copias de seguridad no cambian de formato: se siguen leyendo las ya existentes. */
const BKEY=()=>{const u=retUid();return u?'bitacora:'+u:null},PKEY=()=>{const u=retUid();return u?'pin:'+u:null};
async function reclamoMio(){const u=retUid();return !!u&&(await storeGet('reclamo'))===u}
async function migrarBitacora(){const u=retUid(),r={aviso:''};if(!u)return r;const marca=await storeGet('reclamo');if(marca&&marca!==u)return r;
 for(const [viejo,nuevo] of [['bitacora','bitacora:'+u],['pin','pin:'+u]]){const o=await storeGet(viejo);if(o==null)continue;
  if(!marca)await storePut(u,'reclamo');
  if(await storeGet(nuevo)!=null)continue;
  try{await storePut(o,nuevo);const b=await storeGet(nuevo);if(JSON.stringify(b)!==JSON.stringify(o))throw new Error('verificación');await storeDel(viejo)}
  catch(e){try{await storeDel(nuevo)}catch(x){}r.aviso='No pudimos pasar tu Bitácora guardada a tu cuenta. Sigue guardada como antes en este dispositivo; guarda una copia de seguridad.'}}
 return r}
async function bitacoraLeer(){const k=BKEY();if(!k)return null;const o=await storeGet(k);if(o!=null)return o;return (await reclamoMio())?await storeGet('bitacora'):null}
async function pinLeer(){const k=PKEY();if(!k)return null;const o=await storeGet(k);if(o!=null)return o;return (await reclamoMio())?await storeGet('pin'):null}
async function pinBorrar(){const k=PKEY();if(k)await storeDel(k);if(await reclamoMio())await storeDel('pin')}
const b64u=a=>btoa(String.fromCharCode(...new Uint8Array(a))),unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function pinHash(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);return b64u(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},k,256))}
async function pinMake(pin){const salt=crypto.getRandomValues(new Uint8Array(16));return{salt:b64u(salt),hash:await pinHash(pin,salt)}}
async function pinOk(pin,rec){return rec&&await pinHash(pin,unb64(rec.salt))===rec.hash}
async function persistAsk(){try{if(navigator.storage&&navigator.storage.persist){STORE.persist=await navigator.storage.persist()}else STORE.persist=null}catch(e){STORE.persist=null}}
function cleanBackup(o){if(!o||o.tipo!=='bitacora-protocolo-metanoia'||typeof o.val!=='object'||!o.val)throw 0;const ok=k=>/^[A-Za-z0-9:_]{1,40}$/.test(k),val={},stat={};
 for(const k in o.val)if(ok(k)&&typeof o.val[k]==='string'&&o.val[k].length<20000)val[k]=o.val[k];
 for(const k in (o.stat||{}))if(ok(k)&&['guardado','borrador'].includes(o.stat[k]))stat[k]=o.stat[k];
 const notas=(Array.isArray(o.notas)?o.notas:[]).filter(n=>n&&typeof n.t==='string'&&typeof n.d==='string').map(n=>({t:n.t.slice(0,5000),d:n.d.slice(0,80)}));return{val,stat,notas}}
function applyData(c,backupAt){S.val=c.val;S.stat=c.stat;S.notas=c.notas;S.user={};for(const k in c.val)S.user[k]=1;if(backupAt!==undefined)S.backupAt=backupAt}

function ridgeSVG(w){/* montañas del terreno w que suben hacia el terreno de arriba, con el color con que empieza su propio terreno */const f={1:'#3d3478',2:'#31785c',3:'#f5c984'}[w];if(!f)return '';return `<svg class="rg" viewBox="0 0 100 90" preserveAspectRatio="none" aria-hidden="true"><path d="${RIDGE[w]}" fill="${f}"/></svg>`}

 return `<div class="terr" id="terr">${h}</div>`}

   let ins='';S.done[n]=true;S.closedOn[n]=iso(S.hoy);if(isWE(S.hoy)&&d0(abre(n))<d0(S.hoy)&&!S.badges.volvi){S.badges.volvi=true;ins='Insignia · Volví al camino. '}
   if(n%5===0&&n<20){S.weekDone=n/5;go('semana')}else if(n===20){go('final')}else{toast(ins+'Jornada '+n+' completada'+'');setTimeout(()=>{S.day=Math.min(20,n+1);go('hoy')},700)}break}
  case 'reopen':if(S.done[S.day+1]){toast('Para reabrir este día, primero reabre el Día '+(S.day+1)+'.');break}S.done[S.day]=false;delete S.closedOn[S.day];render(true);break;
  case 'backup':{const o={tipo:'bitacora-protocolo-metanoia',version:1,exportado:iso(new Date()),val:S.val,stat:S.stat,notas:S.notas};
   try{const bl=new Blob([JSON.stringify(o,null,1)],{type:'application/json'}),u=URL.createObjectURL(bl),a2=document.createElement('a');a2.href=u;a2.download='bitacora-metanoia-'+iso(new Date())+'.json';document.body.appendChild(a2);a2.click();a2.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);S.backupAt=iso(new Date());persistSoon();toast('Copia guardada: se descargó un archivo en tu dispositivo.')}catch(err){toast('No se pudo guardar la copia en este entorno.')}break}
  case 'restore':{const f=document.getElementById('restoreFile');if(f)f.click();break}
  case 'fichaescribir':{S.modal=null;const i=dia(1).bloques.findIndex(b=>b.tipo==='bitacora');S.day=1;S.view='dia';if(i>=0){S.sceneDay=1;S.scene=i}render(true);setTimeout(()=>{const t=[...document.querySelectorAll('textarea[data-key^="inicial:"]')].find(x=>!x.value.trim());if(t){t.scrollIntoView({block:'center'});t.focus()}},120);break}
  case 'pin':S.modal={t:'pin'};render(true);break;
  case 'pinset':(async()=>{try{const a=($('#pinIn')||{}).value||'',b=($('#pinIn2')||{}).value||'';if(!window.crypto||!crypto.subtle||!STORE.ok){S.modal={t:'pin',err:'Aquí no se puede guardar un PIN. Abre la app desde su dirección habitual.'};render(true);return}
   if(!S.pin){if(!/^\d{4,6}$/.test(a)){S.modal={t:'pin',err:'Escribe de 4 a 6 dígitos.'};render(true);return}if(a!==b){S.modal={t:'pin',err:'Los dos PIN no coinciden.'};render(true);return}if(!PKEY())throw 0;await storePut(await pinMake(a),PKEY());S.pin=true;S.modal=null;render(true);toast('PIN activado.')}
   else{const rec=await pinLeer();if(!(await pinOk(a,rec))){S.modal={t:'pin',err:'Ese no es tu PIN.'};render(true);return}await pinBorrar();S.pin=false;S.modal=null;render(true);toast('PIN quitado.')}}catch(err){S.modal={t:'pin',err:'No se pudo guardar el PIN.'};render(true)}})();break;
  case 'unlock':(async()=>{try{const rec=await pinLeer();if(await pinOk(($('#pinIn')||{}).value||'',rec)){S.locked=false;S.modal=null;render(false)}else{S.modal={t:'lock',err:'Ese no es tu PIN.'};render(true)}}catch(err){S.modal={t:'lock',err:'No se pudo comprobar el PIN.'};render(true)}})();break;
  case 'forgot':S.modal={t:'lock',forgot:true};render(true);break;
  case 'lockback':S.modal={t:'lock'};render(true);break;
  case 'wipe':(async()=>{try{const k=BKEY(),mio=await reclamoMio();await pinBorrar();if(k)await storeDel(k);if(mio)await storeDel('bitacora')}catch(err){}location.reload()})();break;
  case 'install':S.modal={t:'install'};render(true);break;
  case 'piedras':S.modal={t:'piedras'};render(true);break;
  case 'ex':S.ex=!S.ex;render(true);break;
  case 'demo':{if(!mapaEdit()){toast('El Mapa Personal se elabora en el Día 20.');break}for(let i=0;i<20;i++)if(!S.val['mapa:'+i])S.val['mapa:'+i]='Texto de demostración';S.val['mapa:p']=S.val['mapa:p']||'Patrón de demostración';render(true);break}

 }});
document.addEventListener('change',e=>{const t=e.target;if(!t||t.id!=='restoreFile'||!t.files||!t.files[0])return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result),c=cleanBackup(o);S.demo=false;applyData(c,typeof o.backupAt==='string'?o.backupAt:S.backupAt);persistSoon();render(true);toast('Copia restaurada: tu Bitácora volvió a este dispositivo.')}catch(err){toast('Ese archivo no es una copia de Bitácora de Protocolo Metanoia.')}t.value=''};r.readAsText(t.files[0])});

/* ---------- barra de pruebas y presets ---------- */
function preset(p){S.done={};S.step={};S.val={};S.stat={};S.notas=[];S.welcomed=true;S.ret=null;S.modal=null;S.closedOn={};S.badges={};S.backupAt=null;S.user={};S.demo=true;
 const at=h=>{S.hoy=fromIso(h)};const mark=n=>{for(let i=1;i<=n;i++){S.done[i]=true;S.closedOn[i]=iso(abre(i))}};
 const fill=n=>{for(const m in PRAC)if(+m<=n)PRAC[m].campos.forEach((c,i)=>{S.val['p'+m+':'+i]=c.kind==='choice'?'0':DEMO;if(c.kind!=='choice')S.stat['p'+m+':'+i]='guardado'});for(const k in D.fichas){const lastD={inicial:1,s1:5,s2:10,s3:15,s4:19}[k];if(lastD<=n)D.fichas[k].forEach((c,i)=>{S.val[k+':'+i]=DEMO;S.stat[k+':'+i]='guardado'})}};
 at('2026-11-09');
 if(p==='primer'){S.welcomed=false;go('entrada')}
 else if(p==='s1'){at('2026-11-16');mark(5);fill(5);S.day=6;go('hoy')}
 else if(p==='mitad'){at('2026-11-23');mark(10);fill(10);S.day=11;go('hoy')}
 else if(p==='pend'){at('2026-11-21');mark(7);fill(7);S.day=8;go('hoy')}
 else if(p==='d19'){at('2026-12-03');mark(18);fill(18);S.day=19;go('hoy')}
 else if(p==='fin'){at('2026-12-04');mark(20);fill(20);go('final')}
 else if(p==='lunes'){S.day=1;go('dia')}
 else if(p==='martes'){at('2026-11-11');mark(2);S.day=3;go('dia')}
 else if(p==='viernes'){at('2026-11-13');mark(4);S.day=5;go('dia')}
 else if(p==='d20'){at('2026-12-04');mark(19);fill(19);S.day=20;go('dia')}}

 const q=new URLSearchParams(location.search);if(q.get('bare'))document.body.classList.add('bare');
 if(q.get('theme'))S.theme=q.get('theme');if(q.get('dev'))S.dev=q.get('dev');if(q.get('rs'))S.rs=+q.get('rs');

 /* A59: «Lección del día» desde MI MAPA (?ir=hoy): directo a la jornada que toca, sin pasar por la landing ni la bienvenida */
 if(FINAL&&!q.get('view')&&!q.get('ir')){const r=retLoad();if(r&&isOpen(r.n)){const i=dia(r.n).bloques.findIndex(b=>b.tipo===r.k);if(i>=0){S.ret=r;S.welcomed=true;S.day=r.n;S.view='dia';S.sceneDay=r.n;S.scene=i}}}
 if(FINAL&&q.get('ir')==='hoy'&&!q.get('view')){S.welcomed=true;S.sceneDay=null;S.day=cur();S.view=doneCount()>=20?'final':'dia'}
 if(q.get('week'))S.weekDone=+q.get('week');if(q.get('vid'))S.vid=q.get('vid');if(q.get('design'))S.design=q.get('design')==='b'?'b':'a';if(q.get('side'))S.side=q.get('side')==='open'?'open':q.get('side')==='closed'?'closed':'auto';if(q.get('hoy'))S.hoy=fromIso(q.get('hoy'));if(q.get('finde')){while(!isWE(S.hoy))S.hoy=addD(S.hoy,1)}if(q.get('modal'))S.modal={t:q.get('modal')};if(q.get('ex'))S.ex=true;
 render(false);
 (async()=>{try{const mg=await migrarBitacora();if(mg.aviso)setTimeout(()=>toast(mg.aviso),400);const o=await bitacoraLeer();STORE.ok=!!BKEY();if(!STORE.ok)STORE.err='sin cuenta';if(!q.get('preset')&&!q.get('view')){const pr=await pinLeer();if(pr){S.pin=true;S.locked=true;S.modal={t:'lock'}}}if(o&&!q.get('preset')&&!q.get('view')){try{const c=cleanBackup(o);applyData(c,o.backupAt||null);render(true)}catch(e){}}else render(true)}catch(e){STORE.ok=false;STORE.err=String(e&&e.message||e);render(true)}})()});
