<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:type" content="website">
<meta property="og:title" content="Protocolo Metanoia · Introducción">
<meta property="og:description" content="Empieza aquí: qué es el curso y cómo usar tu cuadernillo.">
<meta property="og:url" content="https://thewaylhscol.netlify.app/cuadernillo/introduccion/">
<meta property="og:image" content="https://thewaylhscol.netlify.app/assets/og-theway.jpg">
<meta name="robots" content="noindex">
<title>Protocolo Metanoia · Introducción</title>
<style>
@font-face{font-family:'Bebas Neue';src:url(../bebas.woff2) format('woff2')}
:root{--night:#E9E3D3;--surface:#FBF8F0;--gold:#7A5C12;--gold-b:#C8A84B;--text:#1B2430;--muted:#4D5A65;--c:#C8A84B;--border:rgba(20,30,40,.14)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--text);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
/* La pantalla se reparte en filas fijas: arriba la barra, abajo los botones; el libro usa lo que queda. Nada se corta. */
body{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;height:100vh;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));background:#080C12;color:#EAE8E0}
header svg{width:32px;height:24px;flex:none}
.wm{font:400 20px/1 'Bebas Neue',Impact,sans-serif;letter-spacing:.05em}.wm b{font-weight:400;color:#C8A84B}
header .sub{font-size:12px;color:#9DB0BB;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header>div{min-width:0}
header .sp{flex:1}
header a.todo{flex:none;color:#DEC06A;font-size:13px;font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:7px 12px;white-space:nowrap}
.dias{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 6px;scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dias:empty{display:none}
.dias button{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text);font:700 14px inherit;font-family:inherit;padding:8px 13px;border-radius:99px;cursor:pointer}
.dias button[aria-current=true]{background:var(--c);border-color:var(--c);color:#fff}
@media (min-width:900px){.dias{justify-content:center}}
/* El libro: una fila de hojas que se desliza con el dedo, como las fotos del celular. */
#libro{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-height:0;overscroll-behavior-x:contain}
#libro::-webkit-scrollbar{display:none}
.hoja{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;gap:0;padding:8px 10px}
.hoja img{display:block;max-height:100%;max-width:100%;height:auto;width:auto;object-fit:contain;background:#fff;box-shadow:0 2px 14px rgba(20,30,40,.16);user-select:none;-webkit-user-drag:none}
.hoja.par img{max-width:50%}
.hoja.par img:first-child{border-radius:6px 0 0 6px}.hoja.par img:last-child{border-radius:0 6px 6px 0}
.hoja.par img:only-child{max-width:100%}
.pie{padding:6px 12px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:4px}
.controles{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.controles button{flex:0 1 150px;min-height:48px;border-radius:14px;border:0;font:700 16px inherit;font-family:inherit;cursor:pointer}
#ant{background:var(--surface);color:var(--text);border:1px solid var(--border)}
#sig{background:var(--gold-b);color:#080C12}
.controles button:disabled{opacity:.35}
#num{min-width:84px;text-align:center;font-weight:700;font-size:14px;color:var(--muted)}
.nota{font-size:12px;color:var(--muted);text-align:center}
.nota a{color:var(--gold);font-weight:700}
@media (max-height:520px){.nota{display:none}.dias{padding:4px 10px}.dias button{font-size:12px;padding:5px 10px}header{padding-top:4px;padding-bottom:4px}header .sub{display:none}.wm{font-size:16px}header a.todo{padding:4px 10px;font-size:12px}
/* Celular acostado: la hoja se ve a lo ancho y se baja con el dedo para leerla. */
.hoja{align-items:flex-start;overflow-y:auto;overscroll-behavior-y:contain;padding:6px 10px 14px}
.hoja img{max-height:none;width:min(100%,560px)}
.hoja.par img{width:min(50%,420px)}
.pie{padding-top:3px;padding-bottom:calc(4px + env(safe-area-inset-bottom))}.controles button{min-height:36px;font-size:14px}}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 64 48" aria-hidden="true"><path d="M2 46 17 18l15 28z" fill="#A8C4D4"/><path d="M34 46 47 20l15 26z" fill="#2B5577"/><path d="M12 46 32 4l20 42z" fill="#C8A84B"/><g fill="#0C1520"><circle cx="31" cy="15" r="1.4"/><circle cx="33" cy="20" r="1.4"/><circle cx="31.5" cy="25" r="1.4"/><circle cx="29" cy="30" r="1.4"/><circle cx="27.5" cy="35" r="1.4"/><circle cx="25" cy="40" r="1.4"/><circle cx="22.5" cy="44" r="1.4"/></g></svg>
  <div><div class="wm">THE <b>WAY</b></div><div class="sub">Cuadernillo · Introducción</div></div>
  <span class="sp"></span>
  <a class="todo" href="../">Todo el cuadernillo</a>
</header>
<nav class="dias" aria-label="Ir a un día"></nav>
<div id="libro" tabindex="0" aria-label="Páginas del cuadernillo"></div>
<div class="pie">
  <div class="controles">
    <button id="ant" aria-label="Página anterior">‹ Anterior</button>
    <span id="num" aria-live="polite"></span>
    <button id="sig" aria-label="Página siguiente">Siguiente ›</button>
  </div>
  <div class="nota"><a href="Metanoia_Introduccion_para_imprimir.pdf" download>Descargar para imprimir (PDF)</a> · Contenido privado del curso. Por favor, no lo compartas.</div>
</div>
<script>
/* Dos ediciones: «p» (celular, página angosta) y «t» (tablet y computador, página 3:4).
   En pantalla horizontal ancha se ven dos páginas juntas. Se pasa con el dedo (deslizar), con los botones o con las flechas. */
const SETS={"p": {"n": 9, "d": [1]}, "t": {"n": 7, "d": [1]}}, ID='introduccion';
const libro=document.getElementById('libro'),num=document.getElementById('num'),ant=document.getElementById('ant'),sig=document.getElementById('sig');
const dias=[...document.querySelectorAll('.dias button')];
let K,S,dos,hojas=[],curP=1;
function modo(){const big=Math.min(innerWidth,innerHeight)>=600||innerWidth>=900;const k=big?'t':'p';
  const d=k==='t'&&innerWidth>innerHeight*1.15&&innerWidth>=900;return [k,d]}
function src(i){return K+'/'+String(i).padStart(3,'0')+'.webp'}
function armar(pagina){
  [K,dos]=modo();S=SETS[K];libro.innerHTML='';hojas=[];
  const paso=dos?2:1;
  for(let i=1;i<=S.n;i+=paso){const h=document.createElement('div');h.className='hoja'+(dos?' par':'');h.dataset.p=i;
    for(let j=i;j<i+paso&&j<=S.n;j++){const im=document.createElement('img');im.alt='Página '+j;im.decoding='async';im.loading=j<=6?'eager':'lazy';im.src=src(j);h.appendChild(im)}
    libro.appendChild(h);hojas.push(h)}
  ir(pagina||1,false)}
function idx(){return Math.round(libro.scrollLeft/libro.clientWidth)}
function pagDe(k){return +hojas[Math.max(0,Math.min(hojas.length-1,k))].dataset.p}
function ir(p,suave=true){lastW=libro.clientWidth;const k=hojas.findIndex((h,i)=>+h.dataset.p<=p&&(i===hojas.length-1||+hojas[i+1].dataset.p>p));
  libro.scrollTo({left:k*libro.clientWidth,behavior:suave?'smooth':'instant'});marcar(k)}
function marcar(k){if(k===undefined)k=idx();const p=pagDe(k);const h=hojas[k];const ult=h?+h.lastChild.alt.split(' ')[1]:p;
  curP=p;num.textContent=(ult>p?p+'–'+ult:p)+' / '+S.n;ant.disabled=k<=0;sig.disabled=k>=hojas.length-1;
  if(dias.length){let cur=dias[0];dias.forEach(b=>{if(S.d[+b.dataset.i]<=ult)cur=b});dias.forEach(b=>b.setAttribute('aria-current',b===cur))}
  try{localStorage.setItem('tw_cuad_'+ID,String(p))}catch(e){}}
let t,armando=false,lastW=0;libro.addEventListener('scroll',()=>{if(armando||libro.clientWidth!==lastW)return;clearTimeout(t);t=setTimeout(()=>marcar(),80)},{passive:true});
ant.onclick=()=>{const k=idx();libro.scrollTo({left:(k-1)*libro.clientWidth,behavior:'smooth'})};
sig.onclick=()=>{const k=idx();libro.scrollTo({left:(k+1)*libro.clientWidth,behavior:'smooth'})};
dias.forEach(b=>b.onclick=()=>ir(S.d[+b.dataset.i],false));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();sig.click()}if(e.key==='ArrowLeft'){e.preventDefault();ant.click()}});
let g=1;try{g=+localStorage.getItem('tw_cuad_'+ID)||1}catch(e){}
armar(g);
/* Al girar la tablet o cambiar el tamaño, se rearma en la misma página, sin recargar. */
let rt,firma=modo().join();addEventListener('resize',()=>{armando=true;clearTimeout(rt);rt=setTimeout(()=>{const p=curP;
  if(modo().join()!==firma){firma=modo().join();armar(p)}else{ir(p,false)}setTimeout(()=>{armando=false},150)},200)});
</script>
</body>
</html>
