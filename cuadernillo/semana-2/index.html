ewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></span><div><div class="k">El libro · Bookclub · Escena 3 de 6</div><div class="h">DESDE THE WAY → BOOKCLUB · EL LIBRO QUE ACOMPAÑA</div></div></div><div class="bd"><div class="read"><p>Lee el capítulo 6 del resumen de <em>Gana la guerra en tu mente</em>, de Craig Groeschel: «Rumiar y renovar». Si lees el libro completo, busca el capítulo equivalente de tu edición; te va a tomar más tiempo que el resumen.</p><div class="bridge"><div class="br-top"><span class="br-tool"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Bookclub</span><span class="br-kind">Lectura que acompaña</span></div><div class="br-ref"><em>Gana la guerra en tu mente</em> · Capítulo 6 · Rumiar y renovar</div><p class="br-note">El resumen va impreso aquí mismo. No necesitas abrir Bookclub.</p></div><div class="texto resumen"><div class="lt">Capítulo 6 — Rumiar y renovar</div><p class="lsub"><em>La verdad necesita dejar de ser información para convertirse en el camino automático de tu mente</em></p><div class="ll">1. IDEA CENTRAL</div><p class="ld"><strong>La repetición que fortaleció una mentira también puede utilizarse para interiorizar la verdad hasta que una nueva manera de pensar comience a surgir con naturalidad.</strong></p><div class="ll">2. PROSA EN VOZ DEL AUTOR</div><p>Voy a usar una imagen poco elegante pero muy útil: una vaca rumiando. Come, mastica, traga, vuelve a traer el alimento, lo mastica otra vez y repite el proceso. Cuando hablo de meditar en la verdad de Dios, quiero que imagines algo parecido. No estoy hablando de leer rápidamente un versículo y seguir con el día. Estoy hablando de volver sobre él, observar sus palabras, pensar en su significado, llevarlo a tu situación, regresar a él y permitir que penetre cada vez más profundamente.</p><p>La repetición importa porque es precisamente una de las fuerzas que formaron los viejos surcos. Groeschel introduce aquí el llamado <strong>efecto de verdad ilusoria</strong>: la tendencia a considerar más creíble una afirmación simplemente porque la hemos escuchado repetidamente. Esa idea ayuda a explicar por qué algunas mentiras terminan pareciendo obvias. “Nunca cambiaré.” “No soy suficiente.” “Algo malo va a pasar.” Si una frase ha resonado dentro de ti durante años, no debería sorprenderte que aparezca antes que la verdad cuando estás bajo presión.</p><p>Entonces voy a utilizar la repetición de forma deliberada. Si una mentira se fortaleció porque pasó innumerables veces por mi mente, haré que la verdad pase innumerables veces también. Escribir, pensar, confesar, meditar, volver a pensar. No una vez, sino muchas. Groeschel recomienda especialmente comenzar temprano en el día porque el primer pensamiento puede influir en los siguientes. La intención es que la Palabra de Dios no sea algo que recuerde únicamente cuando abro una Biblia, sino una voz interior disponible durante la experiencia cotidiana.</p><p>La meta que propongo es la <strong>automaticidad</strong>: llegar al punto en que algo aprendido mediante repetición empieza a suceder sin tener que procesarlo desde cero cada vez. Eso explica por qué haces muchas actividades cotidianas casi sin pensar; ya fueron aprendidas. También explica por qué algunos comportamientos perjudiciales aparecen con enorme facilidad. Quiero utilizar ese mismo principio en dirección contraria: que la nueva trinchera sea tan familiar que, frente al detonante, la verdad tenga un camino por donde correr.</p><p>Esto lo experimenté especialmente con mi miedo al dinero. Una situación fiscal inesperada volvió a activar mis viejos temores, pero esta vez empezaron a emerger también las Escrituras y declaraciones que llevaba tiempo meditando. No desaparecieron mágicamente las circunstancias; cambió el lugar desde el cual las estaba interpretando. Con los años, pude reconocer que la seguridad que antes buscaba obsesivamente en el dinero había sido desplazada por una confianza mayor en Dios. Para mí, ahí está la señal de que la verdad dejó de ser únicamente algo escrito y comenzó a convertirse en algo vivido.</p><div class="ll">3. BULLETS DE IMPACTO</div><p class="lb">• Meditar, en la imagen del capítulo, significa volver repetidamente sobre una verdad hasta asimilarla.</p><p class="lb">• La familiaridad puede hacer que una afirmación parezca más creíble; por eso la repetición de mentiras importa.</p><p class="lb">• Las mentiras antiguas tienen ventaja porque han sido practicadas durante años.</p><p class="lb">• Groeschel responde a esa ventaja con repetición deliberada de verdad.</p><p class="lb">• La meta no es memorizar frases aisladas, sino generar una respuesta mental nueva y cada vez más espontánea.</p><p class="lb">• La verdadera señal de avance aparece cuando la nueva verdad emerge precisamente bajo presión.</p><div class="ll">4. DATO CLAVE O SEÑAL DE ALERTA</div><p class="ld"><strong>Lo que repites no solo permanece en tu memoria; con el tiempo puede convertirse en la respuesta que tu mente encuentra primero.</strong></p><div class="ll">5. REFLEXIÓN</div><p class="ld"><strong>¿Qué mentira has practicado mentalmente tantas veces que hoy aparece en ti con más rapidez que la verdad que dices creer?</strong></p><div class="ll">6. PRÁCTICA</div><p>Elige <strong>un versículo</strong> relacionado con la mentira que estás trabajando.</p><p>Durante diez minutos:</p><p class="lb">• Léelo lentamente.</p><p class="lb">• Detente palabra por palabra.</p><p class="lb">• Pregunta qué afirma realmente.</p><p class="lb">• Escríbelo con tus propias palabras sin cambiar su sentido.</p><p class="lb">• Conecta esa verdad con tu situación concreta.</p><p class="lb">• Repítela nuevamente en voz alta.</p><p>El ejercicio original del capítulo invita precisamente a escoger un pasaje, observarlo con atención, profundizar en su significado y pedir a Dios que lo haga específico para la propia vida.</p></div><p>Groeschel usa la imagen de rumiar: volver una y otra vez sobre una verdad, pensarla con calma y llevarla a la vida diaria. También muestra cómo la repetición puede hacer más familiares ciertas respuestas.</p><p>Mientras lees, ten presente esta pregunta: «¿Cómo puedo mantener presente la Verdad que ya examiné justo cuando necesito intentar mi respuesta nueva?».</p><p>Repetir una frase no la vuelve verdadera; lo que transforma es la verdad comprendida y obedecida. Los ejercicios del capítulo son opcionales; tu práctica de hoy está en la Bitácora.</p><p>Vuelve a THE WAY.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20 12 4l9 16z"/><path d="m8 20 4-7 4 7"/></svg></span><div><div class="k">La lección · The Way · Escena 4 de 6</div><div class="h">EN THE WAY · ENSEÑANZA DEL DÍA</div></div></div><div class="bd"><div class="read"><h4>La verdad se practica en el camino</h4><p>Preparar una respuesta y practicarla son dos momentos distintos. Cuando llega la conversación difícil, pueden volver el miedo, la incomodidad o el impulso de siempre. Sentirlos no quiere decir que fallaste: estamos aprendiendo a responder, y nadie controla todas sus emociones.</p><p>El martes reconociste una señal y preparaste una pausa; ayer escogiste qué harías después. Hoy toca <strong>intentarlo</strong>, sin provocar situaciones ni declarar victorias.</p><p>Esto se juega en lo cotidiano, y casi siempre donde más nos aprieta. Pienso en la plata. Uno sabe lo que Dios dice sobre el dinero; el problema es cuando no hay. La cuenta está vacía, en la casa hace falta algo, los niños llegan a buscarte para jugar y explotas. Pero ellos no tienen la culpa de cómo te sientes. Reentrenar ahí es reconocer que la necesidad es real, no descargarla sobre los demás, tomar decisiones responsables y decirle a Dios: «Tú dijiste que suplirías lo que nos falta. Creo que lo vas a hacer». Y empezar a descansar, aunque la cuenta siga igual.</p><p>Filipenses 4 une las dos cosas: considerar lo verdadero y practicar lo aprendido. Groeschel lo describe como rumiar, masticar despacio una verdad hasta asimilarla. Es una buena imagen de la meditación, siempre que lo que se rumia sea la Escritura entendida en su contexto y obedecida.</p><p>Vuelve a la persona que recibe una corrección y suele concluir «soy incompetente». Preparó una pausa y una acción: escuchar y preguntar qué debe ajustar. Hoy le pueden pasar tres cosas:</p><p><strong>Práctica real:</strong> aparece una corrección segura y parecida. Tal vez logra escuchar y preguntar, aunque se siga sintiendo insegura. O tal vez reacciona como antes y se acuerda del plan más tarde; también eso se escribe con honestidad, y de ahí se aprende.</p><p><strong>Ensayo:</strong> la situación no aparece, y practica su respuesta imaginándola, sin involucrar a nadie. Le sirve para prepararse, y se registra como ensayo.</p><p><strong>Sin oportunidad:</strong> no aparece una situación segura y no hace ensayo. Escribirlo así es honesto, y tampoco es un fracaso.</p><p>En cualquier caso, el patrón es el mismo: reconoce la señal, haz la pausa cuando se pueda, intenta la respuesta preparada y observa lo que pasa, sin convertir el resultado en un juicio sobre quién eres.</p><p>La renovación crece mientras permanecemos en Jesús, atendemos su Palabra y practicamos la obediencia con oración, comunidad, paciencia y responsabilidad; un comportamiento perfecto no es la medida. Si la situación implica abuso o amenaza, no te expongas: tomar distancia, buscar protección o pedir ayuda puede ser lo correcto.</p><p>Hoy no hay creencias ni declaraciones nuevas. Vas a observar un intento seguro, un ensayo marcado como tal o la falta de ocasión, y mañana revisas qué aprendiste y qué conviene ajustar. Tu Bitácora cuenta lo que pasó de verdad, aunque no sea un testimonio de éxito.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></span><div><div class="k">Mi Bitácora · Escena 5 de 6</div><div class="h">EN THE WAY · MI BITÁCORA</div></div></div><div class="bd"><div class="read"><h4>Práctica única: «mi primer intento»</h4><p>Abre tu Mapa Personal de Renovación y consulta, sin volver a escribirlos, estos elementos:</p><ul><li>Semana 1: mi patrón y la Verdad que examiné.</li><li>Martes de Semana 2: mi señal temprana y mi pausa de regreso.</li><li>Miércoles de Semana 2: mi respuesta preparada y cómo reconoceré el intento.</li></ul><p>Hoy usas la respuesta que preparaste ayer.</p><h4>Paso 1 — Elige lo que realmente ocurrió</h4><p>Escoge una de estas tres posibilidades:</p><div class="field choice"><div class="opt"><span class="ckb"></span>Practiqué en una situación real y segura.</div><div class="opt"><span class="ckb"></span>Hice un ensayo de una situación posible.</div><div class="opt"><span class="ckb"></span>No tuve ocasión de practicar ni de ensayar hoy.</div></div><p>Un ensayo se registra como ensayo, no como experiencia real. Y no escoger la primera opción no significa que fallaste.</p><h4>Paso 2 — Registra solo lo nuevo</h4><h4>A. Mi intento</h4><p>«La situación o escena fue: <span class="blank"></span>. La respuesta que intenté (o ensayé) fue: <span class="blank"></span>».</p><p>Si no hubo ocasión, basta con escribir: «Hoy no hubo práctica ni ensayo». No inventes un ejemplo como si te hubiera pasado.</p><div class="field"><div class="t">A. Mi intento</div><div class="encuaderno"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>Escribe tu respuesta en tu cuaderno.</div></div><h4>B. Lo que pude observar</h4><p>«Pude notar que: <span class="blank"></span>».</p><p>Puedes contar si reconociste la señal, si te acordaste de la pausa, si intentaste una parte de la respuesta o si volviste a la reacción de antes. No tienes que calificar tu espiritualidad ni prometer resultados.</p><div class="field"><div class="t">B. Lo que pude observar</div><div class="encuaderno"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>Escribe tu respuesta en tu cuaderno.</div></div><h4>C. Algo que quiero revisar mañana</h4><p>«Para mi próximo intento necesito prestar atención a: <span class="blank"></span>».</p><p>Todavía no ajustes todo el plan: mañana vas a distinguir qué conservar y qué precisar.</p><div class="field"><div class="t">C. Algo que quiero revisar mañana</div><div class="encuaderno"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>Escribe tu respuesta en tu cuaderno.</div></div><div class="ejemplo"><div class="et">Ejemplo — Práctica real</div><p>Respuesta preparada ayer: «Cuando me pidan corregir una propuesta, escucharé y preguntaré cuáles son los ajustes concretos».</p><p>- Tipo: práctica real.</p><p>- Mi intento: «Hoy me pidieron ajustar una presentación. Sentí ganas de callarme, respiré, escuché y pregunté qué diapositivas necesitaban cambios».</p><p>- Lo que observé: «Logré preguntar, aunque seguí sintiéndome incómodo. Después me descubrí pensando otra vez que todo lo hago mal».</p><p>- Algo que quiero revisar: «Cómo recordar la Verdad después de la conversación, no solo durante ella».</p><p>EJEMPLO — ENSAYO</p><p>- Tipo: ensayo.</p><p>- Mi intento: «Imaginé que me pedían una corrección. Ensayé responder: “Entiendo. ¿Me ayudas a precisar los dos cambios más importantes?”».</p><p>- Lo que observé: «En el ensayo recordé mi pausa; todavía no sé cómo responderé en una situación real».</p><p>- Algo que quiero revisar: «Practicar escuchar sin interrumpir cuando aparezca una oportunidad segura».</p></div><h4>Si no hubo oportunidad</h4><p>Escríbelo tal como pasó. Mañana puedes ver si te sirve un ensayo sencillo o si prefieres esperar una ocasión real. No hace falta provocar un conflicto, ponerte en riesgo ni simular resultados.</p><h4>Si el intento no salió como esperabas</h4><p>No borres el registro ni lo cambies para que parezca un éxito. La Bitácora también sirve para reconocer las veces que volvemos a reaccionar como antes. Si la situación se repite mucho, es muy intensa o es peligrosa, busca el acompañamiento adecuado en lugar de esperar que este ejercicio la resuelva.</p><h4>Lo que queda guardado hoy</h4><p>El tipo de experiencia (real, ensayo o sin ocasión), lo que observaste y algo para revisar. Tu Ficha Inicial y el plan de los días anteriores siguen intactos.</p><p class="priv"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/><path d="m9 12 2 2 4-4"/></svg>Tus respuestas son privadas y no tienes obligación de compartirlas.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg></span><div><div class="k">Cierre · Escena 6 de 6</div><div class="h">EN THE WAY · CIERRE Y ORACIÓN</div></div></div><div class="bd"><div class="read"><p>Hoy pasaste de preparar una respuesta a observar un intento. Si practicaste en una situación real, escribe lo que pasó. Si ensayaste, escribe que fue un ensayo. Y si no hubo ocasión, eso también es verdad y también se guarda.</p><p>Mañana retomas este registro, con el mismo patrón. Vas a revisar qué aprendiste de tus respuestas y cómo seguir practicando con humildad y constancia.</p><h4>Oración</h4><p>«Señor Jesús, gracias porque nos llamas a recibir tu Palabra y a vivir conforme a lo que aprendemos de Ti. Ayúdame, por tu Espíritu, a reconocer mis respuestas habituales, recordar la Verdad y actuar con responsabilidad. Dame humildad para aprender de mis intentos, sabiduría para pedir ayuda cuando la necesite y perseverancia para seguir caminando contigo. Amén».</p><p>Mañana sigues en tu misma Bitácora.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section></section><section class="dia"><div class="hero"><div class="hero-in"><span class="mv">Reentrenar · Semana 2</span><h1>LO QUE APRENDO CUANDO LO INTENTO</h1><div class="meta">Día 10 de 20 · Viernes · <em>Filipenses 4:4–9</em></div></div></div><h2 class="ttl3">Las escenas de hoy</h2><div class="escenas"><div class="sc"><span class="n">01</span><span class="nm">Apertura</span><span class="ck"></span></div><div class="sc"><span class="n">02</span><span class="nm">La Palabra · S.T.A.R.S.</span><span class="ck"></span></div><div class="sc"><span class="n">03</span><span class="nm">El libro · Bookclub</span><span class="ck"></span></div><div class="sc"><span class="n">04</span><span class="nm">La lección · The Way</span><span class="ck"></span></div><div class="sc"><span class="n">05</span><span class="nm">Mi Bitácora</span><span class="ck"></span></div><div class="sc"><span class="n">06</span><span class="nm">Cierre</span><span class="ck"></span></div></div><p class="como">Marca cada escena cuando la termines. Se hacen en orden.</p><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg></span><div><div class="k">Apertura · Escena 1 de 6</div></div></div><div class="bd"><div class="read"><h4>Bienvenida</h4><p>Esta semana reconociste una señal que suele anunciar tu respuesta de siempre, preparaste una pausa, escogiste una respuesta concreta y ayer la intentaste, la ensayaste o escribiste con honestidad que no hubo ocasión.</p><p>Hoy vas a mirar el recorrido completo con una pregunta sencilla: «¿Qué me enseñó este intento —o la preparación para intentarlo— y qué necesito ajustar para seguir practicando?». Sigues con la misma creencia, y lo que escribiste se queda como está.</p><p>Reentrenar es aprender a responder desde la Verdad con atención, obediencia y constancia, aunque las emociones o las circunstancias no cambien de inmediato. Volver alguna vez al patrón de antes hace parte del aprendizaje.</p><p>Empieza por S.T.A.R.S.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/><path d="M12 7v6M9.5 9.5h5"/></svg></span><div><div class="k">La Palabra · S.T.A.R.S. · Escena 2 de 6</div><div class="h">DESDE THE WAY → S.T.A.R.S. — VOLVER A LA PALABRA</div></div></div><div class="bd"><div class="read"><h4>Lectura comparada — NBLA + The Message (MSG)</h4><p>Lee Filipenses 4:4–9 en la NBLA, desde S.T.A.R.S., con atención especial a los versículos 8 y 9. Después lee también en S.T.A.R.S. cómo lo dice The Message. Aquí no hay nada que escribir; lo de hoy va en tu Bitácora.</p><div class="bridge"><div class="br-top"><span class="br-tool"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/><path d="M12 7v6M9.5 9.5h5"/></svg>S.T.A.R.S.</span><span class="br-kind">Lectura de hoy</span></div><div class="br-ref">Filipenses 4:4–9</div><p class="br-note">En tu cuaderno la lectura va impresa aquí mismo. No necesitas abrir S.T.A.R.S.</p></div><div class="texto"><div class="tx-h"><span class="pill">NBLA</span>Filipenses 4:4–9 · con atención a los versículos 8 y 9</div><div class="biblia"><div class="sub">Regocijo y paz en el Señor</div><p class="v"><sup>4</sup>Regocíjense en el Señor siempre. Otra vez lo diré: ¡Regocíjense!</p><p class="v"><sup>5</sup>La bondad de ustedes sea conocida de todos los hombres. El Señor está cerca.</p><p class="v"><sup>6</sup>Por nada estén afanosos; antes bien, en todo, mediante oración y súplica con acción de gracias, sean dadas a conocer sus peticiones delante de Dios.</p><p class="v"><sup>7</sup>Y la paz de Dios, que sobrepasa todo entendimiento, guardará sus corazones y sus mentes en Cristo Jesús.</p><div class="sub">El secreto de la paz</div><p class="v foco"><sup>8</sup>Por lo demás, hermanos, todo lo que es verdadero, todo lo digno, todo lo justo, todo lo puro, todo lo amable, todo lo honorable, si hay alguna virtud o algo que merece elogio, en esto mediten.</p><p class="v foco"><sup>9</sup>Lo que también han aprendido y recibido y oído y visto en mí, esto practiquen, y el Dios de paz estará con ustedes.</p></div><div class="tx-h msg"><span class="pill">MSG</span>The Message · en lenguaje cotidiano</div><div class="msgref">Filipenses 4:4–5</div><p class="msgt">Celebren a Dios todo el día, todos los días. ¡Alégrense de verdad en Él! Que todas las personas con quienes se encuentren puedan ver con claridad que ustedes están de su lado, colaborando con ellas y no enfrentándolas. Ayúdenlas a reconocer que el Señor está cerca: su llegada puede ocurrir en cualquier momento.</p><div class="msgref">Filipenses 4:6–7</div><p class="msgt">No vivan consumidos por la preocupación. En vez de preocuparse, oren. Dejen que sus peticiones y sus alabanzas den forma de oración a sus inquietudes; háganle saber a Dios lo que les preocupa. Entonces la plenitud de Dios, que pone las cosas en su lugar, vendrá a serenarlos. Es maravilloso lo que sucede cuando Cristo ocupa el centro de la vida, en lugar de la preocupación.</p><div class="msgref">Filipenses 4:8–9</div><p class="msgt">En resumen, amigos: les irá mejor si llenan su mente y meditan en lo verdadero, noble, respetable, auténtico, admirable y lleno de gracia; en lo mejor y no lo peor, en lo hermoso y no lo feo, en aquello que merece alabanza y no maldición. Pongan en práctica lo que aprendieron de mí, lo que escucharon, vieron y comprendieron. Hagan esto, y Dios, que hace que todo encuentre su lugar, los incorporará a sus armonías más excelentes.</p><p class="nota">MSG: lectura complementaria en español, traducida para estudio desde el texto maestro inglés de The Message. No es una edición oficial en español. · Nueva Biblia de las Américas™, NBLA™ · Copyright © 2005 por The Lockman Foundation.</p></div><h4>S · Silencio</h4><p>Haz una pausa antes de leer. Puedes orar con estas palabras: «Señor, ayúdame a mirar con verdad lo que viví esta semana. Dame humildad para reconocer lo que necesito aprender y disposición para seguir practicando tu Palabra».</p><h4>T · Texto</h4><p>Lee Filipenses 4:4–9 completo, sin aislar los versículos 8 y 9. Fíjate a quiénes les escribe Pablo y qué acciones aparecen: oración, gratitud, atención a lo verdadero y práctica de lo aprendido. Mira cómo se conectan lo que la comunidad debe considerar y lo que debe poner en práctica.</p><h4>A · Análisis</h4><p>Mira cómo empieza y cómo termina el pasaje. En el versículo 7, Pablo habla de «la paz de Dios», que guarda los corazones y las mentes. En el versículo 9, después de pedir que meditemos y practiquemos, dice que «el Dios de paz» estará con nosotros. Empieza con la paz de Dios y termina con el Dios de paz. Las promesas valen por quien las hace.</p><p>La aplicación de hoy es concreta: mirar con honestidad cómo intentaste vivir una respuesta coherente con la verdad que estudiaste. Una sola experiencia no mide tu transformación.</p><h4>R · Reflexión</h4><p>Piensa en lo que escribiste ayer. ¿Qué aprendiste del intento, del ensayo o de la falta de oportunidad? ¿Qué parte de tu respuesta depende de tus decisiones y qué parte no puedes controlar? ¿Cómo puedes seguir practicando sin fingir un resultado?</p><h4>S · Siembra</h4><p>Quédate con esta idea: prestar atención a la verdad y practicar lo aprendido son parte del mismo camino. Llévala a tu Bitácora.</p><p>Antes de cerrar la semana, vas a repasar cómo se conectan las tres lecturas del libro. Abre BOOKCLUB.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></span><div><div class="k">El libro · Bookclub · Escena 3 de 6</div><div class="h">DESDE THE WAY → BOOKCLUB — INTEGRAR LO LEÍDO</div></div></div><div class="bd"><div class="read"><p>Hoy no hay capítulo nuevo. Repasa en BOOKCLUB las ideas centrales de los capítulos 4, 5 y 6 del resumen de <em>Gana la guerra en tu mente</em>, de Craig Groeschel:</p><p>• Capítulo 4, «Cables cruzados y surcos circulares»: una respuesta repetida puede llegar a sentirse como el único camino posible. La imagen del surco ayuda a reconocer un hábito.</p><p>• Capítulo 5, «Crea una trinchera de la verdad»: frente al camino de siempre, preparas a propósito una respuesta apoyada en la Verdad de la Escritura.</p><p>• Capítulo 6, «Rumiar y renovar»: volver con atención a una enseñanza te ayuda a recordarla y a practicarla.</p><p>Mientras repasas, piensa en esta pregunta: «¿Qué idea del libro me ayuda a comprender mi intento y qué necesita seguir siendo examinado a la luz de la Escritura?».</p><p>Si lees el libro completo, busca las ideas equivalentes en tu edición. Los ejercicios del libro son opcionales; todo se reúne en tu Bitácora.</p><p>Vuelve a THE WAY.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20 12 4l9 16z"/><path d="m8 20 4-7 4 7"/></svg></span><div><div class="k">La lección · The Way · Escena 4 de 6</div><div class="h">EN THE WAY — ENSEÑANZA</div></div></div><div class="bd"><div class="read"><h4>Lo que aprendo cuando lo intento</h4><p>Piensa en alguien que aprende a tocar piano. Sabe dónde va el do, dónde va el re y cómo poner las manos, pero cuando se sienta a tocar y trata de pasar de una nota a otra, la mano se le va para un lado y para el otro. ¿Qué hace? Vuelve al piano. Lo intenta, se equivoca y lo vuelve a intentar. Siempre hay un fallo y luego una repetición, pero la distancia entre lo que sabe y lo que puede hacer se va acortando. A mí me pasó con el oficio de ingeniero: lo que al principio me exigía muchísimo esfuerzo, con el tiempo se volvió natural. Practicamos las notas hasta dominarlas. ¿Por qué no practicamos la reacción?</p><p>Hoy vas a mirar lo que pasó al intentar tu respuesta nueva. Es fácil entender un principio mientras lo escribes; aplicarlo en medio de una conversación, del cansancio o de la incertidumbre es otra cosa. Puede que hayas escuchado una corrección completa antes de responder, aunque después volviera la inseguridad. O que reaccionaras como antes y recordaras la pausa demasiado tarde. O que no surgiera la ocasión y solo ensayaras, o ni eso. Todo enseña algo, aunque no todo pese igual como evidencia.</p><p>Hagamos tres distinciones.</p><p><strong>Intento y resultado.</strong> Puedes escuchar con respeto y aun así recibir una crítica; pedir perdón sin reconciliarte enseguida; actuar con responsabilidad y seguir sintiendo miedo. Separa lo que hiciste de lo que dependía de otros. Ni todo intento es un éxito, ni todo resultado difícil es un fracaso.</p><p><strong>Retroceso e identidad.</strong> Si repetiste la respuesta de antes, obsérvala. Tal vez necesitas reconocer la señal antes, simplificar tu pausa o preparar una acción que de verdad dependa de ti. Un episodio no demuestra que no puedas aprender, ni define lo que Dios está haciendo en tu vida.</p><p><strong>Repetir y practicar.</strong> Los surcos y el camino nuevo de Groeschel ilustran bien el aprendizaje a propósito. Filipenses 4 lo dice a su manera: pensar en lo verdadero y practicar lo aprendido. Y la formación cristiana incluye entender la Palabra, orar, obedecer, dejarse acompañar y depender del Espíritu Santo.</p><p>Vuelve a la persona que interpreta una corrección como «no sirvo». El martes reconoció su señal; el miércoles preparó escuchar y preguntar. Si el jueves lo logró, pero pasó la tarde condenándose, puede conservar lo que sí practicó y añadir una precisión: «Después de la corrección, voy a revisar los hechos antes de dictar una sentencia sobre mí». Si reaccionó como siempre, puede ajustar su señal o su pausa. Si no tuvo ocasión, conserva el plan sin inventar una experiencia.</p><p>Esta revisión no reemplaza la ayuda profesional. Si tu patrón ocurre en un contexto de abuso, peligro o daño que se repite, protegerte y buscar apoyo va primero que practicar una respuesta frente a quien te pone en riesgo.</p><p>Hoy completas la segunda ficha de tu <strong>Mapa Personal de Renovación: «Mi plan de práctica»</strong>. Sin volver a escribir tu historia, tu creencia, tu señal ni tu respuesta, anotas lo que aprendiste, distingues práctica real, ensayo o falta de ocasión, conservas o precisas lo necesario y escoges un próximo paso razonable.</p><p>Y un día, ojalá, alguien en tu casa o en tu trabajo te va a decir: «Algo te pasó. Ya no reaccionas igual. Sé que estás pasando por algo difícil, pero te veo en paz. ¿Cómo haces?». Al principio van a querer esa paz. Después, ojalá, van a querer conocer al Dios de esa paz. Nunca va a ser perfecto, pero si practicas una y otra vez, la distancia entre lo que sabes y lo que vives se va a ir cerrando.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></span><div><div class="k">Mi Bitácora · Escena 5 de 6</div><div class="h">EN THE WAY — MI BITÁCORA</div></div></div><div class="bd"><div class="read"><h4>Ficha semanal 2: «mi plan de práctica»</h4><h4>Práctica de hoy: «lo que conservo, lo que ajusto»</h4><p>Abre tu Mapa Personal de Renovación y mira, sin volver a copiarlo, lo que escribiste:</p><ul><li>Semana 1: el patrón elegido, la Verdad examinada y tu primera respuesta nueva.</li><li>Martes: mi señal temprana y mi pausa de regreso.</li><li>Miércoles: mi respuesta preparada y cómo reconoceré un intento.</li><li>Jueves: si hubo práctica real, ensayo o ninguna ocasión; qué observé y qué quería revisar.</li></ul><p>Hoy añades tres conclusiones breves para cerrar esta ficha semanal:</p><div class="field"><div class="t">A. Qué aprendí de lo ocurrido</div><p class="pr">«Al revisar mi práctica, mi ensayo o la ausencia de ocasión, reconozco que: <span class="blank"></span>».</p><div class="encuaderno"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>Escribe tu respuesta en tu cuaderno.</div></div><p>«Al revisar mi práctica, mi ensayo o la ausencia de ocasión, reconozco que: <span class="blank"></span>».</p><p>Describe un hecho o algo que observaste con honestidad. Si no hubo ocasión, dilo; no escribas que ya cambiaste una respuesta que todavía no has intentado.</p><div class="field"><div class="t">B. Qué conservo y qué ajusto</div><p class="pr">«Conservo esta parte de mi respuesta: <span class="blank"></span>. Para el siguiente intento voy a precisar: <span class="blank"></span>».</p><div class="encuaderno"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>Escribe tu respuesta en tu cuaderno.</div></div><p>«Conservo esta parte de mi respuesta: <span class="blank"></span>. Para el siguiente intento voy a precisar: <span class="blank"></span>».</p><p>Si todavía no tienes con qué ajustarlo, puedes dejar el plan como está y escribir: «Por ahora conservo la respuesta preparada; necesito una ocasión adecuada para observarla». Sigue con el mismo patrón y la misma Verdad bíblica, aunque la ficha parezca menos completa.</p><div class="field"><div class="t">C. Mi próximo paso realista</div><p class="pr">«Cuando aparezca una ocasión segura y apropiada, intentaré: <span class="blank"></span>. Si necesito ayuda u orientación, acudiré a: <span class="blank"></span>».</p><div class="encuaderno"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>Escribe tu respuesta en tu cuaderno.</div></div><p>«Cuando aparezca una ocasión segura y apropiada, intentaré: <span class="blank"></span>. Si necesito ayuda u orientación, acudiré a: <span class="blank"></span>».</p><p>Que el próximo paso dependa de ti hasta donde se pueda. No prometas la reacción de otros, el resultado de una conversación ni que una emoción va a desaparecer.</p><div class="ejemplo"><div class="et">Ejemplo ilustrativo — Hubo práctica real</div><p>Lo que ya estaba registrado:</p><p>- Patrón: interpretar una corrección como prueba de incompetencia.</p><p>- Señal: al escuchar una observación, pienso «otra vez fallé».</p><p>- Pausa: distinguir la corrección concreta de mi conclusión global.</p><p>- Respuesta: escuchar hasta el final y pedir claridad sobre los ajustes.</p><p>- Intento del jueves: escuché e hice una pregunta, aunque después volví a pensar que todo lo hacía mal.</p><p>Lo nuevo que agrego hoy:</p><p>- Lo que aprendí: «Pude pedir aclaración sin abandonar la conversación, pero seguí convirtiendo la corrección en un juicio general después de salir».</p><p>- Lo que conservo y ajusto: «Conservo escuchar y preguntar. Añadiré después una revisión de cuáles eran exactamente los cambios solicitados, antes de evaluar toda mi capacidad».</p><p>- Próximo paso: «En una próxima corrección, intentaré esa secuencia. Si no logro distinguir lo que ocurrió de lo que supuse, pediré orientación a una persona confiable».</p><p>EJEMPLO ILUSTRATIVO — SOLO HUBO ENSAYO</p><p>- Lo que aprendí: «En el ensayo pude expresar la respuesta preparada, pero aún no sé cómo reaccionaré en una situación real».</p><p>- Lo que conservo y ajusto: «Conservo el plan. Haré mi pausa más breve para recordarla con facilidad».</p><p>- Próximo paso: «Practicaré cuando aparezca una situación real y segura. No necesito provocarla».</p></div><h4>Si no hubo ocasión ni ensayo</h4><p>Escribe: «Esta semana no tuve ocasión de practicar ni de ensayar; todavía no puedo evaluar cómo responderé». Puedes conservar tu respuesta preparada y decidir cuándo revisarla en una ocasión segura. Que no haya habido un episodio no te resta nada, y no hace falta inventar resultados.</p><h4>Lo que queda guardado esta semana</h4><p>Tu ficha «Mi plan de práctica» reúne lo que ya construiste y estas tres conclusiones. El patrón de la Semana 1 sigue igual. La Bitácora guarda también los intentos a medias y las preguntas abiertas: es un registro del camino, no un certificado.</p><p class="priv"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/><path d="m9 12 2 2 4-4"/></svg>Tus respuestas son privadas y no tienes obligación de compartirlas.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg></span><div><div class="k">Cierre · Escena 6 de 6</div><div class="h">EN THE WAY — CIERRE Y ORACIÓN</div></div></div><div class="bd"><div class="read"><p>Hoy terminaste la segunda ficha de tu Mapa Personal de Renovación. Ya tienes más que una respuesta que quieres dar: una señal que reconoces, una pausa, una acción preparada y una forma honesta de aprender de tus intentos.</p><p>Si practicaste, guarda lo que observaste. Si ensayaste, reconoce lo que vale el ensayo y hasta dónde llega. Si la situación no apareció, no la inventes. Sigues con el mismo patrón.</p><h4>Oración</h4><p>«Padre, gracias porque tu Palabra nos llama a escuchar y poner en práctica lo aprendido. Reconozco que todavía tengo respuestas antiguas y que no puedo producir por mí mismo la transformación que necesito. Por tu Espíritu, forma en mí una manera de pensar y vivir más fiel a Jesús. Dame humildad para aprender, perseverancia para obedecer y sabiduría para buscar ayuda cuando sea necesaria. Amén».</p><p>La próxima semana empieza Replantear: con el mismo patrón, vas a mirar cómo estás interpretando tu realidad y qué otras lecturas responsables puedes considerar delante de la Verdad. Por ahora, guarda tu Bitácora y descansa. El fin de semana queda para ponerte al día, sin tareas nuevas.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section></section></template>
<script>
(()=>{
const ID='semana-2', TIT='Semana 2';
const $=id=>document.getElementById(id);
const mesa=$('mesa'),libro=$('libro'),medidor=$('medidor'),espera=$('espera'),num=$('num'),ant=$('ant'),sig=$('sig'),navD=$('dias');
const ZS=[.85,1,1.15,1.3,1.5,1.75,2];
let mem={};try{mem=JSON.parse(localStorage.getItem('tw_lector_'+ID)||'{}')}catch(e){}
let zi=ZS.indexOf(mem.z);if(zi<0)zi=1;
function guardar(){try{localStorage.setItem('tw_lector_'+ID,JSON.stringify({z:ZS[zi],k:anclaK}))}catch(e){}}

/* --- La fuente: el mismo contenido del cuadernillo impreso, sin cambiar una palabra --- */
const SRC=$('fuente').content;
let kk=0;SRC.querySelectorAll('*').forEach(e=>e.dataset.k=kk++);
const TOP=[...SRC.children];
const dLabels=TOP.map(e=>{if(e.classList.contains('portada'))return 'Inicio';
  const m=(e.querySelector('.meta')||{}).textContent||'';const r=m.match(/Día\s+(\d+)[^·]*·\s*([^·]+)/);return r?('Día '+r[1]+' · '+r[2].trim()):null});
const ATOM='.hero,.phero,.pbar,.escenas,.hd,.yt,.qr,.br-top,.br-ref,svg,img,hr,.tx-h,.sub,.lt,.lh,.ll,.msgref,.et,.t,.mv,.pill,sup,.blank,.ckb,.encuaderno,h1,h2,h3,h4';
const TIT_SEL='h1,h2,h3,h4,.hd,.tx-h,.sub,.lt,.lh,.ll,.msgref,.br-top,.ttl3,.t,.et';
const BLOQ=/^(P|DIV|SECTION|UL|OL|LI|H[1-6]|HR|BLOCKQUOTE|TABLE|FIGURE|NAV|ARTICLE|HEADER|FOOTER)$/;
const tieneBloques=e=>[...e.children].some(c=>BLOQ.test(c.tagName));

/* --- Geometría: depende de la pantalla y del tamaño de letra --- */
let G={};
function geometria(){
  const W=mesa.clientWidth,H=mesa.clientHeight;
  const dos=W>=900&&W>H*1.2;
  const m=W<500?6:14;
  const ph=Math.max(200,H-m*2);
  let pw;
  if(dos)pw=Math.min((W-m*2)/2,ph*.8,680);
  else pw=Math.min(W-m*2,W<700?W:Math.max(ph*.78,Math.min(W*.86,720)),760);
  pw=Math.floor(pw);
  const pad=pw<460?16:pw<620?26:34;
  const base=pw<430?1:pw<560?1.06:pw<700?1.12:1.25;/* hojas grandes: letra base un poco mayor */
  return {W,H,dos,pw,ph:Math.floor(ph),pad,z:ZS[zi]*base};
}

/* --- Paginación: reparte el texto en hojas del tamaño exacto de esta pantalla --- */
let pages=[],diaPag=[],cur,chain;
function hojaNueva(){
  const el=document.createElement('div');el.className='pagina';
  el.style.cssText=`width:${G.pw}px;height:${G.ph}px;padding:${G.pad}px ${G.pad}px ${Math.round(G.pad*.6)}px;position:relative`;
  const c=document.createElement('div');c.className='cont';el.appendChild(c);
  const pp=document.createElement('div');pp.className='pp';pp.innerHTML=`<span>THE WAY · ${TIT}</span><span class="n"></span>`;el.appendChild(pp);
  return {el,c};
}
function nueva(){
  if(cur)cur.el.remove();
  cur=hojaNueva();medidor.appendChild(cur.el);pages.push(cur.el);
  let p=cur.c;const nc=[];
  for(const [s] of chain){const c=s.cloneNode(false);c.classList.add('sigue');p.appendChild(c);nc.push([s,c]);p=c}
  chain=nc;
}
const lleno=()=>cur.c.scrollHeight>cur.c.clientHeight+1;
const par=()=>chain.length?chain[chain.length-1][1]:cur.c;
const vacia=()=>!cur.c.textContent.trim()&&!cur.c.querySelector('svg,img,.hero,.phero,hr');
/* Antes de pasar a una hoja nueva, los títulos que quedaron solos al final se van con su texto */
const VIS='svg,img,hr,.hero,.phero';
function saltar(){
  /* quitar del final las cajas que quedaron vacías (se rehacen en la hoja nueva) */
  for(let L=chain.length-1;L>=0;L--){const sh=chain[L][1];if(!sh.textContent.trim()&&!sh.querySelector(VIS))sh.remove();else break}
  const mov=[];// [nivel, nodo]
  fuera:for(let L=chain.length-1;L>=-1;L--){
    const sh=L>=0?chain[L][1]:cur.c, sig=L+1<chain.length?chain[L+1][1]:null;
    if(!sh.isConnected)continue;
    if([...sh.childNodes].some(n=>n.nodeType===3&&n.data.trim()))break;
    const kids=[...sh.children];let i=kids.length-1;
    for(;i>=0;i--){const k=kids[i];
      if(k===sig){if(k.textContent.trim()||k.querySelector(VIS))break fuera;continue}
      if(k.matches(TIT_SEL)){mov.push([L,k,k.parentNode,k.nextSibling]);k.remove()}else break}
    if(i>=0)break;
  }
  if(mov.length&&vacia()){/* no dejar hojas vacías: devolver */
      for(const [,n,pa,nx] of mov.slice().reverse())pa.insertBefore(n,nx&&nx.parentNode===pa?nx:null);
      nueva();return}
  for(let L=chain.length-1;L>=0;L--){const sh=chain[L][1];if(sh.isConnected&&!sh.textContent.trim()&&!sh.querySelector(VIS))sh.remove()}
  nueva();
  const pend={};mov.forEach(([L,n])=>(pend[L]=pend[L]||[]).push(n));
  for(const L in pend){const l=+L;const sh=l>=0?chain[l][1]:cur.c;const sig=l+1<chain.length?chain[l+1][1]:null;
    pend[L].sort((a,b)=>a.dataset.k-b.dataset.k).forEach(n=>sh.insertBefore(n,sig))}
}
function ponerTexto(t){
  const w=t.data.split(/(\s+)/);let tn=document.createTextNode('');par().appendChild(tn);let i=0;
  while(i<w.length){
    tn.data=w.slice(i).join('');if(!lleno())return;
    let lo=i+1,hi=w.length-1,best=i;
    while(lo<=hi){const mid=(lo+hi)>>1;tn.data=w.slice(i,mid).join('');if(lleno())hi=mid-1;else{best=mid;lo=mid+1}}
    if(best===i&&vacia())best=i+1;
    tn.data=w.slice(i,best).join('');if(!tn.data)tn.remove();i=best;
    saltar();tn=document.createTextNode('');par().appendChild(tn);
  }
}
function poner(n){
  if(n.nodeType===3){if(!n.data.trim()){par().appendChild(n.cloneNode());return}ponerTexto(n);return}
  if(n.nodeType!==1)return;
  if(n.matches(ATOM)){
    const c=n.cloneNode(true);par().appendChild(c);
    if(lleno()&&!vacia()){c.remove();saltar();par().appendChild(c)}
    if(lleno()){/* algo que no cabe ni en una hoja entera (pantalla muy baja): se achica para que se vea completo */
      const r=cur.c.clientHeight/cur.c.scrollHeight;c.style.zoom=Math.max(.45,r*.97)}
    return;
  }
  const c=n.cloneNode(false);par().appendChild(c);chain.push([n,c]);
  for(const k of [...n.childNodes])poner(k);
  chain.pop();
}
function paginar(){
  medidor.innerHTML='';pages=[];diaPag=[];chain=[];cur=null;
  document.documentElement.style.fontSize=(16*G.z)+'px';
  nueva();
  TOP.forEach((e,i)=>{
    const esDia=e.classList.contains('dia');
    if(esDia&&i>0&&!vacia())nueva();
    if(esDia&&G.dos&&pages.length%2===0&&i>0){/* en libro abierto, cada día empieza en la hoja izquierda */
      cur.el.classList.add('vacia');cur.c.innerHTML='<svg viewBox="0 0 64 48" width="64" height="48"><path d="M2 46 17 18l15 28z" fill="#A8C4D4"/><path d="M34 46 47 20l15 26z" fill="#2B5577"/><path d="M12 46 32 4l20 42z" fill="#C8A84B"/></svg>';nueva()}
    diaPag[i]=pages.length-1;poner(e);
  });
  if(cur)cur.el.remove();
  while(pages.length>1&&!pages[pages.length-1].classList.contains('vacia')&&!pages[pages.length-1].querySelector('.cont').textContent.trim())pages.pop();
  if(G.dos&&pages.length%2){const b=hojaNueva();b.el.classList.add('vacia');pages.push(b.el)}
  pages.forEach((p,i)=>{p.querySelector('.pp .n').textContent=(i+1)+' / '+pages.length;p.dataset.i=i});
}

/* --- Mostrar --- */
let pos=0,anclaK=mem.k!=null?mem.k:-1,ocupado=false;
let slotA,slotB;
function paso(){return G.dos?2:1}
function montar(){
  libro.innerHTML='';libro.className=G.dos?'dos':'uno';
  libro.style.width=(G.dos?G.pw*2:G.pw)+'px';libro.style.height=G.ph+'px';
  slotA=document.createElement('div');slotA.className='slot izq';
  slotB=document.createElement('div');slotB.className='slot der';
  slotA.style.cssText=`left:0;width:${G.pw}px;height:${G.ph}px`;
  slotB.style.cssText=`left:${G.dos?G.pw:0}px;width:${G.pw}px;height:${G.ph}px`;
  libro.append(slotA,slotB);
}
function poner2(slot,i){slot.replaceChildren();if(i>=0&&i<pages.length)slot.appendChild(pages[i])}
function pintar(){
  if(G.dos){poner2(slotA,pos);poner2(slotB,pos+1)}else{poner2(slotA,-1);poner2(slotB,pos)}
  const n=pages.length;num.textContent=G.dos?`${pos+1}–${Math.min(pos+2,n)} / ${n}`:`${pos+1} / ${n}`;
  ant.disabled=pos<=0;sig.disabled=pos+paso()>=n;
  let d=0;diaPag.forEach((p,i)=>{if(p<=pos+(G.dos?1:0))d=i});
  [...navD.children].forEach((b,i)=>b.setAttribute('aria-current',String(+b.dataset.i===d)));
  const vis=[pages[pos],G.dos?pages[pos+1]:null].filter(Boolean);
  for(const v of vis){const e=v.querySelector('.cont [data-k]:not(.sigue)');if(e){anclaK=+e.dataset.k;break}}
  guardar();
}
function buscarK(k){if(k<0)return 0;
  for(let i=0;i<pages.length;i++){for(const e of pages[i].querySelectorAll('.cont [data-k]'))if(+e.dataset.k>=k&&!e.classList.contains('sigue'))return i}
  return 0}
function alinear(i){i=Math.max(0,Math.min(pages.length-1,i));return G.dos?i-(i%2):i}
let ultimo='';
function rearmar(){
  const g=geometria(),clave=[g.pw,g.ph,g.dos,g.z].join();
  if(clave===ultimo)return;ultimo=clave;
  espera.hidden=false;
  requestAnimationFrame(()=>setTimeout(()=>{
    const k=anclaK;G=g;paginar();montar();pos=alinear(buscarK(k));anclaK=k;pintar();
    document.querySelectorAll('#menos,[data-z="-1"]').forEach(b=>b.disabled=zi===0);document.querySelectorAll('#mas,[data-z="1"]').forEach(b=>b.disabled=zi===ZS.length-1);
    espera.hidden=true;
  },20));
}

/* --- Pasar la hoja (con el dedo o con los botones): siempre una hoja por vez --- */
let T=null;// turno en curso
function empezar(dir){
  if(ocupado)return false;
  const n=pages.length,st=paso();
  if(dir>0&&pos+st>=n)return false;if(dir<0&&pos<=0)return false;
  ocupado=true;
  const hoja=document.createElement('div');hoja.className='hojaG';
  hoja.style.cssText=`left:${G.dos?G.pw:0}px;width:${G.pw}px;height:${G.ph}px`;
  const fr=document.createElement('div');fr.className='cara frente';const ds=document.createElement('div');ds.className='cara dorso';
  const blanco=()=>{const b=hojaNueva();b.el.classList.add('vacia');b.c.innerHTML='';b.el.querySelector('.pp').remove();return b.el};
  let fI,bI,aI,bJ,dest;
  if(G.dos){
    if(dir>0){fI=pos+1;bI=pos+2;aI=pos;bJ=pos+3;dest=pos+2}else{fI=pos-1;bI=pos;aI=pos-2;bJ=pos+1;dest=pos-2}
    poner2(slotA,aI);poner2(slotB,bJ);
    fr.appendChild(pages[fI]);if(pages[bI])ds.appendChild(pages[bI]);else ds.appendChild(blanco());
  }else{
    if(dir>0){fI=pos;aI=-1;bJ=pos+1;dest=pos+1}else{fI=pos-1;aI=-1;bJ=pos;dest=pos-1}
    poner2(slotA,-1);poner2(slotB,bJ);
    fr.appendChild(pages[fI]);ds.appendChild(blanco());
  }
  const l1=document.createElement('div');l1.className='luz';fr.appendChild(l1);
  const l2=document.createElement('div');l2.className='luz';ds.appendChild(l2);
  hoja.append(fr,ds);libro.appendChild(hoja);
  T={dir,hoja,l1,l2,dest,t:dir>0?0:1};
  fijar(T.t);
  return true;
}
function fijar(t){// t: 0 = hoja plana a la derecha, 1 = hoja ya pasada (a la izquierda)
  t=Math.max(0,Math.min(1,t));T.t=t;
  const a=-180*t;T.hoja.style.transform=`rotateY(${a}deg)`;
  const s=Math.sin(Math.PI*t);T.l1.style.opacity=s*1.1;T.l2.style.opacity=s*1.1;
}
function terminar(hacia,ms){// hacia: 1 completar, 0 cancelar
  const fin=T.dir>0?hacia:1-hacia;
  const h=T.hoja,ini=T.t,t0=performance.now(),dur=Math.max(120,ms*Math.abs(fin-ini));
  function cuadro(now){
    const u=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-u,3);
    fijar(ini+(fin-ini)*e);
    if(u<1)requestAnimationFrame(cuadro);
    else{h.remove();if(hacia)pos=T.dest;T=null;ocupado=false;pintar();if(cola){const d=Math.sign(cola);cola-=d;pasar(d)}}
  }
  requestAnimationFrame(cuadro);
}
let cola=0;
function pasar(dir){if(ocupado){if(Math.sign(cola)!==-dir&&Math.abs(cola)<4)cola+=dir;return}if(empezar(dir))terminar(1,cola?320:650)}
ant.onclick=()=>pasar(-1);sig.onclick=()=>pasar(1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')pasar(1);else if(e.key==='ArrowLeft'||e.key==='PageUp')pasar(-1)});
/* Dedo: la hoja sigue al dedo; al soltar, termina de pasar o vuelve a su sitio */
let d0=null;
mesa.addEventListener('pointerdown',e=>{if(ocupado||!e.isPrimary)return;d0={x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId,on:false}});
mesa.addEventListener('pointermove',e=>{
  if(!d0||e.pointerId!==d0.id)return;
  const dx=e.clientX-d0.x,dy=e.clientY-d0.y;
  if(!d0.on){if(Math.abs(dx)<12||Math.abs(dx)<Math.abs(dy)*1.2)return;
    if(!empezar(dx<0?1:-1)){d0=null;return}d0.on=true;d0.dir=T.dir;try{mesa.setPointerCapture(e.pointerId)}catch(_){}}
  const w=G.pw*(G.dos?1.3:1.1),p=Math.max(0,Math.min(1,(d0.dir>0?-dx:dx)/w));
  fijar(d0.dir>0?p:1-p);d0.last=e.clientX;d0.lt=performance.now();
});
function soltar(e){
  if(!d0)return;const d=d0;d0=null;if(!d.on||!T)return;
  const dx=e.clientX-d.x,vel=(e.clientX-(d.last??d.x))/Math.max(1,performance.now()-(d.lt??d.t));
  const prog=d.dir>0?T.t:1-T.t;
  const rapido=d.dir>0?vel<-.5:vel>.5;
  terminar(prog>.3||rapido?1:0,520);
}
mesa.addEventListener('pointerup',soltar);mesa.addEventListener('pointercancel',soltar);
mesa.addEventListener('dragstart',e=>e.preventDefault());

/* --- Letra --- */
function letra(d){const n=zi+d;if(n<0||n>=ZS.length||ocupado)return;zi=n;guardar();rearmar()}
$('menos').onclick=()=>letra(-1);$('mas').onclick=()=>letra(1);
document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>letra(+b.dataset.z));

/* --- Días --- */
TOP.forEach((e,i)=>{if(!dLabels[i])return;const b=document.createElement('button');b.textContent=dLabels[i];b.dataset.i=i;
  b.onclick=()=>{if(ocupado)return;pos=alinear(diaPag[i]);pintar()};navD.appendChild(b)});

if(navD.children.length<2){navD.remove();document.body.classList.add('sinDias')}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(rearmar,200)});
document.fonts&&document.fonts.ready.then(()=>{ultimo='';rearmar()});
rearmar();
window.__lector={get pos(){return pos},get n(){return pages.length},get G(){return G},pasar,get ocupado(){return ocupado},pages:()=>pages};
})();
</script>
