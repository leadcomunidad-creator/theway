<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:title" content="Protocolo Metanoia · Semana 2 · Reentrenar">
<meta property="og:description" content="Las cinco jornadas de la semana para leer pasando las hojas.">
<meta property="og:url" content="https://thewaylhscol.netlify.app/cuadernillo/semana-2/">
<meta property="og:image" content="https://thewaylhscol.netlify.app/assets/og-theway.jpg">
<meta name="robots" content="noindex">
<title>Protocolo Metanoia · Semana 2</title>
<style>
@font-face{font-family:'Bebas Neue';src:url(../bebas.woff2) format('woff2')}
:root{--night:#E9E3D3;--surface:#FBF8F0;--gold:#7A5C12;--gold-b:#C8A84B;--text:#1B2430;--muted:#4D5A65;--c:#22633B;--border:rgba(20,30,40,.14)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--text);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#080C12;color:#EAE8E0;position:relative;z-index:5}
header svg{width:34px;height:26px;flex:none}
.wm{font:400 22px/1 'Bebas Neue',Impact,sans-serif;letter-spacing:.05em}.wm b{font-weight:400;color:#C8A84B}
header .sub{font-size:12px;color:#9DB0BB;line-height:1.2}
header .sp{flex:1}
header a.todo{color:#DEC06A;font-size:13px;font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:7px 12px}
.dias{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 6px;scrollbar-width:none;position:relative;z-index:5}
.dias::-webkit-scrollbar{display:none}
.dias button{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text);font:700 14px inherit;font-family:inherit;padding:9px 14px;border-radius:99px;cursor:pointer}
.dias button[aria-current=true]{background:var(--c);border-color:var(--c);color:#fff}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 8px;min-height:0;overflow:hidden;position:relative;z-index:1}
.pagina{background:#fff;box-shadow:0 2px 16px rgba(20,30,40,.18)}
.pagina img{width:100%;height:100%;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}
.controles{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px 6px;position:relative;z-index:5}
.controles button{min-width:118px;min-height:50px;border-radius:14px;border:0;font:700 17px inherit;font-family:inherit;cursor:pointer}
#ant{background:var(--surface);color:var(--text);border:1px solid var(--border)}
#sig{background:var(--gold-b);color:#080C12}
.controles button:disabled{opacity:.35}
#num{min-width:90px;text-align:center;font-weight:700;font-size:15px;color:var(--muted)}
.pie{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;padding:0 12px 12px;font-size:13px;color:var(--muted);text-align:center;position:relative;z-index:5}
.pie a{color:var(--gold);font-weight:700}
/* tablet y computador: barra superior con los días al lado, controles a los lados del libro */
@media (min-width:900px){
 body{display:grid;grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto auto}
 .dias{justify-content:center;padding:12px 16px 4px}
 .controles{padding:6px 12px 4px}
}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 64 48" aria-hidden="true"><path d="M2 46 17 18l15 28z" fill="#A8C4D4"/><path d="M34 46 47 20l15 26z" fill="#2B5577"/><path d="M12 46 32 4l20 42z" fill="#C8A84B"/><g fill="#0C1520"><circle cx="31" cy="15" r="1.4"/><circle cx="33" cy="20" r="1.4"/><circle cx="31.5" cy="25" r="1.4"/><circle cx="29" cy="30" r="1.4"/><circle cx="27.5" cy="35" r="1.4"/><circle cx="25" cy="40" r="1.4"/><circle cx="22.5" cy="44" r="1.4"/></g></svg>
  <div><div class="wm">THE <b>WAY</b></div><div class="sub">Protocolo Metanoia · Cuadernillo · Semana 2</div></div>
  <span class="sp"></span>
  <a class="todo" href="../">Todo el cuadernillo</a>
</header>
<nav class="dias" aria-label="Ir a un día"><button data-i="0">Inicio</button><button data-i="1">Día 6 · Lunes</button><button data-i="2">Día 7 · Martes</button><button data-i="3">Día 8 · Miércoles</button><button data-i="4">Día 9 · Jueves</button><button data-i="5">Día 10 · Viernes</button></nav>
<main><div id="libro"></div></main>
<div class="controles">
  <button id="ant" aria-label="Página anterior">‹ Anterior</button>
  <span id="num" aria-live="polite"></span>
  <button id="sig" aria-label="Página siguiente">Siguiente ›</button>
</div>
<div class="pie">
  <a href="Metanoia_Semana2_para_imprimir.pdf" download>Descargar para imprimir (PDF)</a>
  <span>Contenido privado del curso. Por favor, no lo compartas.</span>
</div>
<script src="../pageflip.js"></script>
<script>
/* Dos ediciones del mismo cuadernillo: «p» para celular (página angosta) y «t» para tablet y computador (página 3:4, diseño propio). */
const SETS={"p": {"n": 107, "r": 0.5617977528089888, "d": [1, 3, 15, 38, 61, 87]}, "t": {"n": 83, "r": 0.75, "d": [1, 3, 13, 31, 49, 69]}};
const big=Math.min(innerWidth,innerHeight)>=600||innerWidth>=900;
const S=big?SETS.t:SETS.p, K=big?'t':'p';
const libro=document.getElementById('libro');
for(let i=1;i<=S.n;i++){const d=document.createElement('div');d.className='pagina';
  const im=document.createElement('img');im.alt='Página '+i;im.loading=i<=4?'eager':'lazy';im.decoding='async';
  im.src=K+'/'+String(i).padStart(3,'0')+'.webp';d.appendChild(im);libro.appendChild(d);}
function tam(){const m=document.querySelector('main');const h=m.clientHeight-8,w=m.clientWidth-16;
  const dos=w>h*S.r*1.6; const pw=Math.min(dos?w/2:w,h*S.r); return {w:Math.floor(pw),h:Math.floor(pw/S.r)};}
const t=tam();
const pf=new St.PageFlip(libro,{width:t.w,height:t.h,size:'fixed',showCover:false,usePortrait:true,mobileScrollSupport:false,maxShadowOpacity:.35,flippingTime:650});
pf.loadFromHTML(document.querySelectorAll('.pagina'));
const num=document.getElementById('num'),ant=document.getElementById('ant'),sig=document.getElementById('sig');
const dias=[...document.querySelectorAll('.dias button')];
const KEY='tw_cuadernillo_semana-2_'+K;
function marcar(){const i=pf.getCurrentPageIndex()+1;num.textContent=i+' / '+S.n;ant.disabled=i<=1;sig.disabled=i>=S.n;
  if(dias.length){let cur=dias[0];dias.forEach(b=>{if(S.d[+b.dataset.i]<=i)cur=b});dias.forEach(b=>b.setAttribute('aria-current',b===cur));}
  try{localStorage.setItem(KEY,String(i))}catch(e){}
  const ims=libro.querySelectorAll('img');for(let k=i;k<i+4&&k<=S.n;k++){if(ims[k-1])ims[k-1].loading='eager'}}
pf.on('flip',marcar);
ant.onclick=()=>pf.flipPrev();sig.onclick=()=>pf.flipNext();
dias.forEach(b=>b.onclick=()=>{pf.turnToPage(S.d[+b.dataset.i]-1);marcar()});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')pf.flipNext();if(e.key==='ArrowLeft')pf.flipPrev()});
let g=1;try{g=+localStorage.getItem(KEY)||1}catch(e){}
if(g>1)pf.turnToPage(g-1);
marcar();
let rt,w0=innerWidth,h0=innerHeight;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(Math.abs(innerWidth-w0)>60||Math.abs(innerHeight-h0)>160)location.reload()},500)});
</script>
</body>
</html>
