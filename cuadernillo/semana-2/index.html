.phero{min-height:21.7321rem;display:flex;align-items:flex-end}
.hero{min-height:17.4802rem;display:flex;align-items:flex-end;break-inside:avoid}
.hero-in{padding:2.126rem 2.126rem 1.8898rem;max-width:80%}
.mv{display:inline-block;background:var(--m1);color:#0B1118;font:800 0.7083rem var(--f-ui);letter-spacing:.12em;text-transform:uppercase;padding:0.25rem 0.6875rem;border-radius:6.1875rem}
[data-theme=papel] .mv{color:#fff}
.pk{font:700 0.8333rem var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:#DEC06A;margin-top:0.75rem}
.phero h1,.hero h1{font:400 3.6667rem/0.95 var(--f-disp);letter-spacing:.03em;margin:0.5rem 0 0.5rem;color:#fff;text-wrap:balance}
.hero .meta,.phero .meta{font:500 0.875rem var(--f-ui);color:#B9C3C9}.hero .meta em{font-style:italic;color:#DEC06A}
.nombre{display:flex;align-items:flex-end;gap:0.625rem;margin:1.8898rem 0 1.4173rem}.nombre span{font:700 0.8333rem var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-l)}
.nombre i{flex:1;border-bottom:1.5px solid var(--rule);height:1.4em}

/* día: escenas de hoy */
.dia{break-before:page}
.ttl3{font:400 1.5833rem/1 var(--f-disp);letter-spacing:.04em;color:var(--text);margin:1.6535rem 0 0.8268rem}
.escenas{display:grid;grid-template-columns:repeat(3,1fr);gap:0.7087rem;break-inside:avoid}
.sc{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:1rem;padding:0.8268rem 0.9449rem;min-height:4.7244rem}
.sc .n{display:block;font:700 0.75rem var(--f-ui);color:var(--muted)}
.sc .nm{display:block;font:700 0.9167rem/1.25 var(--f-ui);color:var(--text);margin-top:0.7087rem;padding-right:1.8898rem}
.sc .ck,.ckb{display:inline-block;width:1.1811rem;height:1.1811rem;border:1.5px solid var(--gold);border-radius:0.375rem}
.sc .ck{position:absolute;right:0.9449rem;top:0.8268rem}
.como{font-size:0.8333rem;color:var(--muted);margin:0.7087rem 0 0}

/* escenas = .blk de la app */
.blk{margin:1.4173rem 0 0;border-radius:1.375rem;border:1px solid var(--border);background:var(--surface)}
.blk>.hd{display:flex;align-items:center;gap:0.75rem;padding:0.9449rem 1.1811rem;border-bottom:1px solid var(--border);break-after:avoid;break-inside:avoid}
.blk>.hd .ic{flex:none;width:2.375rem;height:2.375rem;border-radius:0.6875rem;display:flex;align-items:center;justify-content:center;background:rgba(200,168,75,.12);border:1px solid var(--border);color:var(--gold-l)}
.blk>.hd .k{font:700 0.75rem var(--f-ui);letter-spacing:.12em;color:var(--gold)}
.blk>.hd .h{font:400 1.5833rem/1.05 var(--f-disp);letter-spacing:.03em;color:var(--text);margin-top:2px}
.blk>.bd{padding:1.063rem 1.1811rem 0.4724rem}
.read{background:var(--read-bg);border-radius:0.875rem;padding:1.063rem 1.1811rem 0.4724rem}
.blk>.ft{display:flex;align-items:center;gap:0.5625rem;justify-content:flex-end;padding:0.7087rem 1.1811rem 0.9449rem;font:700 0.875rem var(--f-ui);color:var(--gold-l);break-before:avoid}
.read h4{font:700 0.875rem var(--f-ui);letter-spacing:.03em;color:var(--dawn);margin:1.2em 0 .45em;break-after:avoid}
.read h4:first-child{margin-top:.2em}
.read ul{margin:0 0 .8em;padding-left:1.2em}.read li{margin:0 0 .35em}
.read .q{padding:.5em 1em;border-left:0.1875rem solid var(--gold);background:var(--field-bg);border-radius:0 0.625rem 0.625rem 0;font-style:italic}
.read .pray{padding:.9em 1.1em;border:1px solid var(--dawn);border-radius:0.875rem;background:rgba(240,168,120,.07);font-style:italic;break-inside:avoid}
.read .ejemplo{border:1px dashed var(--border2);border-radius:0.75rem;padding:0.7087rem 0.9449rem 0.2362rem;margin:0 0 1em;break-inside:avoid;font-size:0.9583rem}
.read .ejemplo .et{font:700 0.7917rem var(--f-ui);letter-spacing:.06em;color:var(--dawn);margin-bottom:0.4724rem}
.priv{display:flex;gap:0.5rem;align-items:flex-start;font-size:0.7917rem;line-height:1.5;color:var(--muted);margin:0.7087rem 0 0.4724rem}.priv svg{flex:none;color:#6DC48A;margin-top:1px}
[data-theme=papel] .priv svg{color:#22633B}
.cnota{font-size:0.875rem;font-style:italic;color:var(--ice);border-left:0.1875rem solid var(--ice);padding-left:0.625rem}

/* puente S.T.A.R.S. / Bookclub (.bridge de la app) */
.bridge{border:1px solid var(--border2);border-left:0.25rem solid var(--gold);border-radius:0.875rem;padding:0.8268rem 1.063rem;margin:0.7087rem 0 0.7087rem;background:var(--surface);break-inside:avoid;break-after:avoid}
.br-top{display:flex;align-items:center;gap:0.625rem;margin-bottom:0.4724rem}
.br-tool{display:inline-flex;align-items:center;gap:0.375rem;background:rgba(200,168,75,.16);color:var(--gold-l);font:700 0.7917rem var(--f-ui);padding:0.1875rem 0.625rem;border-radius:6.1875rem}
.br-kind{font-size:0.8333rem;color:var(--muted)}
.br-ref{font:700 1.0833rem var(--f-ui);color:var(--text);margin:0.2362rem 0}
.br-note{font-size:0.7917rem;color:var(--muted);margin:0.3543rem 0 0}
.texto{background:var(--card);border:1px solid var(--border);border-radius:0.875rem;padding:0.9449rem 1.1811rem 0.4724rem;margin:0 0 0.9449rem}
.tx-h{display:flex;align-items:center;gap:0.5rem;font:400 1.3333rem/1.1 var(--f-disp);letter-spacing:.04em;color:var(--text);margin:0.4724rem 0 0.5905rem;break-after:avoid}
.tx-h.msg{border-top:1px solid var(--border2);padding-top:0.9449rem;margin-top:0.9449rem}
.pill{font:800 0.6667rem var(--f-ui);letter-spacing:.1em;background:var(--gold);color:var(--ink-on-gold);padding:2px 0.5rem;border-radius:6.1875rem}
.biblia .sub{font:italic 600 0.8333rem var(--f-ui);color:var(--muted);margin:0.4724rem 0 0.2362rem;break-after:avoid}
.biblia .v{margin:0 0 .35em}
.biblia .v sup{font:700 0.6667rem var(--f-ui);color:var(--gold-l);margin-right:0.25rem}
.biblia .v.foco{background:var(--foco);border-left:0.1875rem solid var(--gold);padding:1px 0 1px 0.5rem;margin-left:-11px}
.msgref{font:700 0.75rem var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-l);margin:0.4724rem 0 0.2362rem}
.msgt{font-style:italic}
.texto .nota{font-size:0.7083rem;color:var(--faint);margin:0.4724rem 0 0.4724rem}
.resumen .lt{font:400 1.5833rem/1.05 var(--f-disp);letter-spacing:.04em;color:var(--text);margin:0.4724rem 0 0.2362rem;break-after:avoid}
.resumen .lh{font:700 0.875rem var(--f-ui);color:var(--dawn);margin:0.2362rem 0 0.7087rem;break-after:avoid}
.resumen .lsub{color:var(--muted)}
.resumen .ll{font:700 0.75rem var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-l);margin:0.9449rem 0 0.3543rem;break-after:avoid}
.resumen .ld{background:var(--field-bg);border-left:0.1875rem solid var(--gold);border-radius:0 0.625rem 0.625rem 0;padding:.5em .9em}
.resumen .lb{padding-left:1em;text-indent:-1em;margin-bottom:.4em}
.vid{display:flex;gap:1.1811rem;align-items:center;border:1px solid var(--border2);border-radius:0.875rem;padding:0.9449rem;background:var(--surface);margin:0.4724rem 0 0.9449rem;break-inside:avoid}
.vid .qr svg{width:7.559rem;height:7.559rem;display:block;background:#fff;border-radius:0.625rem;padding:0.4724rem}
.vid .url{font-size:0.8333rem;color:var(--ice);margin:0}

/* Bitácora: .field de la app, con renglones en lugar del cuadro de texto */
.field{background:var(--card);border:1px solid var(--border2);border-radius:0.875rem;padding:0.9449rem 1.063rem 0.8268rem;margin:0.7087rem 0 1.063rem;break-inside:avoid}
.field .t{font:800 0.8333rem var(--f-ui);letter-spacing:.06em;color:var(--gold-l);margin-bottom:0.3543rem}
.field .pr{font-style:italic;font-size:0.9583rem;margin:0 0 0.4724rem}
.field .ta{border:1px solid var(--border2);background:var(--field-bg);border-radius:0.625rem;padding:0 0.9449rem 0.4724rem}
.field .ta i{display:block;height:2.4803rem;border-bottom:1px solid var(--rule)}
.blank{display:inline-block;min-width:5.1968rem;border-bottom:1.2px solid var(--text);height:1em;vertical-align:baseline}
/* v3 del cuaderno: sin tarjetas largas que se partan entre páginas.
   La cabecera de cada escena es la tarjeta; el texto corre sobre el papel; las cajas largas se cierran en cada página. */
.blk{background:none;border:0;border-radius:0;margin:1.8898rem 0 0}
.blk>.hd{background:var(--surface);border:1px solid var(--border);border-radius:1.125rem;margin:0 0 0.9449rem}
.blk>.bd{padding:0 0.2362rem}
.read{background:none;border-radius:0;padding:0}
.blk>.ft{padding:0.4724rem 0.2362rem 0;border-top:1px dashed var(--border2);margin-top:0.4724rem}
.texto,.bridge,.field,.vid,.ejemplo,.pray{-webkit-box-decoration-break:clone;box-decoration-break:clone}
.escenas .sc{background:var(--surface)}
.field.choice{padding:0.7087rem 1.063rem}.field.choice .opt{display:flex;align-items:center;gap:0.625rem;padding:0.3543rem 0;font-weight:600}
.read hr.sep{border:0;border-top:1.5px solid var(--border2);margin:0.9449rem 0}.read p{overflow-wrap:break-word}
/* Edición para pantalla (flipbook): páginas tamaño celular, letra grande */





.pbar{margin:0 0 0.9449rem}.wm{font-size:1.8333rem}.logo{width:2.125rem;height:1.625rem}
.phero{min-height:16.5353rem}.hero{min-height:13.7007rem}.hero-in{padding:1.4173rem 1.1811rem 1.1811rem;max-width:100%}

<div class="phero"><div class="hero-in"><span class="mv">Reentrenar · Semana 2</span><div class="pk">Protocolo Metanoia</div><h1>Cuaderno de la semana</h1>

<section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg></span><div><div class="k">Antes de empezar</div><div class="h">Cómo usar este cuaderno</div></div></div>
<div class="bd"><div class="read">
<p>Este cuaderno tiene las mismas cinco jornadas que la app, palabra por palabra. Hay una jornada para cada día, de lunes a viernes.</p>
<p>Cuando la jornada te pida abrir S.T.A.R.S. o BOOKCLUB, no tienes que abrir nada: los pasajes de la Biblia y el resumen del libro están impresos ahí mismo.</p>
<p>Donde la app tiene tu Bitácora, escribe en tu cuaderno: anota el día y el título de cada campo, y debajo tu respuesta. Escribe con calma y sin miedo a equivocarte.</p>

<p>Sábado y domingo no hay tarea nueva: son para ponerte al día si te atrasaste.</p>
<p class="priv"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/><path d="m9 12 2 2 4-4"/></svg>Lo que escribas aquí es privado. Este cuaderno es contenido privado del curso: no lo fotocopies ni lo compartas.</p>
</div></div></section></section><section class="dia"><div class="hero"><div class="hero-in"><span class="mv">Reentrenar · Semana 2</span><h1>LA VERDAD QUE APRENDO A PRACTICAR</h1><div class="meta">Día 6 de 20 · Lunes · <em>Filipenses 4:4–9</em></div></div></div><h2 class="ttl3">Las escenas de hoy</h2><div class="escenas"><div class="sc"><span class="n">01</span><span class="nm">Apertura</span><span class="ck"></span></div><div class="sc"><span class="n">02</span><span class="nm">Video de la semana</span><span class="ck"></span></div><div class="sc"><span class="n">03</span><span class="nm">La Palabra · S.T.A.R.S.</span><span class="ck"></span></div><div class="sc"><span class="n">04</span><span class="nm">El libro · Bookclub</span><span class="ck"></span></div><div class="sc"><span class="n">05</span><span class="nm">Mi Bitácora</span><span class="ck"></span></div></div><p class="como">Marca cada escena cuando la termines. Se hacen en orden.</p><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg></span><div><div class="k">Apertura · Escena 1 de 5</div></div></div><div class="bd"><div class="read"><h4>Bienvenida</h4><p>Te cuento algo. Conseguí mi primer trabajo cuando estaba en octavo semestre de ingeniería civil. En la entrevista, el que iba a ser mi jefe me preguntó si sabía diseñar redes de acueducto y hacer presupuestos de obra. «Claro», le dije. «Obvio». Y salí de esa oficina pensando en el día siguiente, porque nunca había diseñado una red en la vida real. Sabía la teoría. No sabía el oficio. Ese lo fui aprendiendo después: yendo a obra, equivocándome, corrigiendo y volviendo a calcular.</p><p>Con la Verdad de Dios me pasa algo parecido, y sospecho que a ti también. La semana pasada elegiste un patrón, viste cómo influye en tus respuestas y lo pusiste frente a la Palabra. Ahora aparece otra pregunta: ¿qué pasa cuando ya entendiste una verdad, pero sigues reaccionando como antes?</p><p>Para eso es Reentrenar. Sigues con el mismo patrón, con la verdad que recogiste el viernes y con la primera respuesta que quieres aprender a practicar. Reemplazar fue cambiar quién tiene la última palabra. Reentrenar es volver a esa verdad una y otra vez, hasta que empiece a formar la manera en que respondes.</p><p>Empieza por el video. Después vas a S.T.A.R.S. y a BOOKCLUB, y vuelves aquí para dejar lista tu Bitácora. Los ejercicios arrancan mañana.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg></span><div><div class="k">Video de la semana · Escena 2 de 5</div><div class="h">EN THE WAY · VIDEO SEMANAL DE APERTURA</div></div></div><div class="bd"><div class="read"><h4>Video: «la verdad que aprendo a practicar»</h4><p>Mira el video de apertura de Reentrenar antes de seguir.</p><div class="vid"><div><div class="br-top"><span class="br-tool">Video disponible pronto</span></div><p>Todavía no está disponible. Puedes seguir con la lectura y volver a verlo más adelante.</p></div></div><p>Cuando termines, abre S.T.A.R.S.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/><path d="M12 7v6M9.5 9.5h5"/></svg></span><div><div class="k">La Palabra · S.T.A.R.S. · Escena 3 de 5</div><div class="h">DESDE THE WAY → S.T.A.R.S. · LA PALABRA</div></div></div><div class="bd"><div class="read"><h4>Lectura comparada — NBLA + The Message (MSG)</h4><p>Lee Filipenses 4:4–9 en la NBLA, desde S.T.A.R.S., con especial atención a los versículos 8 y 9. Después lee también en S.T.A.R.S. cómo lo dice The Message. Aquí no hay nada que escribir; lo de hoy va en tu Bitácora.</p><div class="bridge"><div class="br-top"><span class="br-tool"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/><path d="M12 7v6M9.5 9.5h5"/></svg>S.T.A.R.S.</span><span class="br-kind">Lectura de hoy</span></div><div class="br-ref">Filipenses 4:4–9</div><p class="br-note">En tu cuaderno la lectura va impresa aquí mismo. No necesitas abrir S.T.A.R.S.</p></div><div class="texto"><div class="tx-h"><span class="pill">NBLA</span>Filipenses 4:4–9 · con atención a los versículos 8 y 9</div><div class="biblia"><div class="sub">Regocijo y paz en el Señor</div><p class="v"><sup>4</sup>Regocíjense en el Señor siempre. Otra vez lo diré: ¡Regocíjense!</p><p class="v"><sup>5</sup>La bondad de ustedes sea conocida de todos los hombres. El Señor está cerca.</p><p class="v"><sup>6</sup>Por nada estén afanosos; antes bien, en todo, mediante oración y súplica con acción de gracias, sean dadas a conocer sus peticiones delante de Dios.</p><p class="v"><sup>7</sup>Y la paz de Dios, que sobrepasa todo entendimiento, guardará sus corazones y sus mentes en Cristo Jesús.</p><div class="sub">El secreto de la paz</div><p class="v foco"><sup>8</sup>Por lo demás, hermanos, todo lo que es verdadero, todo lo digno, todo lo justo, todo lo puro, todo lo amable, todo lo honorable, si hay alguna virtud o algo que merece elogio, en esto mediten.</p><p class="v foco"><sup>9</sup>Lo que también han aprendido y recibido y oído y visto en mí, esto practiquen, y el Dios de paz estará con ustedes.</p></div><div class="tx-h msg"><span class="pill">MSG</span>The Message · en lenguaje cotidiano</div><div class="msgref">Filipenses 4:4–5</div><p class="msgt">Celebren a Dios todo el día, todos los días. ¡Alégrense de verdad en Él! Que todas las personas con quienes se encuentren puedan ver con claridad que ustedes están de su lado, colaborando con ellas y no enfrentándolas. Ayúdenlas a reconocer que el Señor está cerca: su llegada puede ocurrir en cualquier momento.</p><div class="msgref">Filipenses 4:6–7</div><p class="msgt">No vivan consumidos por la preocupación. En vez de preocuparse, oren. Dejen que sus peticiones y sus alabanzas den forma de oración a sus inquietudes; háganle saber a Dios lo que les preocupa. Entonces la plenitud de Dios, que pone las cosas en su lugar, vendrá a serenarlos. Es maravilloso lo que sucede cuando Cristo ocupa el centro de la vida, en lugar de la preocupación.</p><div class="msgref">Filipenses 4:8–9</div><p class="msgt">En resumen, amigos: les irá mejor si llenan su mente y meditan en lo verdadero, noble, respetable, auténtico, admirable y lleno de gracia; en lo mejor y no lo peor, en lo hermoso y no lo feo, en aquello que merece alabanza y no maldición. Pongan en práctica lo que aprendieron de mí, lo que escucharon, vieron y comprendieron. Hagan esto, y Dios, que hace que todo encuentre su lugar, los incorporará a sus armonías más excelentes.</p><p class="nota">MSG: lectura complementaria en español, traducida para estudio desde el texto maestro inglés de The Message. No es una edición oficial en español. · Nueva Biblia de las Américas™, NBLA™ · Copyright © 2005 por The Lockman Foundation.</p></div><p>Pablo le escribe a una comunidad real, con un conflicto real: dos personas de la iglesia estaban enfrentadas. Lee el pasaje con eso en mente, como una carta a gente que tenía que aprender a convivir.</p><h4>S · Silencio</h4><p>Haz una pausa y pídele a Dios disposición para escuchar y obedecer, tal como llegas hoy.</p><h4>T · Texto</h4><p>Lee el pasaje completo y sigue el recorrido: alegrarse en el Señor, orar en lugar de vivir afanado, pensar en lo verdadero y practicar lo aprendido. Fíjate en lo que Pablo pide considerar y en lo que pide hacer.</p><h4>A · Análisis</h4><p>Pablo pone juntas tres cosas: la oración, la manera de pensar y la práctica. Dice «en esto mediten» y enseguida «esto practiquen». Lo que pide considerar es lo verdadero, lo justo y lo honorable, que a veces consuela y a veces confronta; por eso esto es pensamiento verdadero, que va más allá del pensamiento positivo. Y la paz que promete guarda el corazón y la mente en medio de las dificultades, sin prometer que desaparezcan.</p><h4>R · Reflexión</h4><p>Vuelve a la verdad que recogiste el viernes. ¿Qué diferencia hay entre conocerla y dejar que oriente una respuesta concreta? Evaluar si ya cambiaste puede esperar.</p><h4>S · Siembra</h4><p>Quédate con esta idea: voy a volver a propósito a lo que aprendí, para practicarlo. La vas a usar en tu Bitácora.</p><p>Ahora abre BOOKCLUB.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></span><div><div class="k">El libro · Bookclub · Escena 4 de 5</div><div class="h">DESDE THE WAY → BOOKCLUB · PRESENTACIÓN DEL BLOQUE</div></div></div><div class="bd"><div class="read"><p>Esta semana sigues con <em>Gana la guerra en tu mente</em>, de Craig Groeschel: capítulos 4, 5 y 6 del resumen en BOOKCLUB. Así va la semana:</p><ul><li>Martes: capítulo 4, «Cables cruzados y surcos circulares».</li><li>Miércoles: capítulo 5, «Crea una trinchera de la verdad».</li><li>Jueves: capítulo 6, «Rumiar y renovar».</li><li>Viernes: vuelves sobre los tres capítulos, sin lectura nueva.</li></ul><p>Hoy solo abre la introducción o el índice de este bloque para ver lo que viene. No hace falta adelantar el capítulo 4 ni hacer sus ejercicios; lo práctico está en tu Bitácora.</p><p>Si lees el libro completo, sigue los capítulos equivalentes de tu edición; te va a tomar un poco más de tiempo.</p><p>La pregunta que te acompaña esta semana: «¿Qué diferencia hay entre repetir una frase y aprender a responder desde una Verdad comprendida?».</p><p>Vuelve a THE WAY.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></span><div><div class="k">Mi Bitácora · Escena 5 de 5</div><div class="h">DE REGRESO EN THE WAY · PREPARA TU BITÁCORA</div></div></div><div class="bd"><div class="read"><p>Hoy no hay ficha nueva. Abre tu Ficha Inicial y el cierre de la Semana 1, «Mi patrón y la Verdad», solo para leerlos.</p><p class="cnota">En este cuaderno, tu Ficha Inicial está en lo que escribiste el Día 1, y «Mi patrón y la Verdad», en lo que escribiste el Día 5.</p><p>Revisa que ahí estén estas tres cosas:</p><ul><li>El patrón o la creencia que decidiste trabajar.</li><li>La verdad bíblica que examinaste en su contexto.</li><li>La respuesta concreta que quieres empezar a practicar.</li></ul><p>Si falta alguna, complétala en la nota donde corresponde, no aquí. Y si no recuerdas un episodio nuevo, no lo inventes.</p><p>Mañana empiezas «Mi plan de práctica». Ahí vas a añadir solo dos cosas nuevas: una señal temprana y una pausa posible.</p><h4>Cierre</h4><p>El oficio de ingeniero lo aprendí en la obra, no en el salón de clase. Esta semana la obra es tu vida diaria: no empiezas de cero, vas a practicar lo que ya entendiste. Deja lista tu Bitácora para el martes. El sábado y el domingo quedan para ponerte al día, sin tarea nueva.</p><p class="priv"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/><path d="m9 12 2 2 4-4"/></svg>Tus respuestas son privadas y no tienes obligación de compartirlas.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section></section><section class="dia"><div class="hero"><div class="hero-in"><span class="mv">Reentrenar · Semana 2</span><h1>EL CAMINO QUE SUELES TOMAR</h1><div class="meta">Día 7 de 20 · Martes · <em>Josué 1:7–9</em></div></div></div><h2 class="ttl3">Las escenas de hoy</h2><div class="escenas"><div class="sc"><span class="n">01</span><span class="nm">Apertura</span><span class="ck"></span></div><div class="sc"><span class="n">02</span><span class="nm">La Palabra · S.T.A.R.S.</span><span class="ck"></span></div><div class="sc"><span class="n">03</span><span class="nm">El libro · Bookclub</span><span class="ck"></span></div><div class="sc"><span class="n">04</span><span class="nm">La lección · The Way</span><span class="ck"></span></div><div class="sc"><span class="n">05</span><span class="nm">Mi Bitácora</span><span class="ck"></span></div><div class="sc"><span class="n">06</span><span class="nm">Cierre</span><span class="ck"></span></div></div><p class="como">Marca cada escena cuando la termines. Se hacen en orden.</p><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg></span><div><div class="k">Apertura · Escena 1 de 6</div></div></div><div class="bd"><div class="read"><h4>Bienvenida</h4><p>Ayer volviste a lo que ya tenías: tu patrón, la verdad que examinaste y la respuesta que quieres practicar. Hoy empieza el trabajo de Reentrenar.</p><p>Seguro te ha pasado: entiendes que una manera de reaccionar tiene que cambiar y, cuando llega la presión, respondes igual que siempre. Saber algo y vivir desde ahí son dos cosas distintas.</p><p>Por eso hoy no vas a buscar otra creencia ni otro problema. Vas a reconocer el camino que sueles tomar frente a tu mismo patrón, y el momento exacto en que empiezas a tomarlo. Mañana, con eso, preparas una respuesta concreta.</p><p>Empieza por S.T.A.R.S.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/><path d="M12 7v6M9.5 9.5h5"/></svg></span><div><div class="k">La Palabra · S.T.A.R.S. · Escena 2 de 6</div><div class="h">DESDE THE WAY → S.T.A.R.S. — LA PALABRA</div></div></div><div class="bd"><div class="read"><h4>Lectura comparada — NBLA + The Message (MSG)</h4><p>Lee Josué 1:7–9 en la NBLA, desde S.T.A.R.S., con atención especial al versículo 8. Después lee también en S.T.A.R.S. cómo lo dice The Message. Aquí no hay nada que escribir; lo de hoy va en tu Bitácora.</p><div class="bridge"><div class="br-top"><span class="br-tool"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/><path d="M12 7v6M9.5 9.5h5"/></svg>S.T.A.R.S.</span><span class="br-kind">Lectura de hoy</span></div><div class="br-ref">Josué 1:7–9</div><p class="br-note">En tu cuaderno la lectura va impresa aquí mismo. No necesitas abrir S.T.A.R.S.</p></div><div class="texto"><div class="tx-h"><span class="pill">NBLA</span>Josué 1:7–9 · con atención al versículo 8</div><div class="biblia"><div class="sub">Comisión de Dios a Josué</div><p class="v"><sup>7</sup>Solamente sé fuerte y muy valiente. Cuídate de cumplir toda la ley que Moisés Mi siervo te mandó. No te desvíes de ella ni a la derecha ni a la izquierda, para que tengas éxito dondequiera que vayas.</p><p class="v foco"><sup>8</sup>»Este libro de la ley no se apartará de tu boca, sino que meditarás en él día y noche, para que cuides de hacer todo lo que en él está escrito. Porque entonces harás prosperar tu camino y tendrás éxito.</p><p class="v"><sup>9</sup>¿No te lo he ordenado Yo? ¡Sé fuerte y valiente! No temas ni te acobardes, porque el SEÑOR tu Dios estará contigo dondequiera que vayas».</p></div><div class="tx-h msg"><span class="pill">MSG</span>The Message · en lenguaje cotidiano</div><div class="msgref">Josué 1:7–9</div><p class="msgt">Entrégate por completo, con corazón y alma. Asegúrate de cumplir toda la instrucción que Moisés te transmitió, sin desviarte ni a la derecha ni a la izquierda, para llegar adonde debes ir. No permitas ni por un instante que este Libro de la Instrucción se aparte de tu mente. Medita en él de día y de noche, y pon en práctica todo lo que allí está escrito. Así llegarás a donde debes ir y tendrás éxito. ¿No te lo he ordenado? ¡Fuerza! ¡Valor! No seas tímido ni te desanimes, porque el Señor tu Dios estará contigo en cada paso que des.</p><p class="nota">MSG: lectura complementaria en español, traducida para estudio desde el texto maestro inglés de The Message. No es una edición oficial en español. · Nueva Biblia de las Américas™, NBLA™ · Copyright © 2005 por The Lockman Foundation.</p></div><h4>S · Silencio</h4><p>Antes de leer, haz una pausa. Puedes orar con estas palabras: «Señor, enséñame a recibir tu Palabra con atención. No quiero limitarme a comprender una idea; quiero aprender a vivir delante de Ti con fidelidad».</p><h4>T · Texto</h4><p>Lee Josué 1:7–9 despacio. Fíjate a quién le habla Dios y en qué momento de su historia. Mira cómo se conectan la Palabra recibida, la meditación, la obediencia y el valor para seguir adelante.</p><h4>A · Análisis</h4><p>Dios le habla a Josué cuando le toca asumir la conducción de Israel después de Moisés. Meditar en el libro de la Ley era, para él, conocer la instrucción recibida y guiar al pueblo con fidelidad a ella. La promesa de prosperar estaba ligada a esa misión; leerla como garantía de éxito para cualquier proyecto sería sacarla de su lugar.</p><p>Lo que sí podemos aprender de aquí es un principio: la Palabra es una instrucción a la que se vuelve una y otra vez para caminar en obediencia, más que información que se lee una vez.</p><h4>R · Reflexión</h4><p>Recuerda la verdad que recogiste al terminar la Semana 1. ¿Suele estar presente cuando aparece tu patrón, o te acuerdas de ella cuando ya reaccionaste como siempre? Solo obsérvalo, sin juzgarte.</p><h4>S · Siembra</h4><p>Quédate con esta idea: volver a la Palabra me ayuda a prestar atención y a actuar según lo aprendido. La vas a usar en tu Bitácora.</p><p>Ahora vas a ver en el libro por qué ciertas respuestas se vuelven tan familiares que casi no las notamos. Abre BOOKCLUB.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></span><div><div class="k">El libro · Bookclub · Escena 3 de 6</div><div class="h">DESDE THE WAY → BOOKCLUB — EL LIBRO QUE ACOMPAÑA</div></div></div><div class="bd"><div class="read"><p>Lee el capítulo 4 del resumen de <em>Gana la guerra en tu mente</em>, de Craig Groeschel: «Cables cruzados y surcos circulares». Si lees el libro completo, busca el capítulo correspondiente de tu edición; te va a tomar un poco más de tiempo.</p><div class="bridge"><div class="br-top"><span class="br-tool"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Bookclub</span><span class="br-kind">Lectura que acompaña</span></div><div class="br-ref"><em>Gana la guerra en tu mente</em> · Capítulo 4 · Cables cruzados y surcos circulares</div><p class="br-note">El resumen va impreso aquí mismo. No necesitas abrir Bookclub.</p></div><div class="texto resumen"><div class="lt">Capítulo 4 — Cables cruzados y surcos circulares</div><p class="lsub"><em>Lo que repites termina construyendo el camino por el que tu mente aprende a viajar</em></p><div class="ll">1. IDEA CENTRAL</div><p class="ld"><strong>Los pensamientos repetidos crean caminos mentales que vuelven ciertas respuestas cada vez más automáticas; por eso, para cambiar tu vida debes reconocer primero los surcos por los que tu mente ya sabe desplazarse.</strong></p><div class="ll">2. PROSA EN VOZ DEL AUTOR</div><p>Una vez instalé mal el estéreo de mi automóvil y terminé conectándolo a los faros. El resultado era absurdo: durante el día parecía averiado, pero en la noche funcionaba perfectamente porque solo recibía energía cuando encendía las luces. El estéreo no era el verdadero problema. <strong>Los cables estaban cruzados.</strong> Algo parecido ocurre dentro de nosotros. Sabemos que preocuparnos no ayuda, pero seguimos preocupándonos. Decidimos no discutir y volvemos a discutir. Queremos ahorrar y compramos impulsivamente. Prometemos prestar atención a nuestra familia y terminamos mirando el teléfono. A veces no estamos fallando por ignorancia; estamos funcionando desde conexiones internas que ya aprendieron una respuesta determinada.</p><p>Piensa en un camino de tierra en el que los vehículos pasan una y otra vez por el mismo lugar. Poco a poco aparece un surco. Al principio puedes salir fácilmente; después, cuando se hace profundo, las ruedas mismas quieren seguirlo. Eso es lo que uso como imagen para explicar las vías neuronales: la repetición facilita que determinados pensamientos y respuestas vuelvan a aparecer. En el lenguaje del libro, cuanto más recorres un pensamiento, más familiar se vuelve ese camino.</p><p>Nuestro cerebro hace esto por una buena razón. Aprender a conducir, tocar un instrumento o realizar una tarea nueva resulta difícil al principio y después se vuelve mucho más natural. El problema es que esa misma capacidad también puede fortalecer respuestas dañinas. Si cada vez que siento rechazo concluyo que no valgo, cada vez que me siento triste busco comida, cada vez que estoy inseguro gasto dinero o cada vez que aparece incertidumbre intento controlarlo todo, estoy recorriendo el mismo camino otra vez. Con suficiente repetición, aquello que empezó como una respuesta ocasional empieza a parecer mi forma natural de funcionar.</p><p>Además, tendemos a interpretar nueva información desde creencias ya establecidas. Si estoy convencido de que soy una víctima, prestaré especial atención a aquello que parece demostrarlo. Si creo que nunca tengo suficiente, cada señal económica puede convertirse en otra prueba de escasez. Así funcionó durante años mi temor con el dinero. Una conversación con mi abuela sobre la Gran Depresión plantó en mí la expectativa de que algún día todo podía derrumbarse. Crecí, mejoré financieramente e incluso eliminé deudas, pero mi mente seguía reaccionando como si la catástrofe estuviera a punto de llegar.</p><p>Lo más doloroso fue descubrir que ese surco ya no me afectaba únicamente a mí. Mi manera temerosa de relacionarme con el dinero estaba alcanzando a mi familia. Ahí entendí que no bastaba decir: “Sé que Dios provee”. Intelectualmente ya lo sabía. Necesitaba reconocer el camino que mi mente recorría automáticamente y permitir que Dios construyera otro. El ejercicio de este capítulo no exige que siempre descubras dónde comenzó cada patrón; sí exige que tengas el valor de <strong>identificar los surcos nocivos que hoy existen</strong>.</p><div class="ll">3. BULLETS DE IMPACTO</div><p class="lb">• Un patrón repetido puede llegar a sentirse natural sin ser saludable.</p><p class="lb">• La repetición reduce la resistencia: aquello que antes requería una decisión puede convertirse en respuesta automática.</p><p class="lb">• Algunas creencias funcionan como filtros: prestamos más atención a la evidencia que confirma lo que ya pensamos.</p><p class="lb">• Un surco mental puede sobrevivir mucho después de que desaparecieron las circunstancias que lo originaron.</p><p class="lb">• Nuestros patrones no terminan necesariamente en nosotros; pueden afectar la forma de pensar de quienes viven cerca.</p><div class="ll">4. DATO CLAVE O SEÑAL DE ALERTA</div><p class="ld"><strong>Que una reacción sea automática no significa que sea inevitable; puede ser un camino mental que llevas años reforzando.</strong></p><div class="ll">5. REFLEXIÓN</div><p class="ld"><strong>¿Qué respuesta en tu vida llamas “así soy yo” cuando quizá deberías llamarla “así aprendí a reaccionar”?</strong></p><div class="ll">6. PRÁCTICA</div><p>Identifica hoy <strong>un solo surco</strong> y escríbelo como una secuencia:</p><p class="ld"><strong>Detonante → pensamiento automático → emoción → conducta → resultado.</strong></p><p>Ejemplo:<strong>Incertidumbre económica → “no habrá suficiente” → miedo → control excesivo → tensión familiar.</strong></p><p>No intentes corregirlo todavía. Primero míralo con claridad.</p></div><p>Groeschel usa la imagen de conexiones cruzadas y de caminos que, de tanto recorrerlos, se vuelven surcos, para explicar por qué ciertas respuestas llegan a parecernos naturales. Es una buena imagen para reconocer hábitos; tómala como ilustración y no como una medición de lo que pasa en tu cerebro.</p><p>Lee con esta pregunta en mente: «¿Cuál es el recorrido que suelo repetir cuando se activa el patrón que elegí?».</p><p>Los ejercicios del capítulo son opcionales; tu práctica de hoy está en la Bitácora.</p><p>Vuelve a THE WAY.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20 12 4l9 16z"/><path d="m8 20 4-7 4 7"/></svg></span><div><div class="k">La lección · The Way · Escena 4 de 6</div><div class="h">EN THE WAY — ENSEÑANZA DEL DÍA</div></div></div><div class="bd"><div class="read"><h4>El camino que sueles tomar</h4><p>Quizá la semana pasada decidiste: «La próxima vez que me corrijan, voy a escuchar con calma». Pero llegó otra observación y volviste a defenderte o a quedarte callado. Y enseguida apareció otra conclusión: «No he cambiado nada».</p><p>Detengámonos ahí. Entender una verdad y aprender a responder desde ella casi nunca llegan al mismo tiempo. Reemplazar te ayudó a examinar una interpretación. Reentrenar empieza por mirar la respuesta de siempre y preparar una pausa que te dé espacio para actuar distinto.</p><p>Te pongo un ejemplo que no tiene nada de espiritual. ¿A qué hora te bañas? La mayoría lo hacemos por la mañana, y si te pregunto por qué, me dirás que por aseo, para despertarte o por costumbre. Pero piénsalo: si solo pudieras bañarte una vez al día, tendría más sentido hacerlo en la noche. Llegas del trabajo después de sudar todo el día y te metes así a la cama, donde pasas seis u ocho horas. Por eso al día siguiente las cobijas huelen a lo que huelen. No digo que bañarse por la mañana esté mal. Lo que me impresiona es la facilidad con que convertimos una costumbre en una verdad que nunca cuestionamos.</p><p>Si eso pasa con algo tan simple, imagínate con nuestras reacciones. «Yo siempre he sido así» puede ser la forma más cómoda de proteger lo que nunca hemos querido examinar. A las personas que llegan a La HS con muchos años de iglesia siempre les digo lo mismo: su reto más grande es desaprender, más que aprender. Y me incluyo. ¿Cómo llenas un vaso que no has vaciado?</p><p>Vuelve al ejemplo de la propuesta. Alguien recibe dos correcciones, piensa «Soy incompetente» y se retira de la conversación. Puede que ya haya entendido que un error no define todo su valor, pero al escuchar «necesitamos hacer ajustes» se tensa otra vez y deja de participar. ¿Qué apareció primero? Una frase por dentro, las ganas de justificarse, de salir corriendo o de controlar la situación. Eso es lo que hoy vas a buscar en tu caso: <strong>una señal temprana</strong> de ese camino conocido.</p><p>Groeschel lo describe como un surco: mientras más lo recorres, más fácil es repetirlo. Ojo con dos extremos. Uno es resignarse: «Así soy; nunca voy a responder distinto». El otro es condenarse por cada pensamiento o sensación. Sentir miedo no te obliga a obedecerlo, y sentir tensión no es una derrota espiritual. Lo que importa es lo que haces después.</p><p>En Josué 1, Dios llama a Josué a mantener presente su instrucción y a actuar conforme a ella. Esa promesa tenía un momento y una misión concretos, y no se traslada como garantía de éxito a nuestros proyectos. Lo que sí nos deja es la relación entre meditar en la Palabra y practicar lo aprendido.</p><p>Y esto no se logra a pura fuerza de voluntad ni repitiendo frases. Dependemos de Dios, de su Palabra y de la dirección del Espíritu Santo, mientras respondemos con obediencia concreta.</p><p>La pausa que vas a preparar es sencilla: quedarte callado un momento antes de contestar, preguntar qué te quisieron decir o recordar un pasaje en su contexto. Sirve para reconocer la curva donde normalmente reaccionas y abrir un espacio para elegir una respuesta más responsable.</p><p>Basta con una señal y con el mismo patrón de tu Ficha Inicial; escoge una que puedas observar con tranquilidad. Si todavía no ha habido una ocasión real, puedes preparar la pausa como ensayo, sin presentarla como algo que ya practicaste.</p><p>Mañana concretas la respuesta nueva. Hoy pregúntate: ¿en qué momento podría detenerme para recordar lo que aprendí de Jesús, antes de tomar el camino de siempre?</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></span><div><div class="k">Mi Bitácora · Escena 5 de 6</div><div class="h">MI BITÁCORA — UNA SOLA PRÁCTICA INTEGRADA</div></div></div><div class="bd"><div class="read"><h4>Práctica: «reconozco la curva»</h4><p>Abre en THE WAY tu Mapa Personal de Renovación y vuelve a leer «Mi patrón y la Verdad», la ficha con la que cerraste la Semana 1. Lo que escribiste ahí se queda como está.</p><p>Hoy añades dos datos nuevos a la ficha de la Semana 2:</p><h4>A · Mi señal temprana</h4><p>«Cuando ocurre <span class="blank"></span>, normalmente noto que estoy a punto de responder como antes porque <span class="blank"></span>».</p><p>Puede ser una frase que te dices, un impulso o una reacción de siempre. Describe lo que observas, sin atribuirte intenciones que no conoces y sin tomar una emoción como prueba de una creencia falsa.</p><div class="field"><div class="t">A · Mi señal temprana</div><div class="encuaderno"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>Escribe tu respuesta en tu cuaderno.</div></div><h4>B · Mi pausa de regreso</h4><p>«Cuando note esa señal, voy a detenerme brevemente para recordar <span class="blank"></span>».</p><p>Complétala con la verdad bíblica que ya entendiste en la Semana 1, sin buscar otro versículo ni inventar una declaración que el texto no sostiene. Si necesitas estudiar más para formularla, escríbelo así.</p><div class="field"><div class="t">B · Mi pausa de regreso</div><div class="encuaderno"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>Escribe tu respuesta en tu cuaderno.</div></div><div class="ejemplo"><div class="et">Ejemplo ilustrativo</div><p>Ya registrado en Semana 1:</p><p>- Patrón: ante una corrección concluyo que no soy capaz.</p><p>- Hecho que examiné: me pidieron ajustar dos aspectos de una propuesta.</p><p>- Verdad y respuesta inicial: aprender de Jesús implica honestidad sobre lo que debo corregir, sin convertir un error particular en una condena general sobre mi valor; quiero escuchar y participar responsablemente.</p><p>Lo que agrego hoy:</p><p>- Mi señal temprana: «Cuando escucho que mi trabajo requiere cambios, aparece la frase “otra vez fallé” y siento el impulso de callarme».</p><p>- Mi pausa de regreso: «Antes de retirarme de la conversación, voy a detenerme y recordar que puedo reconocer una corrección real sin convertirla en un juicio absoluto sobre toda mi capacidad».</p><p>Esto es una aplicación personal: no es una cita de Josué 1 ni una promesa bíblica de éxito laboral.</p></div><h4>Si hoy no aparece el patrón</h4><p>Puedes identificar la señal a partir de una situación anterior que recuerdes con claridad. No inventes un episodio ni escribas que ya cambiaste. Si todavía no la tienes clara, escribe «aún no identifico mi señal temprana» y sigue observando con calma. Esto no es un examen.</p><h4>Lo que queda guardado hoy</h4><p>Dos notas breves: tu señal temprana y tu pausa de regreso. Tu patrón y tu Ficha Inicial siguen igual; el plan de acción llega mañana.</p><p class="priv"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/><path d="m9 12 2 2 4-4"/></svg>Tus respuestas son privadas y no tienes obligación de compartirlas.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg></span><div><div class="k">Cierre · Escena 6 de 6</div><div class="h">CIERRE Y ORACIÓN</div></div></div><div class="bd"><div class="read"><p>Hoy diste un paso importante: además de querer responder distinto, ya sabes reconocer el momento en que estás a punto de volver al camino conocido.</p><p>Mañana vas a usar esa señal y la verdad que ya trabajaste para preparar una acción concreta, responsable y posible.</p><h4>Ora si lo deseas:</h4><p class="pray">«Señor Jesús, gracias porque no tengo que esconder mis respuestas habituales delante de Ti. Ayúdame a volver a tu Palabra, a reconocer con humildad lo que necesito aprender y a depender de tu Espíritu en mis decisiones. Dame claridad para detenerme cuando deba hacerlo y fidelidad para obedecerte en lo cotidiano. Amén».</p><p>Jornada completada. Mañana sigues con el mismo patrón.</p><hr class="sep"></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section></section><section class="dia"><div class="hero"><div class="hero-in"><span class="mv">Reentrenar · Semana 2</span><h1>NO BASTA CON DETENERTE: ¿QUÉ HARÁS DIFERENTE?</h1><div class="meta">Día 8 de 20 · Miércoles · <em>Santiago 1:21–25</em></div></div></div><h2 class="ttl3">Las escenas de hoy</h2><div class="escenas"><div class="sc"><span class="n">01</span><span class="nm">Apertura</span><span class="ck"></span></div><div class="sc"><span class="n">02</span><span class="nm">La Palabra · S.T.A.R.S.</span><span class="ck"></span></div><div class="sc"><span class="n">03</span><span class="nm">El libro · Bookclub</span><span class="ck"></span></div><div class="sc"><span class="n">04</span><span class="nm">La lección · The Way</span><span class="ck"></span></div><div class="sc"><span class="n">05</span><span class="nm">Mi Bitácora</span><span class="ck"></span></div><div class="sc"><span class="n">06</span><span class="nm">Cierre</span><span class="ck"></span></div></div><p class="como">Marca cada escena cuando la termines. Se hacen en orden.</p><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg></span><div><div class="k">Apertura · Escena 1 de 6</div></div></div><div class="bd"><div class="read"><h4>Bienvenida</h4><p>Ayer reconociste la señal que suele anunciar tu respuesta de siempre, y preparaste una pausa para recordar la verdad cuando aparezca.</p><p>Hoy das un paso más. La pausa ayuda, pero por sí sola no cambia lo que haces. Después de detenerte llega la pregunta de fondo: «¿Y ahora cómo voy a responder?».</p><p>Sigues con el mismo patrón y con lo que ya escribiste. Vas a tomar lo que descubriste y convertirlo en una acción pequeña, responsable y posible.</p><p>La meta es prepararte para obedecer lo aprendido en una situación concreta. Nadie espera que reacciones perfecto.</p><p>Empieza por S.T.A.R.S.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/><path d="M12 7v6M9.5 9.5h5"/></svg></span><div><div class="k">La Palabra · S.T.A.R.S. · Escena 2 de 6</div><div class="h">DESDE THE WAY → S.T.A.R.S. · LA PALABRA</div></div></div><div class="bd"><div class="read"><h4>Lectura comparada — NBLA + The Message (MSG)</h4><p>Lee Santiago 1:21–25 en la NBLA, desde S.T.A.R.S.. Después lee también en S.T.A.R.S. cómo lo dice The Message. Aquí no hay nada que escribir; lo de hoy va en tu Bitácora.</p><div class="bridge"><div class="br-top"><span class="br-tool"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/><path d="M12 7v6M9.5 9.5h5"/></svg>S.T.A.R.S.</span><span class="br-kind">Lectura de hoy</span></div><div class="br-ref">Santiago 1:21–25</div><p class="br-note">En tu cuaderno la lectura va impresa aquí mismo. No necesitas abrir S.T.A.R.S.</p></div><div class="texto"><div class="tx-h"><span class="pill">NBLA</span>Santiago 1:21–25</div><div class="biblia"><div class="sub">Hacedores de la palabra</div><p class="v"><sup>21</sup>Por lo cual, desechando toda inmundicia y todo resto de malicia, reciban ustedes con humildad la palabra implantada, que es poderosa para salvar sus almas.</p><p class="v"><sup>22</sup>Sean hacedores de la palabra y no solamente oidores que se engañan a sí mismos.</p><p class="v"><sup>23</sup>Porque si alguien es oidor de la palabra, y no hacedor, es semejante a un hombre que mira su rostro natural en un espejo;</p><p class="v"><sup>24</sup>pues después de mirarse a sí mismo e irse, inmediatamente se olvida de qué clase de persona es.</p><p class="v"><sup>25</sup>Pero el que mira atentamente a la ley perfecta, la ley de la libertad, y permanece en ella, no habiéndose vuelto un oidor olvidadizo sino un hacedor eficaz, este será bienaventurado en lo que hace.</p></div><div class="tx-h msg"><span class="pill">MSG</span>The Message · en lenguaje cotidiano</div><div class="msgref">Santiago 1:21–25</div><p class="msgt">Con humildad, deja que Dios, como un jardinero, trabaje tu vida mediante la Palabra y haga crecer en ella el fruto de la salvación. No te engañes pensando que basta con escuchar: sería como dejar entrar la Palabra por un oído y salir por el otro. ¡Haz lo que escuchas! Quien oye sin actuar se parece a alguien que se mira en un espejo, se aleja y poco después no recuerda ni quién es ni cómo se ve. En cambio, quien alcanza a contemplar la instrucción revelada de Dios —la vida en libertad— y persevera en ella no vive distraído, sino que actúa. Esa persona encuentra gozo y afirmación en ponerla en práctica.</p><p class="nota">MSG: lectura complementaria en español, traducida para estudio desde el texto maestro inglés de The Message. No es una edición oficial en español. · Nueva Biblia de las Américas™, NBLA™ · Copyright © 2005 por The Lockman Foundation.</p></div><h4>S · Silencio</h4><p>Antes de leer, haz una pausa. Deja a un lado por un momento lo que quisieras demostrar y pídele a Dios disposición para recibir su Palabra con humildad y ponerla en práctica.</p><h4>T · Texto</h4><p>Lee Santiago 1:21–25 en su contexto. Fíjate en los verbos: recibir, escuchar, hacer, mirar con atención y perseverar. ¿Qué diferencia marca Santiago entre escuchar la Palabra y actuar conforme a ella?</p><h4>A · Análisis</h4><p>Santiago le habla a una comunidad cristiana y le pide recibir la Palabra y vivirla en lo concreto. La imagen del espejo lo dice todo: alguien se mira, ve que está desarreglado, se da la vuelta y sale igualito. El espejo hizo su trabajo; el problema es lo que no se hizo con lo que se vio. El pasaje llama a que la escucha se vuelva obediencia.</p><p>Si quieres ubicar el contexto, lee también Santiago 1:19–27. Ahí aparecen la prontitud para escuchar, la prudencia al hablar y el cuidado de los más vulnerables: la obediencia se ve en la vida con los demás, más allá de un ejercicio interior.</p><h4>R · Reflexión</h4><p>Revisa la respuesta que escribiste el viernes de la Semana 1. ¿Es una intención general, como «voy a cambiar», o una acción que podrías intentar de manera concreta y honesta?</p><h4>S · Siembra</h4><p>Quédate con esta idea: la Palabra que recibo me invita a responder con la vida. Hoy basta con preparar esa respuesta; la vas a usar en tu Bitácora.</p><p>Una cosa es saber cuál es la dirección correcta, y otra preparar el siguiente paso para caminar en ella. Abre BOOKCLUB.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></span><div><div class="k">El libro · Bookclub · Escena 3 de 6</div><div class="h">DESDE THE WAY → BOOKCLUB · LA LECTURA QUE ACOMPAÑA</div></div></div><div class="bd"><div class="read"><p>Lee el capítulo 5 del resumen de <em>Gana la guerra en tu mente</em>, de Craig Groeschel: «Crea una trinchera de la verdad». Si lees el libro completo, busca el capítulo equivalente de tu edición; te va a tomar un poco más de tiempo.</p><div class="bridge"><div class="br-top"><span class="br-tool"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Bookclub</span><span class="br-kind">Lectura que acompaña</span></div><div class="br-ref"><em>Gana la guerra en tu mente</em> · Capítulo 5 · Crea una trinchera de la verdad</div><p class="br-note">El resumen va impreso aquí mismo. No necesitas abrir Bookclub.</p></div><div class="texto resumen"><div class="lt">Capítulo 5 — Crea una trinchera de la verdad</div><p class="lsub"><em>No basta abandonar el viejo camino: necesitas construir deliberadamente uno nuevo</em></p><div class="ll">1. IDEA CENTRAL</div><p class="ld"><strong>Romper un patrón exige algo más que dejar una conducta: necesitas crear intencionalmente un nuevo camino mental construido con una verdad específica que pueda reemplazar al antiguo.</strong></p><div class="ll">2. PROSA EN VOZ DEL AUTOR</div><p>He hecho promesas como todos. “No volveré a obsesionarme con los mensajes.” “Voy a cambiar este hábito.” “Nunca más.” El problema es que solemos concentrarnos en la conducta visible. Queremos dejar de fumar, comer mejor, abandonar una relación tóxica, salir de las redes, dejar la pornografía, leer la Biblia cada mañana. Nos comprometemos sinceramente y, aun así, muchas veces regresamos. El fallo no siempre está en la sinceridad. Estamos tratando de cambiar el resultado sin construir un camino distinto para llegar a él.</p><p>Por eso hago una distinción entre <strong>surco</strong> y <strong>trinchera</strong>. El surco aparece sin intención por haber transitado repetidamente por el mismo lugar. Una trinchera, en cambio, se cava deliberadamente para conducir algo hacia donde queremos que vaya. Si una vía neuronal vieja ha sido fortalecida por pensamientos equivocados, no quiero limitarme a intentar no usarla. Quiero crear otra más profunda y accesible. Mi propuesta es que la materia prima para esa nueva trinchera sea la verdad de Dios.</p><p>Eso significa buscar verdad <strong>específica</strong> para la mentira específica. Si mi surco es el miedo financiero, necesito Escritura que confronte escasez, provisión, contentamiento y generosidad. Si recurro a la comida para anestesiarme, necesito una verdad que me recuerde dónde encontrar refugio y descanso. Si vivo como víctima, necesito verdades que contradigan esa identidad. Si lucho con lujuria, tengo que construir una respuesta que hable directamente a ese terreno. No se trata de coleccionar versículos bonitos; se trata de poner una verdad concreta exactamente donde antes operaba una mentira concreta.</p><p>Después convierto esas verdades en declaraciones personales. Quiero que puedan aparecer en mi mente cuando llegue el detonante. Las escribo, las pongo donde pueda verlas, las llevo conmigo, las escucho, las memorizo. Al principio puede resultar extraño decir algo que todavía no siento plenamente cierto en mi experiencia, pero el propósito no es fingir; es aprender a orientar la mente hacia aquello que creo verdadero según Dios en vez de seguir obedeciendo automáticamente al viejo surco. Groeschel insiste aquí en que la repetición va profundizando esa nueva trinchera.</p><p>Durante años hice esto con mis propias áreas de lucha: aprobación, disciplina, familia, liderazgo, dinero, generosidad y propósito. La estrategia termina siendo sencilla de recordar: <strong>identifica el surco; encuentra la verdad; construye una declaración; escríbela, piénsala y confiésala repetidamente</strong>. Eso no convierte el cambio en algo instantáneo. Lo convierte en algo intencional. La renovación deja de ser un deseo vago y empieza a tener un camino concreto.</p><div class="ll">3. BULLETS DE IMPACTO</div><p class="lb">• Dejar de hacer algo no crea automáticamente una alternativa saludable.</p><p class="lb">• Un surco aparece por repetición; una trinchera se construye con intención.</p><p class="lb">• La verdad debe ser específica para la mentira específica.</p><p class="lb">• Las declaraciones no son frases motivacionales autónomas: Groeschel las deriva de principios bíblicos.</p><p class="lb">• Ver, escribir, pensar y repetir una verdad hace que esté disponible cuando llegue el detonante.</p><p class="lb">• La renovación mental requiere participación deliberada, no simple deseo de cambiar.</p><div class="ll">4. DATO CLAVE O SEÑAL DE ALERTA</div><p class="ld"><strong>No puedes reemplazar un camino mental profundo únicamente diciéndote que ya no quieres recorrerlo; necesitas construir otro.</strong></p><div class="ll">5. REFLEXIÓN</div><p class="ld"><strong>¿Qué has intentado dejar durante años sin preguntarte qué pensamiento debería ocupar intencionalmente el lugar que estás intentando vaciar?</strong></p><div class="ll">6. PRÁCTICA</div><p>Toma el surco identificado en el capítulo anterior y construye hoy <strong>una trinchera de verdad</strong>:</p><p><strong>Mentira:</strong> ________<strong>Verdad bíblica específica:</strong> ________<strong>Mi declaración:</strong> ________</p><p>Pon esa declaración en un lugar visible y léela conscientemente tres veces hoy: mañana, mitad del día y noche.</p></div><p>Groeschel distingue entre el surco que se forma de tanto recorrer el mismo camino y la trinchera que uno construye a propósito. Su propuesta es tener a mano una verdad específica para cuando reaparezca el patrón de siempre.</p><p>Mientras lees, piensa en tu caso: «Si ya tengo una Verdad que he examinado, ¿qué respuesta concreta necesito preparar para que no se quede solamente en mi memoria?».</p><p>Los ejercicios del capítulo son opcionales; tu práctica de hoy está en la Bitácora.</p><p>Vuelve a THE WAY.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20 12 4l9 16z"/><path d="m8 20 4-7 4 7"/></svg></span><div><div class="k">La lección · The Way · Escena 4 de 6</div><div class="h">EN THE WAY · ENSEÑANZA DEL DÍA</div></div></div><div class="bd"><div class="read"><h4>No basta con detenerte: ¿qué harás diferente?</h4><p>¿Cuántas veces has pensado «la próxima vez respondo distinto» y, cuando llegó el momento, no supiste qué hacer? Puede que hayas entendido la enseñanza y aun así no hayas preparado nada para ese momento.</p><p>La semana pasada identificaste un patrón, examinaste una creencia y escribiste una respuesta desde la Verdad. Ayer encontraste tu señal y preparaste una pausa. Hoy falta una pieza: <strong>qué vas a hacer después de detenerte</strong>. La pausa frena la reacción inmediata, pero no decide por ti si escuchas, preguntas, reconoces un error, pones un límite o pides ayuda.</p><p>Te cuento cómo lo vivo yo, porque soy de los reactivos. Me llega un mensaje que cuestiona una decisión que tomé, en la familia o en el trabajo, y antes de terminar de leerlo ya estoy pensando: «¿Y este quién se cree?». Primero viene la suposición sobre lo que esa persona piensa de mí, luego la defensa, y casi sin darme cuenta ya respondí. Cuando practico la verdad de que mi identidad depende de Cristo y no de tener la razón, el camino cambia. Primero considero y escucho: ¿qué me está diciendo realmente? Puede no gustarme, y eso es una cosa; la autoridad que le doy al mensaje es otra. Después detecto: ¿tiene algo de razón? ¿Me está avisando de un error que no quería ver? Y por último respondo con un límite justo: «Tienes razón, me equivoqué, lo voy a reconsiderar», o «Déjame explicarte por qué tomé esa decisión».</p><p>Eso pide Santiago con la imagen del espejo: que lo que escuchamos llegue a la conducta, como respuesta a Jesús y sostenido por su Espíritu. Y es lo que Groeschel llama una trinchera: una respuesta preparada a propósito para cuando vuelva el surco de siempre.</p><p>Vuelve al ejemplo de la propuesta. Al escuchar «necesitamos ajustar tu propuesta», la persona piensa «otra vez fallé», siente el impulso de callarse y recuerda su pausa. Su respuesta nueva podría ser: «Voy a escuchar la observación completa, y después pregunto qué debo corregir y para cuándo».</p><p>No puede controlar lo que piense su jefe ni hacer desaparecer su inseguridad. Sí puede escuchar, pedir precisión y cumplir con lo que le toca. Esa es la diferencia entre una intención general, «voy a ser mejor», y una acción que se puede ver.</p><p>Antes de escribir la tuya, revisa tres cosas: que responda a la verdad que estudiaste, sin ponerle al texto una promesa que no hace; que dependa de ti y no de la reacción de otra persona; y que sea pequeña y reconocible. «Escuchar hasta el final» o «hacer una pregunta concreta» se puede practicar; «nunca volver a reaccionar mal», no.</p><p>Y ojo: no todas las situaciones son para practicar. Si hay abuso, amenaza o una relación que te hace daño, no tienes que exponerte para demostrar avance. Protegerte, poner límites y pedir acompañamiento pueden ser la respuesta responsable.</p><p>Hoy solo preparas. Recupera tu señal y tu pausa y escribe <strong>una acción que vas a intentar cuando aparezca una ocasión parecida y segura</strong>. Mañana miras un intento real; si no se da la oportunidad, puedes ensayarlo y dejarlo marcado como ensayo.</p><p>Así se reentrena: respondiendo en lo cotidiano con fidelidad a Jesús, bajo su Palabra y con la ayuda de su Espíritu.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></span><div><div class="k">Mi Bitácora · Escena 5 de 6</div><div class="h">EN THE WAY · MI BITÁCORA</div></div></div><div class="bd"><div class="read"><h4>Práctica: «mi respuesta preparada»</h4><p>Abre tu Mapa Personal de Renovación; lo que ya escribiste se queda como está. Consulta estas tres piezas:</p><ul><li>Semana 1: la Verdad bíblica examinada y tu primera respuesta nueva.</li><li>Martes de Semana 2: tu señal temprana.</li><li>Martes de Semana 2: tu pausa de regreso.</li></ul><p>Hoy vas a precisar la primera respuesta de la Semana 1, sin borrar cómo la escribiste. Añade solo dos cosas:</p><h4>A. Mi respuesta preparada</h4><p>«Si aparece [la señal temprana que ya registré], después de mi pausa de regreso intentaré [una acción concreta, segura y que dependa de mí]».</p><p>Lo de las semanas anteriores no se vuelve a llenar. Puedes hacer más precisa tu intención inicial, pero deja el registro de cómo empezaste.</p><div class="field"><div class="t">A. Mi respuesta preparada</div><div class="encuaderno"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>Escribe tu respuesta en tu cuaderno.</div></div><h4>B. Cómo reconoceré el intento</h4><p>«Sabré que intenté esta respuesta si hice [un comportamiento observable], aunque no pueda controlar [un resultado externo o una emoción]».</p><p>Esto no es una calificación. Es una forma honesta de reconocer un intento real, sin inventar resultados y sin confundir obediencia con éxito garantizado.</p><div class="field"><div class="t">B. Cómo reconoceré el intento</div><div class="encuaderno"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>Escribe tu respuesta en tu cuaderno.</div></div><div class="ejemplo"><div class="et">Ejemplo ilustrativo</div><p>Ya registrado:</p><p>- Patrón: interpretar una corrección como prueba de incompetencia.</p><p>- Verdad examinada: puedo asumir una corrección específica sin convertirla en un veredicto absoluto sobre mi identidad.</p><p>- Señal temprana: escucho «hay que ajustar esto» y aparece la frase «otra vez fallé».</p><p>- Pausa de regreso: detenerme y distinguir el hecho de la conclusión global que estoy añadiendo.</p><p>Lo que añado hoy:</p><p>- Mi respuesta preparada: «Si me piden corregir una propuesta, después de mi pausa escucharé hasta el final y preguntaré cuáles son los aspectos concretos que debo ajustar».</p><p>- Cómo reconoceré el intento: «Si escuché sin retirarme automáticamente e hice una pregunta de aclaración, habré intentado mi nueva respuesta, aunque continúe incómodo o la propuesta no sea aprobada».</p><p>El ejemplo es una aplicación personal: no es una cita bíblica ni una garantía de resultados.</p></div><h4>Si no sabes qué respuesta preparar</h4><p>No te inventes una acción para llenar el espacio. Puedes escribir «necesito orientación para definir una acción responsable» y buscar una conversación con alguien de confianza. Este ejercicio no te pide exponerte a una situación insegura ni resolver solo problemas complejos.</p><h4>Lo que queda guardado hoy</h4><p>Una respuesta preparada y una manera de reconocer si la intentaste. Tu patrón y tu Ficha Inicial siguen igual, y la práctica se registra cuando ocurra.</p><p class="priv"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/><path d="m9 12 2 2 4-4"/></svg>Tus respuestas son privadas y no tienes obligación de compartirlas.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg></span><div><div class="k">Cierre · Escena 6 de 6</div><div class="h">EN THE WAY · CIERRE Y ORACIÓN</div></div></div><div class="bd"><div class="read"><p>Hoy pasaste de una intención general a una decisión específica. La pausa abre el espacio; la respuesta preparada te ayuda a dar el siguiente paso cuando ese espacio aparece.</p><p>Mañana no vas a rediseñar el plan. Vas a intentarlo en una situación real y segura, o a ensayarlo dejando claro que fue un ensayo. Lo importante será escribir con honestidad lo que pasó.</p><h4>Oración</h4><p>«Señor Jesús, gracias porque tu Palabra no es solamente información que escuchamos. Enséñame a vivir de manera coherente con lo que estoy aprendiendo de Ti. Que tu Espíritu me ayude a reconocer mi respuesta habitual, a recordar la Verdad y a actuar con humildad y responsabilidad. Dame sabiduría para saber cuándo avanzar, cuándo detenerme y cuándo pedir ayuda. Amén».</p><p>Tu Mapa Personal de Renovación sigue creciendo. Mañana sigues con el mismo patrón.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section></section><section class="dia"><div class="hero"><div class="hero-in"><span class="mv">Reentrenar · Semana 2</span><h1>LA VERDAD SE PRACTICA EN EL CAMINO</h1><div class="meta">Día 9 de 20 · Jueves · <em>Filipenses 4:8–9 (contexto 4:4–9)</em></div></div></div><h2 class="ttl3">Las escenas de hoy</h2><div class="escenas"><div class="sc"><span class="n">01</span><span class="nm">Apertura</span><span class="ck"></span></div><div class="sc"><span class="n">02</span><span class="nm">La Palabra · S.T.A.R.S.</span><span class="ck"></span></div><div class="sc"><span class="n">03</span><span class="nm">El libro · Bookclub</span><span class="ck"></span></div><div class="sc"><span class="n">04</span><span class="nm">La lección · The Way</span><span class="ck"></span></div><div class="sc"><span class="n">05</span><span class="nm">Mi Bitácora</span><span class="ck"></span></div><div class="sc"><span class="n">06</span><span class="nm">Cierre</span><span class="ck"></span></div></div><p class="como">Marca cada escena cuando la termines. Se hacen en orden.</p><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg></span><div><div class="k">Apertura · Escena 1 de 6</div></div></div><div class="bd"><div class="read"><h4>Bienvenida</h4><p>Ayer preparaste una respuesta distinta para tu patrón, con las piezas que ya tenías: la señal del martes, tu pausa de regreso y la verdad que reconociste en la Semana 1.</p><p>Hoy toca practicar.</p><p>No tienes que esperar una situación difícil ni exponerte a algo inseguro para cumplir la jornada. Si aparece una oportunidad real y apropiada, intentas tu respuesta. Si no aparece, puedes ensayarla con una situación imaginada. Y si hoy tampoco hay ensayo, lo escribes tal cual: todavía no hubo ocasión.</p><p>Lo que buscamos es aprender a llevar a la vida lo que entendiste de la Palabra. Empieza por S.T.A.R.S.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/><path d="M12 7v6M9.5 9.5h5"/></svg></span><div><div class="k">La Palabra · S.T.A.R.S. · Escena 2 de 6</div><div class="h">DESDE THE WAY → S.T.A.R.S. · LA PALABRA</div></div></div><div class="bd"><div class="read"><h4>Lectura comparada — NBLA + The Message (MSG)</h4><p>Lee Filipenses 4:4–9 completo en la NBLA, desde S.T.A.R.S., y después concéntrate en los versículos 8 y 9. Después lee también en S.T.A.R.S. cómo lo dice The Message. Aquí no hay nada que escribir; lo de hoy va en tu Bitácora.</p><div class="bridge"><div class="br-top"><span class="br-tool"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/><path d="M12 7v6M9.5 9.5h5"/></svg>S.T.A.R.S.</span><span class="br-kind">Lectura de hoy</span></div><div class="br-ref">Filipenses 4:4–9</div><p class="br-note">En tu cuaderno la lectura va impresa aquí mismo. No necesitas abrir S.T.A.R.S.</p></div><div class="texto"><div class="tx-h"><span class="pill">NBLA</span>Filipenses 4:4–9 · con foco en los versículos 8 y 9</div><div class="biblia"><div class="sub">Regocijo y paz en el Señor</div><p class="v"><sup>4</sup>Regocíjense en el Señor siempre. Otra vez lo diré: ¡Regocíjense!</p><p class="v"><sup>5</sup>La bondad de ustedes sea conocida de todos los hombres. El Señor está cerca.</p><p class="v"><sup>6</sup>Por nada estén afanosos; antes bien, en todo, mediante oración y súplica con acción de gracias, sean dadas a conocer sus peticiones delante de Dios.</p><p class="v"><sup>7</sup>Y la paz de Dios, que sobrepasa todo entendimiento, guardará sus corazones y sus mentes en Cristo Jesús.</p><div class="sub">El secreto de la paz</div><p class="v foco"><sup>8</sup>Por lo demás, hermanos, todo lo que es verdadero, todo lo digno, todo lo justo, todo lo puro, todo lo amable, todo lo honorable, si hay alguna virtud o algo que merece elogio, en esto mediten.</p><p class="v foco"><sup>9</sup>Lo que también han aprendido y recibido y oído y visto en mí, esto practiquen, y el Dios de paz estará con ustedes.</p></div><div class="tx-h msg"><span class="pill">MSG</span>The Message · en lenguaje cotidiano</div><div class="msgref">Filipenses 4:4–5</div><p class="msgt">Celebren a Dios todo el día, todos los días. ¡Alégrense de verdad en Él! Que todas las personas con quienes se encuentren puedan ver con claridad que ustedes están de su lado, colaborando con ellas y no enfrentándolas. Ayúdenlas a reconocer que el Señor está cerca: su llegada puede ocurrir en cualquier momento.</p><div class="msgref">Filipenses 4:6–7</div><p class="msgt">No vivan consumidos por la preocupación. En vez de preocuparse, oren. Dejen que sus peticiones y sus alabanzas den forma de oración a sus inquietudes; háganle saber a Dios lo que les preocupa. Entonces la plenitud de Dios, que pone las cosas en su lugar, vendrá a serenarlos. Es maravilloso lo que sucede cuando Cristo ocupa el centro de la vida, en lugar de la preocupación.</p><div class="msgref">Filipenses 4:8–9</div><p class="msgt">En resumen, amigos: les irá mejor si llenan su mente y meditan en lo verdadero, noble, respetable, auténtico, admirable y lleno de gracia; en lo mejor y no lo peor, en lo hermoso y no lo feo, en aquello que merece alabanza y no maldición. Pongan en práctica lo que aprendieron de mí, lo que escucharon, vieron y comprendieron. Hagan esto, y Dios, que hace que todo encuentre su lugar, los incorporará a sus armonías más excelentes.</p><p class="nota">MSG: lectura complementaria en español, traducida para estudio desde el texto maestro inglés de The Message. No es una edición oficial en español. · Nueva Biblia de las Américas™, NBLA™ · Copyright © 2005 por The Lockman Foundation.</p></div><h4>S · Silencio</h4><p>Haz una pausa y suelta por un momento la necesidad de mostrar resultados. Pídele al Señor discernimiento para reconocer lo verdadero y disposición para obedecerle mientras sigues aprendiendo.</p><h4>T · Texto</h4><p>Lee Filipenses 4:4–9 completo y vuelve después a los versículos 8 y 9. Pablo dice en qué pensar y, enseguida, habla de practicar lo que los creyentes han aprendido, recibido, oído y visto.</p><p>Fíjate en dos acciones: considerar lo que merece atención y practicar lo aprendido. ¿Cómo se relacionan en lo que pide Pablo?</p><h4>A · Análisis</h4><p>Cuando Pablo dice «en esto mediten», usa una palabra griega, <em>logízesthe</em>, que habla de considerar algo a propósito, de tenerlo en cuenta, de darle peso. Y la lista incluye lo justo y lo honorable, además de lo que se siente bonito. Por eso esto es pensamiento verdadero, que va más allá del pensamiento positivo: la verdad a veces consuela y a veces confronta.</p><p>El pasaje une la atención y la conducta: lo que ocupa tu pensamiento y la manera en que vives lo aprendido. La paz que promete viene de Dios y guarda el corazón en medio de los problemas, sin garantizar que desaparezcan.</p><h4>R · Reflexión</h4><p>Busca en tu Bitácora la acción que preparaste ayer. ¿Refleja de manera concreta y responsable la Verdad bíblica que has examinado? ¿Puedes intentarla sin depender de controlar a otra persona ni de un resultado externo?</p><h4>S · Siembra</h4><p>Quédate con esta idea: volver a la verdad me ayuda a escoger con más atención lo que voy a hacer. Hoy tu práctica es intentar una respuesta concreta y honesta, sin forzar ninguna emoción.</p><p>Lo que ocupa tu atención influye en lo que decides. Ahora vas a ver en el libro por qué vale la pena volver a propósito a la verdad mientras aprendes a responder distinto. Abre BOOKCLUB.</p></div></div><div class="ft"><span class="ckb"></span>Marcar este paso como listo</div></section><section class="blk"><div class="hd"><span class="ic"><svg width="20" height="20" vi
